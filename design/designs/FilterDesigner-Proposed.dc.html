<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>NI Filter Designer</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="uv-tokens.css">
<link rel="stylesheet" href="ds/ultraviolet/components/bundle.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0;background:#060410}
.fd-plain{background:none;border:0;padding:0;margin:0;font:inherit;color:inherit;cursor:pointer;text-align:inherit}
.ph-select .list button{display:block;width:100%;padding:0 12px;border:0;background:none;text-align:left;font:400 13px/28px var(--font-mono);color:var(--ink);cursor:pointer}
.ph-select .list button:hover{background:var(--bg-300)}
.ph-select .list button.selected{color:var(--uv)}
.fd-cap:hover{color:var(--ink)}
</style>
</helmet>
<div class="ph" style="position: relative; width: 888px; height: 708px; overflow: hidden; font-family: var(--font-mono); color: var(--ink); background: var(--bg-000);">

  <!-- RESPONSE (32, 32, 824 x 288): the whole window's one picture, 10 Hz to 22 kHz in equal steps of pitch across, the dB range up (±6, ±12, ±18 or ±30, clicked in the caption). Back to front: the analyzer (pre, before the filters, faded as plot-dry #6b6b78 at a quarter; post, after them, highlighted as plot-ghost #3a2a66 under a 1.5px ink-dim edge; its own scale, -6 to -84 dBFS), the rulers (line-200 ticks, 9px ink-muted labels, no grid lines), 0 dB as the grey line (the signal untouched), the isolator's bands and every filter alone as 1px plot-ghost #3a2a66, the selected filter alone in ink on a bg-000 casing (what you asked for), the total in uv with its glow (what you get). Handles: the kit's PlotHandle, a 4.5px ink dot on a bg-000 rim, as Bit-Crusher's and Side-Chain's; the selected one uv with its glow; a bypassed one hollow ink-dim. Each carries its slot's number (and L, R, M or S off stereo). The selected Bell, Band Pass or Notch shows its -3 dB edges as two ink-dim ticks, dragged to set Q. The plugin draws the engine's own curves (fd_picture); this board computes them from the same designs. -->
  <div style="position: absolute; left: 32px; top: 32px; width: 824px; height: 288px; box-sizing: border-box; background: var(--bg-000); border: 1px solid var(--line-100);">
    <span style="position: absolute; left: 6px; top: 3px; font: 400 10px/14px var(--font-mono); letter-spacing: .02em; text-transform: uppercase; color: var(--ink-muted);">{{caption}}</span>
    <span style="position: absolute; right: 6px; top: 3px; display: flex; gap: 16px; font: 400 10px/14px var(--font-mono); letter-spacing: .02em; color: var(--ink-muted);">
      <button class="fd-plain fd-cap" style="text-transform: uppercase;" onClick="{{cycleAnalyzer}}" aria-label="Analyzer: pre, post, both or off">{{analyzerText}}</button>
      <button class="fd-plain fd-cap" onClick="{{cycleRange}}" aria-label="The dB range of the picture">{{rangeText}}</button>
    </span>
    <svg viewBox="0 0 812 262" width="812" height="262" style="position: absolute; left: 6px; top: 20px; overflow: visible; touch-action: none; outline: none;" tabIndex="0" role="img" aria-label="Frequency response: double-click to add a filter, drag a handle to move it" onPointerDown="{{wellDown}}" onPointerMove="{{wellMove}}" onPointerUp="{{wellUp}}" onDoubleClick="{{wellDouble}}" onKeyDown="{{wellKey}}">
      <sc-if value="{{showPre}}" hint-placeholder-val="{{false}}">
        <path d="{{preArea}}" fill="#6b6b78" fill-opacity="0.25" stroke="none"></path>
      </sc-if>
      <sc-if value="{{showPost}}" hint-placeholder-val="{{true}}">
        <path d="{{postArea}}" fill="#3a2a66" stroke="none"></path>
        <path d="{{postEdge}}" fill="none" stroke="var(--ink-dim)" stroke-width="1.5" stroke-linejoin="round"></path>
      </sc-if>
      <path d="{{ticks}}" fill="none" stroke="var(--line-200)" stroke-width="1"></path>
      <sc-for list="{{labels}}" as="l" hint-placeholder-count="12">
        <text x="{{l.x}}" y="{{l.y}}" text-anchor="{{l.anchor}}" fill="var(--ink-muted)" style="font: 400 9px var(--font-mono);">{{l.text}}</text>
      </sc-for>
      <path d="{{zeroLine}}" fill="none" stroke="#6b6b78" stroke-width="1.5"></path>
      <sc-for list="{{ghosts}}" as="g" hint-placeholder-count="5">
        <path d="{{g.d}}" fill="none" stroke="#3a2a66" stroke-width="1" stroke-linejoin="round"></path>
      </sc-for>
      <sc-if value="{{isoShown}}" hint-placeholder-val="{{false}}">
        <path d="{{xoRules}}" fill="none" stroke="var(--line-200)" stroke-width="1"></path>
        <path d="{{xoTabs}}" fill="var(--ink-dim)" stroke="none"></path>
      </sc-if>
      <path d="{{ownCurve}}" fill="none" stroke="var(--bg-000)" stroke-width="4" stroke-linejoin="round"></path>
      <path d="{{ownCurve}}" fill="none" stroke="var(--ink)" stroke-width="1.5" stroke-linejoin="round"></path>
      <path d="{{totalCurve}}" fill="none" stroke="var(--uv)" stroke-width="2" stroke-linejoin="round" style="filter: drop-shadow(0 0 3px var(--uv-deep));"></path>
      <path d="{{widthTicks}}" fill="none" stroke="var(--ink-dim)" stroke-width="1"></path>
      <sc-for list="{{handles}}" as="h" hint-placeholder-count="5">
        <circle cx="{{h.x}}" cy="{{h.y}}" r="4.5" fill="{{h.fill}}" stroke="{{h.stroke}}" stroke-width="1.5" style="{{h.style}}"></circle>
        <text x="{{h.tx}}" y="{{h.ty}}" fill="{{h.textFill}}" style="font: 400 9px var(--font-mono);">{{h.label}}</text>
      </sc-for>
    </svg>
  </div>

  <!-- NODE ROW (y 344): sixteen slots, 40px cells 8 apart as the StepGrid, and the ISOLATOR cell at the well's right edge. A cell shows its slot's number and its type's glyph (16px, 1.5px stroke, square caps): uv while it plays, ink-dim while bypassed, nothing while empty; the selected cell's border is uv with glow-focus. Click selects; Alt-click bypasses. -->
  <sc-for list="{{cells}}" as="c" hint-placeholder-count="17">
    <button class="fd-plain" style="{{c.style}}" onClick="{{c.click}}" aria-label="{{c.aria}}" aria-pressed="{{c.selected}}">
      <span style="{{c.numStyle}}">{{c.n}}</span>
      <sc-if value="{{c.hasGlyph}}" hint-placeholder-val="{{true}}">
        <svg viewBox="0 0 16 16" width="16" height="16" style="position: absolute; left: 11px; top: 17px;" fill="none" stroke="{{c.glyphColor}}" stroke-width="1.5" stroke-linecap="square" stroke-linejoin="miter" aria-hidden="true"><path d="{{c.glyph}}"></path></svg>
      </sc-if>
    </button>
  </sc-for>

  <!-- INSPECTOR (32, 408, 544 x 232): the selected cell. A filter: four selects (Type, Family, Order, Channel), then five knobs (Freq, Gain, Q, Ripple, Stopband); what the type does not use is drawn disabled, never hidden, so nothing moves when the type changes. The isolator: Low, Mid, High, Lower, Upper and Slope, a Kill under each band. On, at the title's right, is the slot's or the isolator's switch. -->
  <section class="ph-panel" style="position: absolute; left: 32px; top: 408px; width: 544px; height: 232px; box-sizing: border-box; margin: 0;" aria-label="{{inspectorTitle}}">
    <h2 class="ph-title" style="margin: 0 0 12px;">{{inspectorTitle}}</h2>
    <button class="fd-plain {{onToggle.cls}}" style="position: absolute; right: 16px; top: 14px;" onClick="{{onToggle.click}}"><span class="sw"></span><span class="ph-label">On</span></button>
    <sc-if value="{{showNode}}" hint-placeholder-val="{{true}}">
      <div style="display: flex; gap: 16px;">
        <sc-for list="{{selects}}" as="s" hint-placeholder-count="4">
          <div style="display: flex; flex-direction: column; gap: 8px; width: {{s.w}}px;">
            <span class="ph-label" style="text-align: left; color: {{s.labelColor}};">{{s.label}}</span>
            <div class="ph-select {{s.openCls}}" style="min-width: 0; width: 100%;">
              <button class="fd-plain field" style="{{s.fieldStyle}}" onClick="{{s.toggle}}" aria-haspopup="listbox" aria-label="{{s.label}}">{{s.value}}<svg class="ph-icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="square"><path d="M4.5 6.5l3.5 3.5 3.5-3.5"></path></svg></button>
              <sc-if value="{{s.open}}" hint-placeholder-val="{{false}}">
                <div class="list" role="listbox" style="top: auto; bottom: 27px;">
                  <sc-for list="{{s.options}}" as="o" hint-placeholder-count="6">
                    <button class="{{o.cls}}" onClick="{{o.pick}}" role="option">{{o.text}}</button>
                  </sc-for>
                </div>
              </sc-if>
            </div>
          </div>
        </sc-for>
      </div>
      <div style="margin-top: 16px; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); column-gap: 8px;">
        <sc-for list="{{nodeKnobs}}" as="k" hint-placeholder-count="5">
          <div class="ph-knob {{k.cls}}" style="width: 100%;">
            <span class="ph-label">{{k.label}}</span>
            <svg viewBox="0 0 48 48" style="cursor: ns-resize; touch-action: none;" onPointerDown="{{k.down}}" onPointerMove="{{knobMove}}" onPointerUp="{{knobUp}}" onDoubleClick="{{k.reset}}" role="slider" aria-label="{{k.label}}" aria-valuetext="{{k.aria}}">
              <circle class="disc" cx="24" cy="24" r="16"></circle>
              <path class="rail" d="{{k.rail}}"></path>
              <path class="arc" d="{{k.arc}}"></path>
              <path class="ptr" d="{{k.ptr}}"></path>
            </svg>
            <span class="ph-readout {{k.roCls}}" style="min-width: 0; width: 84px; box-sizing: border-box;">{{k.value}}<span class="unit">{{k.unit}}</span></span>
          </div>
        </sc-for>
      </div>
    </sc-if>
    <sc-if value="{{showIso}}" hint-placeholder-val="{{false}}">
      <div style="display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); column-gap: 8px;">
        <sc-for list="{{isoKnobs}}" as="k" hint-placeholder-count="6">
          <div class="ph-knob {{k.cls}}" style="width: 100%;">
            <span class="ph-label">{{k.label}}</span>
            <svg viewBox="0 0 48 48" style="cursor: ns-resize; touch-action: none;" onPointerDown="{{k.down}}" onPointerMove="{{knobMove}}" onPointerUp="{{knobUp}}" onDoubleClick="{{k.reset}}" role="slider" aria-label="{{k.label}}" aria-valuetext="{{k.aria}}">
              <circle class="disc" cx="24" cy="24" r="16"></circle>
              <path class="rail" d="{{k.rail}}"></path>
              <path class="arc" d="{{k.arc}}"></path>
              <path class="ptr" d="{{k.ptr}}"></path>
            </svg>
            <span class="ph-readout {{k.roCls}}" style="min-width: 0; width: 72px; box-sizing: border-box;">{{k.value}}<span class="unit">{{k.unit}}</span></span>
          </div>
        </sc-for>
      </div>
      <div style="margin-top: 12px; height: 28px; display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); column-gap: 8px; align-items: center; justify-items: center;">
        <sc-for list="{{kills}}" as="t" hint-placeholder-count="3">
          <button class="fd-plain {{t.cls}}" onClick="{{t.click}}"><span class="sw"></span><span class="ph-label">Kill</span></button>
        </sc-for>
      </div>
    </sc-if>
  </section>

  <!-- OUTPUT (592, 408, 264 x 232): what applies to every filter. Output (bipolar, ±24 dB), Scale (every gain at once, ±200 %), Adaptive (proportional Q for bells), and Bypass (the plugin's bypass, crossfaded in 10 ms). -->
  <section class="ph-panel" style="position: absolute; left: 592px; top: 408px; width: 264px; height: 232px; box-sizing: border-box; margin: 0;" aria-label="Output">
    <h2 class="ph-title" style="margin: 0 0 12px;">Output</h2>
    <div style="display: flex; gap: 16px;">
      <sc-for list="{{outKnobs}}" as="k" hint-placeholder-count="2">
        <div class="ph-knob {{k.cls}}">
          <span class="ph-label">{{k.label}}</span>
          <svg viewBox="0 0 48 48" style="cursor: ns-resize; touch-action: none;" onPointerDown="{{k.down}}" onPointerMove="{{knobMove}}" onPointerUp="{{knobUp}}" onDoubleClick="{{k.reset}}" role="slider" aria-label="{{k.label}}" aria-valuetext="{{k.aria}}">
            <circle class="disc" cx="24" cy="24" r="16"></circle>
            <path class="rail" d="{{k.rail}}"></path>
            <path class="arc" d="{{k.arc}}"></path>
            <path class="ptr" d="{{k.ptr}}"></path>
          </svg>
          <span class="ph-readout {{k.roCls}}" style="min-width: 0; width: 72px; box-sizing: border-box;">{{k.value}}<span class="unit">{{k.unit}}</span></span>
        </div>
      </sc-for>
    </div>
    <div style="margin-top: 12px; height: 28px; display: flex; align-items: center; justify-content: space-between;">
      <button class="fd-plain {{adaptive.cls}}" onClick="{{adaptive.click}}"><span class="sw"></span><span class="ph-label">Adaptive</span></button>
      <button class="fd-plain {{bypass.cls}}" onClick="{{bypass.click}}"><span class="sw"></span><span class="ph-label">Bypass</span></button>
    </div>
  </section>

  <!-- THE HINT (0, 664, 888 x 44): three conventions, the signature. -->
  <div class="ph-hint" style="position: absolute; left: 0; top: 664px; width: 888px; height: 44px; box-sizing: border-box; padding: 0 32px 16px; align-items: center;">
    <span class="tips"><b>double-click</b> to add a filter<span class="sep">—</span><b>drag</b> it, <b>alt</b> for Q, <b>shift</b> for fine<span class="sep">—</span><b>delete</b> removes it</span>
    <span class="ph-sig"><span class="mark"></span>Neon Ingvy</span>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":888,"height":708}}'>
class Component extends DCLogic {
  /* THE FILTER MATH, built once: analog prototypes (Butterworth, Bessel,
   * Chebyshev I and II, Elliptic, Linkwitz-Riley), normalised to -3 dB at
   * Freq (-6 dB for Linkwitz-Riley) and laid on the bilinear transform's
   * warped axis at 48 kHz; the EQ shapes as their analog magnitudes, which
   * the engine's matched designs follow up to Nyquist. */
  fd() {
    if (this._fd) return this._fd;
    const FS = 48000;
    const C = {
      add: (a, b) => [a[0] + b[0], a[1] + b[1]],
      sub: (a, b) => [a[0] - b[0], a[1] - b[1]],
      mul: (a, b) => [a[0] * b[0] - a[1] * b[1], a[0] * b[1] + a[1] * b[0]],
      div: (a, b) => { const d = b[0] * b[0] + b[1] * b[1]; return [(a[0] * b[0] + a[1] * b[1]) / d, (a[1] * b[0] - a[0] * b[1]) / d]; },
      scale: (a, k) => [a[0] * k, a[1] * k],
      abs: (a) => Math.hypot(a[0], a[1]),
      sqrt: (a) => { const r = Math.hypot(a[0], a[1]); const re = Math.sqrt(Math.max(0, (r + a[0]) / 2)); const im = Math.sqrt(Math.max(0, (r - a[0]) / 2)); return [re, a[1] < 0 ? -im : im]; },
      cos: (a) => [Math.cos(a[0]) * Math.cosh(a[1]), -Math.sin(a[0]) * Math.sinh(a[1])],
      sin: (a) => [Math.sin(a[0]) * Math.cosh(a[1]), Math.cos(a[0]) * Math.sinh(a[1])],
      log: (a) => [Math.log(Math.hypot(a[0], a[1])), Math.atan2(a[1], a[0])],
    };
    C.asin = (z) => { const iz = [-z[1], z[0]]; const w = C.log(C.add(iz, C.sqrt(C.sub([1, 0], C.mul(z, z))))); return [w[1], -w[0]]; };

    /* Elliptic functions by Landen's transformation (Orfanidis, Lecture Notes on
     * Elliptic Filter Design, 2006). */
    const landen = (k) => { const v = []; for (let i = 0; i < 7; i++) { k = Math.pow(k / (1 + Math.sqrt(1 - k * k)), 2); v.push(k); } return v; };
    const cde = (u, k) => { const v = landen(k); let w = C.cos(C.scale(u, Math.PI / 2)); for (let i = v.length - 1; i >= 0; i--) w = C.div(C.scale(w, 1 + v[i]), C.add([1, 0], C.scale(C.mul(w, w), v[i]))); return w; };
    const sne = (u, k) => { const v = landen(k); let w = C.sin(C.scale(u, Math.PI / 2)); for (let i = v.length - 1; i >= 0; i--) w = C.div(C.scale(w, 1 + v[i]), C.add([1, 0], C.scale(C.mul(w, w), v[i]))); return w; };
    const asne = (w, k) => { const v = landen(k); for (let i = 0; i < v.length; i++) { const v1 = i === 0 ? k : v[i - 1]; w = C.scale(C.div(w, C.add([1, 0], C.sqrt(C.sub([1, 0], C.scale(C.mul(w, w), v1 * v1))))), 2 / (1 + v[i])); } return C.scale(C.asin(w), 2 / Math.PI); };
    const ellipdeg = (n, k1) => { const k1p = Math.sqrt(1 - k1 * k1); let prod = 1; for (let i = 1; i <= Math.floor(n / 2); i++) prod *= Math.pow(sne([(2 * i - 1) / n, 0], k1p)[0], 4); const kp = Math.pow(k1p, n) * prod; return Math.sqrt(1 - kp * kp); };

    /* A prototype: sections of one or two poles (and their zeros), each at unity
     * gain at DC, times `dc`. */
    const pair = (p, z) => ({ ps: [p, [p[0], -p[1]]], zs: z ? [z, [z[0], -z[1]]] : [] });
    const single = (p) => ({ ps: [[p, 0]], zs: [] });
    const butterPoles = (n) => {
      const out = [];
      for (let k = 0; k < Math.floor(n / 2); k++) { const t = Math.PI * (2 * k + n + 1) / (2 * n); out.push(pair([Math.cos(t), Math.sin(t)])); }
      if (n % 2) out.push(single(-1));
      return out;
    };
    const besselPoles = (n) => {
      /* The reverse Bessel polynomial's roots, by Durand-Kerner. */
      const fact = (m) => { let f = 1; for (let i = 2; i <= m; i++) f *= i; return f; };
      const a = []; for (let k = 0; k <= n; k++) a.push(fact(2 * n - k) / (Math.pow(2, n - k) * fact(k) * fact(n - k)));
      const poly = (s) => { let y = [a[n], 0]; for (let k = n - 1; k >= 0; k--) y = C.add(C.mul(y, s), [a[k], 0]); return y; };
      let r = []; for (let i = 0; i < n; i++) r.push([Math.cos(2 * Math.PI * i / n + 0.4) * 1.5, Math.sin(2 * Math.PI * i / n + 0.4) * 1.5]);
      for (let it = 0; it < 200; it++) {
        r = r.map((ri, i) => { let d = [a[n], 0]; r.forEach((rj, j) => { if (j !== i) d = C.mul(d, C.sub(ri, rj)); }); return C.sub(ri, C.div(poly(ri), d)); });
      }
      const out = [];
      r.filter((p) => p[1] > 1e-9).forEach((p) => out.push(pair(p)));
      r.filter((p) => Math.abs(p[1]) <= 1e-9).forEach((p) => out.push(single(p[0])));
      return out;
    };
    const cheby1 = (n, ripple) => {
      const e = Math.sqrt(Math.pow(10, ripple / 10) - 1), a = Math.asinh(1 / e) / n, out = [];
      for (let k = 0; k < Math.floor(n / 2); k++) { const t = Math.PI * (2 * k + 1) / (2 * n); out.push(pair([-Math.sinh(a) * Math.sin(t), Math.cosh(a) * Math.cos(t)])); }
      if (n % 2) out.push(single(-Math.sinh(a)));
      return { sections: out, dc: n % 2 ? 1 : 1 / Math.sqrt(1 + e * e) };
    };
    const cheby2 = (n, stop) => {
      const e = 1 / Math.sqrt(Math.pow(10, stop / 10) - 1), a = Math.asinh(1 / e) / n, out = [];
      for (let k = 0; k < Math.floor(n / 2); k++) {
        const t = Math.PI * (2 * k + 1) / (2 * n);
        const q = [-Math.sinh(a) * Math.sin(t), Math.cosh(a) * Math.cos(t)];
        out.push(pair(C.div([1, 0], q), [0, 1 / Math.cos(t)]));
      }
      if (n % 2) out.push(single(-1 / Math.sinh(a)));
      return { sections: out, dc: 1 };
    };
    const ellip = (n, ripple, stop) => {
      const ep = Math.sqrt(Math.pow(10, ripple / 10) - 1), es = Math.sqrt(Math.pow(10, stop / 10) - 1);
      const k1 = ep / es, k = ellipdeg(n, k1), out = [];
      const v0 = C.scale(asne([0, 1 / ep], k1), 1 / n)[1];
      for (let i = 1; i <= Math.floor(n / 2); i++) {
        const u = (2 * i - 1) / n, zeta = cde([u, 0], k)[0];
        const p = C.mul([0, 1], cde([u, -v0], k));
        out.push(pair(p, [0, 1 / (k * zeta)]));
      }
      if (n % 2) out.push(single(C.mul([0, 1], sne([0, v0], k))[0]));
      return { sections: out, dc: n % 2 ? 1 : Math.pow(10, -ripple / 20) };
    };

    const sectionAt = (sec, x) => {
      const s = [0, x];
      let num = 1, den = 1;
      sec.ps.forEach((p) => { den *= C.abs(C.sub(s, p)); num *= C.abs(p); });
      sec.zs.forEach((z) => { num *= C.abs(C.sub(s, z)); den *= C.abs(z); });
      return num / den;
    };
    const protoAt = (proto, x) => proto.sections.reduce((m, sec) => m * sectionAt(sec, x), proto.dc);

    /* -3 dB at 1 for every family; Linkwitz-Riley -6 dB, so a pair sums flat. */
    const normalise = (proto) => {
      let lo = 1e-3, prev = lo;
      for (let i = 1; i <= 600; i++) {
        const x = 1e-3 * Math.pow(1e6, i / 600);
        if (protoAt(proto, x) < Math.SQRT1_2) { lo = prev; let hi = x; for (let j = 0; j < 60; j++) { const m = Math.sqrt(lo * hi); if (protoAt(proto, m) < Math.SQRT1_2) hi = m; else lo = m; } return Math.sqrt(lo * hi); }
        prev = x;
      }
      return 1;
    };
    const protoCache = new Map();
    const prototype = (family, order, ripple, stop) => {
      const key = [family, order, ripple.toFixed(3), stop.toFixed(2)].join('|');
      if (protoCache.has(key)) return protoCache.get(key);
      let proto;
      if (family === 'Bessel') proto = { sections: besselPoles(order), dc: 1 };
      else if (family === 'Chebyshev I') proto = cheby1(order, ripple);
      else if (family === 'Chebyshev II') proto = cheby2(order, stop);
      else if (family === 'Elliptic') proto = order === 1 ? { sections: butterPoles(1), dc: 1 } : ellip(order, ripple, stop);
      else if (family === 'Linkwitz-Riley') { const half = butterPoles(Math.max(1, Math.ceil(order / 2))); proto = { sections: half.concat(half.map((s) => ({ ps: s.ps.slice(), zs: s.zs.slice() }))), dc: 1 }; }
      else proto = { sections: butterPoles(order), dc: 1 };
      proto.w3 = family === 'Butterworth' || family === 'Linkwitz-Riley' ? 1 : normalise(proto);
      if (protoCache.size > 200) protoCache.clear();
      protoCache.set(key, proto);
      return proto;
    };
    /* Q on a high-pass or low-pass: the section with the highest Q, its Q times Q / 0.7071, at the same |p|. */
    const resonate = (proto, q) => {
      let best = -1, bestQ = 0;
      proto.sections.forEach((sec, i) => {
        if (sec.ps.length !== 2 || Math.abs(sec.ps[0][1]) < 1e-12) return;
        const p = sec.ps[0], qq = C.abs(p) / (-2 * p[0]);
        if (qq > bestQ) { bestQ = qq; best = i; }
      });
      if (best < 0 || Math.abs(q - Math.SQRT1_2) < 1e-6) return proto;
      const sec = proto.sections[best], w0 = C.abs(sec.ps[0]);
      const qn = Math.min(40, bestQ * q / Math.SQRT1_2), sigma = -w0 / (2 * qn);
      const d = w0 * w0 - sigma * sigma;
      const ps = d >= 0 ? [[sigma, Math.sqrt(d)], [sigma, -Math.sqrt(d)]] : [[sigma + Math.sqrt(-d), 0], [sigma - Math.sqrt(-d), 0]];
      const sections = proto.sections.slice();
      sections[best] = { ps, zs: sec.zs };
      return Object.assign({}, proto, { sections });
    };

    const warp = (f) => Math.tan(Math.PI * Math.min(f, 0.499 * FS) / FS);
    const db = (m) => 20 * Math.log10(Math.max(m, 1e-9));

    /* One node's response in dB at `f`. */
    const GAIN_TYPES = ['Bell', 'Low Shelf', 'High Shelf', 'Tilt'];
    const nodeDb = (n, f, opts) => {
      const scale = (opts && opts.scale != null ? opts.scale : 100) / 100;
      const adaptive = opts && opts.adaptive;
      const G = n.gain * scale;
      const w = f / n.freq;
      if (n.type === 'Bell') {
        const A = Math.pow(10, G / 40), Q = adaptive ? n.q * Math.pow(10, Math.abs(G) / 40) : n.q;
        const re = 1 - w * w;
        return db(Math.hypot(re, w * A / Q) / Math.hypot(re, w / (A * Q)));
      }
      if (n.type === 'Low Shelf' || n.type === 'High Shelf') {
        /* Order 1 a one-pole shelf; 2..4 a cascade of shelving sections on
         * Butterworth angles (Holters-Zolzer), the top one's Q from the knob. */
        const order = Math.max(1, Math.min(4, n.order)), low = n.type === 'Low Shelf';
        let total = 0;
        const halves = Math.floor(order / 2);
        for (let k = 0; k < halves; k++) {
          let Q = 1 / (2 * Math.sin(Math.PI * (2 * k + 1) / (2 * order)));
          if (k === halves - 1) Q *= n.q / Math.SQRT1_2;
          const g = G * 2 / order, A = Math.pow(10, g / 40), r = Math.sqrt(A) / Q, re1 = low ? A - w * w : 1 - A * w * w, re2 = low ? 1 - A * w * w : A - w * w;
          total += db(A * Math.hypot(re1, r * w) / Math.hypot(re2, r * w));
        }
        if (order % 2) {
          const g = Math.pow(10, (G / order) / 20), a = low ? 1 / Math.sqrt(g) : Math.sqrt(g);
          total += low ? db(Math.hypot(g * a, w) / Math.hypot(a, w)) : db(Math.hypot(a, g * w) / Math.hypot(a, w));
        }
        return total;
      }
      if (n.type === 'Tilt') {
        const g = Math.sqrt(Math.pow(10, G / 20));
        return db(Math.hypot(1, g * w) / Math.hypot(g, w));
      }
      if (n.type === 'All-Pass' || n.type === 'None') return 0;
      const family = (n.type === 'Band-Pass' || n.type === 'Notch') && n.family === 'Linkwitz-Riley' ? 'Butterworth' : n.family;
      let proto = prototype(family, n.order, n.ripple, n.stopband);
      const W = warp(f);
      if (n.type === 'High-Pass' || n.type === 'Low-Pass') {
        if (n.order >= 2) proto = resonate(proto, n.q);
        const x = n.type === 'Low-Pass' ? W / warp(n.freq) : warp(n.freq) / W;
        return db(protoAt(proto, x * proto.w3));
      }
      /* Band Pass and Notch: Freq the centre, Q the -3 dB edges, both prewarped. */
      const h = 1 / (2 * n.q), r = Math.sqrt(1 + h * h);
      const w1 = warp(n.freq * (r - h)), w2 = warp(n.freq * (r + h)), w0 = Math.sqrt(w1 * w2), B = w2 - w1;
      const x = n.type === 'Band-Pass' ? (W * W - w0 * w0) / (B * W) : (B * W) / (w0 * w0 - W * W);
      return db(protoAt(proto, Math.min(Math.abs(x), 1e9) * proto.w3));
    };

    /* The isolator: Linkwitz-Riley crossovers, the low band through the upper
     * crossover's all-pass, as complex responses so the bands sum honestly. */
    const lrAt = (f, fc, slope) => {
      const s = [0, warp(f) / warp(fc)];
      const qs = slope === 48 ? [1 / (2 * Math.cos(Math.PI / 8)), 1 / (2 * Math.cos(3 * Math.PI / 8))] : [Math.SQRT1_2];
      let lp = [1, 0], hp = [1, 0];
      qs.forEach((q) => {
        const den = C.add(C.add(C.mul(s, s), C.scale(s, 1 / q)), [1, 0]);
        lp = C.div(lp, den);
        hp = C.mul(hp, C.div(C.mul(s, s), den));
      });
      return { lp: C.mul(lp, lp), hp: C.mul(hp, hp) };
    };
    const isoBands = (iso, f) => {
      const lin = (g, kill) => (kill || g <= -60 ? 0 : Math.pow(10, g / 20));
      const hi = Math.max(iso.upper, iso.lower);
      const a = lrAt(f, iso.lower, iso.slope), b = lrAt(f, hi, iso.slope);
      const low = C.scale(C.mul(a.lp, C.add(b.lp, b.hp)), lin(iso.low, iso.killLow));
      const mid = C.scale(C.mul(a.hp, b.lp), lin(iso.mid, iso.killMid));
      const high = C.scale(C.mul(a.hp, b.hp), lin(iso.high, iso.killHigh));
      return { low: db(C.abs(low)), mid: db(C.abs(mid)), high: db(C.abs(high)), total: db(C.abs(C.add(C.add(low, mid), high))) };
    };
    this._fd = { nodeDb, isoBands, FS };
    return this._fd;
  }

  st() {
    if (this.state && this.state.nodes) return this.state;
    const blank = (i) => ({ type: 'None', on: true, family: 'Butterworth', order: 2, freq: 30 * Math.pow(16000 / 30, i / 15), gain: 0, q: Math.SQRT1_2, ripple: 1, stopband: 60, channel: 'Stereo' });
    const nodes = [];
    for (let i = 0; i < 16; i++) nodes.push(blank(i));
    Object.assign(nodes[0], { type: 'High-Pass', freq: 30, order: 4 });
    Object.assign(nodes[1], { type: 'Bell', freq: 250, gain: -3, q: 1.0 });
    Object.assign(nodes[2], { type: 'Notch', freq: 3200, order: 1, q: 4 });
    Object.assign(nodes[3], { type: 'High Shelf', freq: 10000, gain: 2, order: 2 });
    Object.assign(nodes[4], { type: 'Low-Pass', freq: 18000, family: 'Elliptic', order: 6, ripple: 0.5, stopband: 60 });
    return {
      nodes, sel: 4, open: null, range: 18, analyzer: 'Both',
      iso: { on: false, low: 0, mid: 0, high: 0, killLow: false, killMid: false, killHigh: false, lower: 250, upper: 2500, slope: 24 },
      output: 0, scale: 100, adaptive: false, bypass: false,
    };
  }

  renderVals() {
    const { nodeDb, isoBands } = this.fd();
    const s = this.st();
    const self = this;
    const TYPES = ['None', 'Bell', 'Low Shelf', 'High Shelf', 'High-Pass', 'Low-Pass', 'Band-Pass', 'Notch', 'All-Pass', 'Tilt'];
    const FAMILIES = ['Butterworth', 'Bessel', 'Chebyshev I', 'Chebyshev II', 'Elliptic', 'Linkwitz-Riley'];
    const CHANNELS = ['Stereo', 'Left', 'Right', 'Mid', 'Side'];
    const GAIN_TYPES = ['Bell', 'Low Shelf', 'High Shelf', 'Tilt'];
    const CUTS = ['High-Pass', 'Low-Pass'];
    const FAMILY_TYPES = ['High-Pass', 'Low-Pass', 'Band-Pass', 'Notch'];
    const ORDER_TYPES = ['Low Shelf', 'High Shelf', 'High-Pass', 'Low-Pass', 'Band-Pass', 'Notch', 'All-Pass'];
    const GLYPHS = {
      'Bell': 'M1 12H4.5C6.5 12 6.5 4 8 4S9.5 12 11.5 12H15',
      'Low Shelf': 'M1 5H5L9 11H15',
      'High Shelf': 'M1 11H7L11 5H15',
      'High-Pass': 'M2 14C4 7 5 5 8.5 5H15',
      'Low-Pass': 'M1 5H7.5C11 5 12 7 14 14',
      'Band-Pass': 'M1 13C5 13 6 4 8 4S11 13 15 13',
      'Notch': 'M1 5H6L8 13L10 5H15',
      'All-Pass': 'M1 5H15M2 11C4 8 6 8 8 11S12 14 14 11',
      'Tilt': 'M1 12L15 4',
    };

    /* THE WELL, in the svg's units: the plot x 30..812, y 0..248. */
    const AX = 30, AW = 782, AH = 248, LO = 10, HI = 22000, SPAN = Math.log(HI / LO);
    const R = s.range;
    const fx = (f) => AX + AW * Math.log(f / LO) / SPAN;
    const fOfX = (x) => Math.max(LO, Math.min(HI, LO * Math.exp(SPAN * (x - AX) / AW)));
    const gy = (d) => AH * (R - Math.max(-R - 1, Math.min(R + 1, d))) / (2 * R);
    const gOfY = (y) => R - 2 * R * y / AH;
    const path = (pts) => pts.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join('');
    const freqs = [];
    for (let i = 0; i <= 390; i++) freqs.push(LO * Math.exp(SPAN * i / 390));
    const opts = { scale: s.scale, adaptive: s.adaptive };
    const isGain = (n) => GAIN_TYPES.indexOf(n.type) >= 0;
    const active = (n) => n.type !== 'None' && n.on;
    const curveOf = (fn) => freqs.map((f) => [fx(f), gy(fn(f))]);

    /* Each filter alone, the isolator, the total. */
    const nodeCurves = s.nodes.map((n) => (n.type === 'None' ? null : freqs.map((f) => nodeDb(n, f, opts))));
    const isoOn = s.iso.on;
    const isoCurves = freqs.map((f) => isoBands(s.iso, f));
    const total = freqs.map((f, i) => {
      let d = s.output + (isoOn ? isoCurves[i].total : 0);
      s.nodes.forEach((n, j) => { if (active(n)) d += nodeCurves[j][i]; });
      return d;
    });
    const ghosts = [];
    s.nodes.forEach((n, j) => { if (active(n) && j !== s.sel) ghosts.push({ d: path(nodeCurves[j].map((d, i) => [fx(freqs[i]), gy(d)])) }); });
    const isoSel = s.sel === 'iso';
    if (isoOn || isoSel) ['low', 'mid', 'high'].forEach((b) => ghosts.push({ d: path(isoCurves.map((c, i) => [fx(freqs[i]), gy(c[b])])) }));
    const selNode = isoSel ? null : s.nodes[s.sel];
    let ownCurve = '';
    if (isoSel) ownCurve = path(isoCurves.map((c, i) => [fx(freqs[i]), gy(c.total)]));
    else if (selNode && selNode.type !== 'None') ownCurve = path(nodeCurves[s.sel].map((d, i) => [fx(freqs[i]), gy(d)]));

    /* The analyzer: a stand-in mix (a kick, a body, falling 3 dB an octave
     * above 300 Hz), the same frame before and after the filters. */
    const music = (f) => {
      const o = Math.log2(f);
      return -34 + 6 * Math.exp(-Math.pow(Math.log2(f / 58), 2) / 0.35) + 3 * Math.exp(-Math.pow(Math.log2(f / 220), 2) / 0.8)
        - 3.2 * Math.max(0, Math.log2(f / 300)) - 14 * Math.max(0, Math.log2(36 / f)) - 9 * Math.max(0, Math.log2(f / 15000))
        + 2.2 * Math.sin(37 * o) + 1.3 * Math.sin(91 * o + 1.7) + 0.8 * Math.sin(211 * o + 0.4);
    };
    const ay = (d) => Math.max(0, Math.min(AH, AH * (-6 - d) / 78));
    const area = (fn) => path([[AX, AH]].concat(freqs.map((f, i) => [fx(f), ay(fn(f, i))])).concat([[AX + AW, AH]])) + 'Z';
    const preArea = area((f) => music(f));
    const postArea = area((f, i) => music(f) + total[i]);
    const postEdge = path(freqs.map((f, i) => [fx(f), ay(music(f) + total[i])]));

    /* RULERS: 20, 50, 100 ... 20k named, a minor tick at every whole
     * multiple; the dB range named in steps of a third of it or so. */
    const tick = (pts) => pts.map(([x, y, dx, dy]) => 'M' + x.toFixed(1) + ' ' + y.toFixed(1) + 'l' + dx + ' ' + dy).join('');
    const xLabel = (x, text) => ({ x: Math.min(AX + AW - 3 * text.length, Math.max(AX + 3 * text.length, x)).toFixed(1), y: AH + 12, anchor: 'middle', text });
    const yLabel = (y, text) => ({ x: AX - 5, y: Math.min(AH, Math.max(7, y + 3)).toFixed(1), anchor: 'end', text });
    const minor = [], labels = [];
    for (let decade = 10; decade <= 10000; decade *= 10) {
      for (let k = 1; k <= 9; k++) {
        const f = decade * k;
        if (f > HI) continue;
        const named = (k === 1 || k === 2 || k === 5) && f >= 20;
        minor.push([fx(f), AH, 0, named ? 3 : 2]);
        if (named) labels.push(xLabel(fx(f), f >= 1000 ? (f / 1000) + 'k' : String(f)));
      }
    }
    const step = { 6: 3, 12: 6, 18: 6, 30: 10 }[R];
    for (let g = R; g >= -R; g -= step / 2) {
      const named = Math.abs(g / step - Math.round(g / step)) < 1e-9;
      minor.push([AX, gy(g), named ? -3 : -2, 0]);
      if (named) labels.push(yLabel(gy(g), (g > 0 ? '+' : '') + g));
    }
    const ticks = 'M' + AX + ' 0V' + AH + 'H' + (AX + AW) + tick(minor);

    /* HANDLES: where each filter is: Freq across, and up its gain, or for a
     * cut the curve at its Freq, or 0 dB. */
    const handleY = (n, j) => {
      if (isGain(n)) return gy(n.type === 'Tilt' ? 0 : n.gain * s.scale / 100);
      if (CUTS.indexOf(n.type) >= 0) return gy(nodeDb(n, n.freq, opts));
      return gy(0);
    };
    const handles = [];
    const hitList = [];
    s.nodes.forEach((n, j) => {
      if (n.type === 'None') return;
      const x = fx(n.freq), y = Math.max(0, Math.min(AH, handleY(n, j)));
      const sel = j === s.sel;
      handles.push({
        x: x.toFixed(1), y: y.toFixed(1),
        fill: !n.on ? 'var(--bg-000)' : sel ? 'var(--uv)' : 'var(--ink)',
        stroke: !n.on ? 'var(--ink-dim)' : 'var(--bg-000)',
        style: sel && n.on ? 'filter: drop-shadow(0 0 4px var(--uv-deep));' : '',
        tx: (x + 7).toFixed(1), ty: (y - 6).toFixed(1),
        textFill: sel ? 'var(--ink)' : 'var(--ink-muted)',
        label: String(j + 1) + (n.channel === 'Stereo' ? '' : ' ' + n.channel[0]),
      });
      hitList.push({ kind: 'node', i: j, x, y });
    });
    /* The selected Bell, Band Pass or Notch: its -3 dB edges. */
    let widthTicks = '';
    if (selNode && selNode.type !== 'None' && ['Bell', 'Band-Pass', 'Notch'].indexOf(selNode.type) >= 0) {
      const oct = 2 * Math.asinh(1 / (2 * selNode.q)) / Math.LN2;
      const hy = Math.max(0, Math.min(AH, handleY(selNode, s.sel)));
      [-1, 1].forEach((sgn) => {
        const f = selNode.freq * Math.pow(2, sgn * oct / 2);
        if (f < LO || f > HI) return;
        widthTicks += 'M' + fx(f).toFixed(1) + ' ' + (hy - 6).toFixed(1) + 'v12';
        hitList.push({ kind: 'width', i: s.sel, x: fx(f), y: hy });
      });
    }
    /* The isolator: its crossovers as rules with a tab, its bands' gains as
     * handles L, M, H at each band's middle. */
    const isoShown = isoOn || isoSel;
    let xoRules = '', xoTabs = '';
    if (isoShown) {
      const hiF = Math.max(s.iso.upper, s.iso.lower);
      [['lower', s.iso.lower], ['upper', hiF]].forEach(([key, f]) => {
        const x = fx(f);
        xoRules += 'M' + x.toFixed(1) + ' 0V' + AH;
        xoTabs += 'M' + (x - 4).toFixed(1) + ' 0h8v8h-8Z';
        hitList.push({ kind: 'xo', key, x, y: 4 });
      });
      [['low', 'L', Math.sqrt(LO * s.iso.lower)], ['mid', 'M', Math.sqrt(s.iso.lower * hiF)], ['high', 'H', Math.sqrt(hiF * HI)]].forEach(([key, letter, f]) => {
        const killed = s.iso['kill' + key[0].toUpperCase() + key.slice(1)];
        const x = fx(f), y = Math.max(0, Math.min(AH, gy(killed || s.iso[key] <= -60 ? -999 : s.iso[key])));
        handles.push({ x: x.toFixed(1), y: y.toFixed(1), fill: isoSel ? 'var(--uv)' : 'var(--ink)', stroke: 'var(--bg-000)', style: isoSel ? 'filter: drop-shadow(0 0 4px var(--uv-deep));' : '', tx: (x + 7).toFixed(1), ty: (y - 6).toFixed(1), textFill: 'var(--ink-muted)', label: letter });
        hitList.push({ kind: 'band', key, x, y });
      });
    }
    this._geo = { AX, AW, AH, R, fx, fOfX, gy, gOfY, hitList };

    /* KNOBS: a value as 0..1 on its travel, the three paths. */
    const specs = {
      freq: { min: 10, max: 22000, log: true }, gain: { min: -30, max: 30, bipolar: true }, q: { min: 0.1, max: 40, log: true },
      ripple: { min: 0.01, max: 3 }, stopband: { min: 20, max: 120 }, output: { min: -24, max: 24, bipolar: true },
      scale: { min: -200, max: 200, bipolar: true }, low: { min: -60, max: 6 }, mid: { min: -60, max: 6 }, high: { min: -60, max: 6 },
      lower: { min: 30, max: 2000, log: true }, upper: { min: 500, max: 16000, log: true }, slope: { min: 24, max: 48, steps: 2 },
    };
    const norm = (k, v) => { const p = specs[k]; return p.log ? Math.log(v / p.min) / Math.log(p.max / p.min) : (v - p.min) / (p.max - p.min); };
    const denorm = (k, t) => {
      const p = specs[k]; t = Math.max(0, Math.min(1, t));
      if (p.steps) return t < 0.5 ? p.min : p.max;
      return p.log ? p.min * Math.pow(p.max / p.min, t) : p.min + t * (p.max - p.min);
    };
    const knobPaths = (t, bipolar) => {
      const at = (u, r) => { const a = (-225 + 270 * u) * Math.PI / 180; return [24 + r * Math.cos(a), 24 + r * Math.sin(a)]; };
      const arc = (t0, t1) => {
        if (Math.abs(t1 - t0) < 1e-3) return '';
        const a = Math.min(t0, t1), b = Math.max(t0, t1), p0 = at(a, 20), p1 = at(b, 20);
        return 'M' + p0[0].toFixed(2) + ' ' + p0[1].toFixed(2) + ' A20 20 0 ' + ((b - a) * 270 > 180 ? 1 : 0) + ' 1 ' + p1[0].toFixed(2) + ' ' + p1[1].toFixed(2);
      };
      const i = at(t, 6), o = at(t, 14);
      return { rail: arc(0, 1), arc: bipolar ? arc(0.5, t) : arc(0, t), ptr: 'M' + i[0].toFixed(2) + ' ' + i[1].toFixed(2) + ' L' + o[0].toFixed(2) + ' ' + o[1].toFixed(2) };
    };
    const hz = (f) => (f >= 10000 ? [(f / 1000).toFixed(1), 'kHz'] : f >= 1000 ? [(f / 1000).toFixed(2), 'kHz'] : [String(Math.round(f)), 'Hz']);
    const signed = (v, d) => (v > 0 ? '+' : v < 0 ? '−' : '') + Math.abs(v).toFixed(d);
    const knob = (label, key, value, text, unit, enabled, write, reset) => {
      const t = norm(key, value);
      return Object.assign({
        label, value: text, unit, aria: text + ' ' + unit,
        cls: enabled ? '' : 'disabled', roCls: enabled ? '' : 'disabled',
        down: (e) => {
          if (!enabled) return;
          e.currentTarget.setPointerCapture(e.pointerId);
          self._knob = { y0: e.clientY, t0: t, key, write };
        },
        reset: () => { if (enabled) reset(); },
      }, knobPaths(t, !!specs[key].bipolar));
    };
    const setNode = (j, patch) => this.setState({ nodes: this.st().nodes.map((n, k) => (k === j ? Object.assign({}, n, patch) : n)) });
    const setIso = (patch) => this.setState({ iso: Object.assign({}, this.st().iso, patch) });

    /* THE INSPECTOR */
    const selects = [];
    let nodeKnobs = [], inspectorTitle = '', onToggle;
    if (!isoSel) {
      const j = s.sel, n = s.nodes[j], empty = n.type === 'None';
      inspectorTitle = 'Node ' + (j + 1) + '   ' + (empty ? 'Empty' : n.type);
      onToggle = { cls: 'ph-toggle' + (n.on && !empty ? ' on' : ''), click: () => { if (!empty) setNode(j, { on: !n.on }); } };
      const usesFamily = FAMILY_TYPES.indexOf(n.type) >= 0;
      const usesOrder = ORDER_TYPES.indexOf(n.type) >= 0;
      const maxOrder = n.type === 'Low Shelf' || n.type === 'High Shelf' ? 4 : 8;
      const order = Math.min(n.order, maxOrder);
      const orderText = (o) => 6 * o + ' dB/oct';
      const select = (key, label, w, enabled, value, options, pick) => {
        const open = s.open === key && enabled;
        selects.push({
          label, w, value, open, openCls: open ? 'open' : '',
          labelColor: enabled ? 'var(--ink-muted)' : 'var(--ink-dim)',
          fieldStyle: 'display: block; width: 100%; box-sizing: border-box; text-align: left; white-space: nowrap; overflow: hidden;' + (enabled ? '' : ' color: var(--ink-dim); border-color: var(--line-100); cursor: default;'),
          toggle: () => { if (enabled) this.setState({ open: open ? null : key }); },
          options: options.map((o) => ({ text: o.text, cls: o.value === o.current ? 'selected' : '', pick: () => { pick(o.value); this.setState({ open: null }); } })),
        });
      };
      select('type', 'Type', 120, true, empty ? 'Empty' : n.type, TYPES.map((t) => ({ text: t === 'None' ? 'Empty' : t, value: t, current: n.type })), (t) => setNode(j, { type: t, on: true }));
      const famShown = (n.type === 'Band-Pass' || n.type === 'Notch') && n.family === 'Linkwitz-Riley' ? 'Butterworth' : n.family;
      select('family', 'Family', 152, usesFamily, usesFamily ? famShown : '–', FAMILIES.map((f) => ({ text: f, value: f, current: n.family })), (f) => setNode(j, { family: f }));
      const orders = []; for (let o = 1; o <= maxOrder; o++) orders.push({ text: orderText(o), value: o, current: order });
      select('order', 'Order', 114, usesOrder, usesOrder ? orderText(order) : '–', orders, (o) => setNode(j, { order: o }));
      select('channel', 'Channel', 100, !empty, n.channel, CHANNELS.map((c) => ({ text: c, value: c, current: n.channel })), (c) => setNode(j, { channel: c }));

      const usesGain = isGain(n);
      const usesQ = !empty && n.type !== 'Tilt' && !((CUTS.indexOf(n.type) >= 0 || n.type === 'Low Shelf' || n.type === 'High Shelf' || n.type === 'All-Pass') && order < 2);
      const fam = usesFamily ? famShown : '';
      const usesRipple = fam === 'Chebyshev I' || (fam === 'Elliptic' && order >= 2);
      const usesStop = fam === 'Chebyshev II' || (fam === 'Elliptic' && order >= 2);
      const [fv, fu] = hz(n.freq);
      nodeKnobs = [
        knob('Freq', 'freq', n.freq, fv, fu, !empty, (v) => setNode(j, { freq: v }), () => setNode(j, { freq: 30 * Math.pow(16000 / 30, j / 15) })),
        knob('Gain', 'gain', n.gain, signed(n.gain, 1), 'dB', usesGain, (v) => setNode(j, { gain: v }), () => setNode(j, { gain: 0 })),
        knob('Q', 'q', n.q, n.q.toFixed(2), '', usesQ, (v) => setNode(j, { q: v }), () => setNode(j, { q: Math.SQRT1_2 })),
        knob('Ripple', 'ripple', n.ripple, n.ripple.toFixed(2), 'dB', usesRipple, (v) => setNode(j, { ripple: v }), () => setNode(j, { ripple: 1 })),
        knob('Stopband', 'stopband', n.stopband, n.stopband.toFixed(0), 'dB', usesStop, (v) => setNode(j, { stopband: v }), () => setNode(j, { stopband: 60 })),
      ];
    } else {
      inspectorTitle = 'Isolator';
      onToggle = { cls: 'ph-toggle' + (isoOn ? ' on' : ''), click: () => setIso({ on: !isoOn }) };
    }
    const isoGain = (v) => (v <= -60 ? ['−inf', 'dB'] : [signed(v, 1), 'dB']);
    const [lv, lu] = isoGain(s.iso.low), [mv, mu] = isoGain(s.iso.mid), [hv, hu] = isoGain(s.iso.high);
    const [xlv, xlu] = hz(s.iso.lower), [xuv, xuu] = hz(s.iso.upper);
    const isoKnobs = [
      knob('Low', 'low', s.iso.low, lv, lu, true, (v) => setIso({ low: v }), () => setIso({ low: 0 })),
      knob('Mid', 'mid', s.iso.mid, mv, mu, true, (v) => setIso({ mid: v }), () => setIso({ mid: 0 })),
      knob('High', 'high', s.iso.high, hv, hu, true, (v) => setIso({ high: v }), () => setIso({ high: 0 })),
      knob('Low-Mid', 'lower', s.iso.lower, xlv, xlu, true, (v) => setIso({ lower: v }), () => setIso({ lower: 250 })),
      knob('Mid-High', 'upper', s.iso.upper, xuv, xuu, true, (v) => setIso({ upper: v }), () => setIso({ upper: 2500 })),
      knob('Slope', 'slope', s.iso.slope, (s.iso.slope === 48 ? 'LR8 ' : 'LR4 ') + s.iso.slope, 'dB/oct', true, (v) => setIso({ slope: v }), () => setIso({ slope: 24 })),
    ];
    const kills = ['killLow', 'killMid', 'killHigh'].map((k) => ({ cls: 'ph-toggle' + (s.iso[k] ? ' on' : ''), click: () => setIso({ [k]: !s.iso[k] }) }));
    const outKnobs = [
      knob('Output', 'output', s.output, signed(s.output, 1), 'dB', true, (v) => this.setState({ output: v }), () => this.setState({ output: 0 })),
      knob('Scale', 'scale', s.scale, String(Math.round(s.scale)), '%', true, (v) => this.setState({ scale: v }), () => this.setState({ scale: 100 })),
    ];

    /* THE NODE ROW */
    const cellStyle = (x, border, glow) => 'position: absolute; left: ' + x + 'px; top: 344px; width: 40px; height: 40px; box-sizing: border-box; background: var(--bg-200); border: 1px solid ' + border + ';' + (glow ? ' box-shadow: var(--glow-focus);' : '');
    const cells = s.nodes.map((n, j) => {
      const sel = j === s.sel, empty = n.type === 'None';
      return {
        n: String(j + 1), selected: sel ? 'true' : 'false',
        style: cellStyle(32 + 48 * j, sel ? 'var(--uv)' : empty ? 'var(--line-100)' : 'var(--line-200)', sel),
        numStyle: 'position: absolute; left: 4px; top: 2px; font: 400 10px/14px var(--font-mono); color: ' + (empty ? 'var(--ink-dim)' : 'var(--ink-muted)') + ';',
        hasGlyph: !empty, glyph: GLYPHS[n.type] || '', glyphColor: n.on ? 'var(--uv)' : 'var(--ink-dim)',
        aria: 'Node ' + (j + 1) + ', ' + (empty ? 'empty' : n.type + (n.on ? '' : ', bypassed')),
        click: (e) => { if (e.altKey && !empty) setNode(j, { on: !n.on }); else this.setState({ sel: j, open: null }); },
      };
    });
    cells.push({
      n: 'Iso', selected: isoSel ? 'true' : 'false',
      style: cellStyle(816, isoSel ? 'var(--uv)' : isoOn ? 'var(--line-200)' : 'var(--line-100)', isoSel),
      numStyle: 'position: absolute; left: 4px; top: 2px; font: 400 10px/14px var(--font-mono); text-transform: uppercase; color: ' + (isoOn ? 'var(--ink-muted)' : 'var(--ink-dim)') + ';',
      hasGlyph: true, glyph: 'M1 12H5V6H11V9H15', glyphColor: isoOn ? 'var(--uv)' : 'var(--ink-dim)',
      aria: 'Isolator' + (isoOn ? '' : ', off'),
      click: (e) => { if (e.altKey) setIso({ on: !isoOn }); else this.setState({ sel: 'iso', open: null }); },
    });

    const count = s.nodes.filter(active).length + (isoOn ? 1 : 0);
    return {
      caption: ['Response', count + (count === 1 ? ' filter' : ' filters'), '48 kHz'].join('   '),
      analyzerText: s.analyzer === 'Off' ? 'Analyzer off' : s.analyzer === 'Both' ? 'Pre + post' : s.analyzer,
      rangeText: '±' + R + ' dB',
      cycleAnalyzer: () => { const m = ['Both', 'Post', 'Pre', 'Off']; this.setState({ analyzer: m[(m.indexOf(this.st().analyzer) + 1) % m.length] }); },
      cycleRange: () => { const m = [6, 12, 18, 30]; this.setState({ range: m[(m.indexOf(this.st().range) + 1) % m.length] }); },
      showPre: s.analyzer === 'Pre' || s.analyzer === 'Both', showPost: s.analyzer === 'Post' || s.analyzer === 'Both',
      preArea, postArea, postEdge, ticks, labels,
      zeroLine: 'M' + AX + ' ' + gy(0).toFixed(1) + 'H' + (AX + AW),
      ghosts, isoShown, xoRules, xoTabs, ownCurve,
      totalCurve: path(total.map((d, i) => [fx(freqs[i]), gy(d)])),
      widthTicks, handles, cells,
      inspectorTitle, onToggle, showNode: !isoSel, showIso: isoSel, selects, nodeKnobs, isoKnobs, kills, outKnobs,
      adaptive: { cls: 'ph-toggle' + (s.adaptive ? ' on' : ''), click: () => this.setState({ adaptive: !this.st().adaptive }) },
      bypass: { cls: 'ph-toggle' + (s.bypass ? ' on' : ''), click: () => this.setState({ bypass: !this.st().bypass }) },
      knobMove: (e) => {
        const k = self._knob;
        if (!k) return;
        const fine = e.shiftKey ? 0.2 : 1;
        k.write(denorm(k.key, k.t0 + fine * (k.y0 - e.clientY) / 200));
      },
      knobUp: () => { self._knob = null; },
      wellDown: (e) => this.wellDown(e),
      wellMove: (e) => this.wellMove(e),
      wellUp: () => { self._drag = null; },
      wellDouble: (e) => this.wellDouble(e),
      wellKey: (e) => this.wellKey(e),
    };
  }

  point(e) {
    const r = e.currentTarget.getBoundingClientRect();
    return [(e.clientX - r.left) * 812 / r.width, (e.clientY - r.top) * 262 / r.height];
  }

  hit(x, y) {
    const list = this._geo.hitList;
    let best = null, bestD = 9;
    for (let i = list.length - 1; i >= 0; i--) {
      const h = list[i];
      const d = h.kind === 'xo' ? Math.abs(x - h.x) : Math.max(Math.abs(x - h.x), Math.abs(y - h.y));
      if (d < bestD) { bestD = d; best = h; }
    }
    return best;
  }

  wellDown(e) {
    const [x, y] = this.point(e);
    const h = this.hit(x, y);
    if (!h) return;
    e.currentTarget.setPointerCapture(e.pointerId);
    const s = this.st();
    if (h.kind === 'node' || h.kind === 'width') {
      const n = s.nodes[h.i];
      this._drag = { kind: h.kind, i: h.i, x0: x, y0: y, f0: n.freq, g0: n.gain, q0: n.q, alt: e.altKey };
      if (s.sel !== h.i) this.setState({ sel: h.i, open: null });
    } else if (h.kind === 'xo') {
      this._drag = { kind: 'xo', key: h.key };
      if (s.sel !== 'iso') this.setState({ sel: 'iso', open: null });
    } else {
      this._drag = { kind: 'band', key: h.key, y0: y, g0: Math.max(-60, s.iso[h.key]) };
      if (s.sel !== 'iso') this.setState({ sel: 'iso', open: null });
    }
  }

  wellMove(e) {
    const d = this._drag;
    if (!d) return;
    const [x, y] = this.point(e);
    const g = this._geo, s = this.st(), fine = e.shiftKey ? 0.2 : 1;
    const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
    if (d.kind === 'node') {
      const n = s.nodes[d.i];
      const patch = { freq: clamp(d.f0 * Math.pow(2200, fine * (x - d.x0) / g.AW), 10, 22000) };
      const gainType = ['Bell', 'Low Shelf', 'High Shelf', 'Tilt'].indexOf(n.type) >= 0;
      if (gainType && !(d.alt || e.altKey)) patch.gain = clamp(d.g0 - fine * (y - d.y0) * 2 * g.R / g.AH, -30, 30);
      else patch.q = clamp(d.q0 * Math.pow(2, -fine * (y - d.y0) / 48), 0.1, 40);
      this.setState({ nodes: s.nodes.map((m, k) => (k === d.i ? Object.assign({}, m, patch) : m)) });
    } else if (d.kind === 'width') {
      const n = s.nodes[d.i];
      const oct = Math.max(0.05, 2 * Math.abs(Math.log2(g.fOfX(x) / n.freq)));
      const q = clamp(1 / (2 * Math.sinh(oct * Math.LN2 / 2)), 0.1, 40);
      this.setState({ nodes: s.nodes.map((m, k) => (k === d.i ? Object.assign({}, m, { q }) : m)) });
    } else if (d.kind === 'xo') {
      const f = g.fOfX(x);
      const patch = d.key === 'lower' ? { lower: clamp(f, 30, 2000) } : { upper: clamp(f, 500, 16000) };
      this.setState({ iso: Object.assign({}, s.iso, patch) });
    } else {
      this.setState({ iso: Object.assign({}, s.iso, { [d.key]: clamp(d.g0 - fine * (y - d.y0) * 2 * g.R / g.AH, -60, 6) }) });
    }
  }

  wellDouble(e) {
    const [x, y] = this.point(e);
    const s = this.st(), g = this._geo, h = this.hit(x, y);
    if (h && h.kind === 'node') {
      const n = s.nodes[h.i];
      const reset = ['Bell', 'Low Shelf', 'High Shelf', 'Tilt'].indexOf(n.type) >= 0 ? { gain: 0 } : { q: Math.SQRT1_2 };
      this.setState({ nodes: s.nodes.map((m, k) => (k === h.i ? Object.assign({}, m, reset) : m)) });
      return;
    }
    if (h && h.kind === 'band') { this.setState({ iso: Object.assign({}, s.iso, { [h.key]: 0 }) }); return; }
    if (h) return;
    const j = s.nodes.findIndex((n) => n.type === 'None');
    if (j < 0) return;
    const f = g.fOfX(x);
    const type = f < 30 ? 'High-Pass' : f > 15000 ? 'Low-Pass' : 'Bell';
    const gain = type === 'Bell' ? Math.max(-30, Math.min(30, Math.round(g.gOfY(y) * 10) / 10)) : 0;
    this.setState({ sel: j, open: null, nodes: s.nodes.map((m, k) => (k === j ? Object.assign({}, m, { type, on: true, freq: f, gain, q: Math.SQRT1_2, order: 2 }) : m)) });
  }

  wellKey(e) {
    if (e.key !== 'Delete' && e.key !== 'Backspace') return;
    const s = this.st();
    if (s.sel === 'iso') return;
    e.preventDefault();
    this.setState({ nodes: s.nodes.map((m, k) => (k === s.sel ? Object.assign({}, m, { type: 'None' }) : m)) });
  }
}
</script>
</body>
