<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>NI Listen-In — as built</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="uv-tokens.css">
<link rel="stylesheet" href="ds/ultraviolet/components/bundle.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0;background:#060410}
</style>
</helmet>
<div class="ph" style="position: relative; width: 360px; height: 232px; overflow: hidden; box-sizing: border-box; padding: 32px 32px 16px; display: flex; flex-direction: column; font-family: var(--font-mono); color: var(--ink);">

  <!-- Title row: the plugin's name, and the status as dim text. -->
  <div style="height: 28px; margin-bottom: 16px; display: flex; align-items: center; justify-content: space-between;">
    <span class="ph-value" style="letter-spacing: .02em;">NI Listen-In</span>
    <span class="ph-label" style="color: var(--ink-dim);">Listening</span>
  </div>

  <!-- Bus select and the name field (radius 2, 12px text). -->
  <div style="height: 28px; margin-bottom: 16px; display: flex; align-items: center; gap: 8px; font: 400 13px var(--font-mono);">
    <span class="ph-label" style="width: 28px; text-align: left;">Bus</span>
    <span style="position: relative; display: block; width: 64px; height: 28px; box-sizing: border-box; background: var(--bg-200); border: 1px solid var(--line-200); padding: 0 28px 0 12px; line-height: 26px; flex: none;">3<svg width="8" height="5" viewBox="0 0 8 5" style="position: absolute; right: 10px; top: 11px;"><path d="M0.5 0.5 L4 4 L7.5 0.5" fill="none" stroke="var(--ink-muted)"></path></svg></span>
    <label style="flex: 1; min-width: 0;"><span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0);">Name</span><input value="kick bus" style="width: 100%; height: 28px; box-sizing: border-box; padding: 0 8px; background: var(--bg-200); border: 1px solid var(--line-100); border-radius: 2px; color: var(--ink); font: 400 12px var(--font-mono); outline: none;"></label>
  </div>

  <!-- Meter: a uv-deep to uv gradient fill with a halo, radius 2. -->
  <div style="height: 12px; box-sizing: border-box; background: var(--bg-200); border: 1px solid var(--line-100); border-radius: 2px; overflow: hidden;">
    <div style="width: 64%; height: 100%; background: linear-gradient(90deg, var(--uv-deep), var(--uv)); box-shadow: 0 0 8px var(--uv-glow);"></div>
  </div>

  <!-- Hint: two status clauses truncate to 96px; Motion sits 4px from the signature. -->
  <div style="margin-top: auto; height: 28px; box-sizing: border-box; border-top: 1px solid var(--line-100); padding-top: 12px; display: flex; align-items: baseline; font: 400 10px/14px var(--font-mono); letter-spacing: .02em; color: var(--ink-muted);">
    <span style="width: 96px; flex: none; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;"><b style="font-weight: 400; color: var(--ink);">bus</b> 3<span style="margin: 0 12px; color: var(--ink-dim);">–</span><b style="font-weight: 400; color: var(--ink);">name</b> kick bus</span>
    <span style="margin-left: 16px; align-self: center; display: inline-flex; align-items: center; gap: 8px;"><span style="position: relative; width: 28px; height: 14px; box-sizing: border-box; background: var(--bg-200); border: 1px solid var(--uv);"><span style="position: absolute; left: 16px; top: 2px; width: 8px; height: 8px; background: var(--uv);"></span></span><span class="ph-label">Motion</span></span>
    <span class="ph-sig" style="margin-left: 4px;"><span class="mark"></span>Neon Ingvy</span>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":360,"height":232}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
