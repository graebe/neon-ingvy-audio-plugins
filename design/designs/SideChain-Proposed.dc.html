<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>NI Side-Chain — proposed</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="uv-tokens.css">
<link rel="stylesheet" href="ds/ultraviolet/components/bundle.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0;background:#060410}
</style>
</helmet>
<div class="ph" style="position: relative; width: 760px; height: 656px; overflow: hidden; font-family: var(--font-mono); color: var(--ink);">

  <!-- PLOT, the window's face (32, 32, 696 x 228). Its caption carries the state; the one amber mark sits at its right end. -->
  <div style="position: absolute; left: 32px; top: 32px; width: 696px; height: 228px; box-sizing: border-box; background: var(--bg-000); border: 1px solid var(--line-100);">
    <svg viewBox="0 0 694 226" width="694" height="226" style="display: block;">
      <path d="{{scope}}" fill="var(--line-200)"></path>
      <line x1="6" y1="113" x2="688" y2="113" stroke="var(--line-100)"></line>
      <path d="M6 20 L20 113 L75 113 Q111 20 314 20 L688 20" fill="none" stroke="var(--uv)" stroke-width="2" style="filter: drop-shadow(0 0 3px var(--uv-deep));"></path>
      <path d="M6 206 L20 113 L75 113 Q111 206 314 206 L688 206" fill="none" stroke="var(--uv)" stroke-width="2" style="filter: drop-shadow(0 0 3px var(--uv-deep));"></path>
      <line x1="430" y1="20" x2="430" y2="206" stroke="var(--ink-dim)"></line>
      <rect x="2" y="16" width="8" height="8" fill="var(--ink)"></rect>
      <rect x="16" y="109" width="8" height="8" fill="var(--ink)"></rect>
      <rect x="71" y="109" width="8" height="8" fill="var(--ink)"></rect>
      <rect x="310" y="16" width="8" height="8" fill="var(--ink)"></rect>
      <text x="6" y="13" fill="var(--ink-muted)" style="font: 400 10px var(--font-mono); letter-spacing: .02em;">{{caption}}</text>
      <sc-if value="{{warning}}" hint-placeholder-val="{{false}}">
        <text x="688" y="13" text-anchor="end" fill="var(--amber)" style="font: 400 10px var(--font-mono); letter-spacing: .08em;">TRANSPORT STOPPED</text>
      </sc-if>
    </svg>
  </div>

  <!-- DUCK (32, 284): the shape every source shares, with its two settings at the right. -->
  <section class="ph-panel" style="position: absolute; left: 32px; top: 284px; width: 696px; height: 140px; display: flex; gap: 12px;">
    <h2 class="ph-title" style="margin: 0; align-self: center; writing-mode: vertical-rl; transform: rotate(180deg);">Duck</h2>
    <div class="ph-row">
      <sc-for list="{{duck}}" as="k" hint-placeholder-count="5">
        <div class="ph-knob">
          <div class="ph-label">{{k.label}}</div>
          <svg viewBox="0 0 48 48"><circle class="disc" cx="24" cy="24" r="16"></circle><path class="rail" d="{{k.g.rail}}"></path><path class="arc" d="{{k.g.arc}}"></path><line class="ptr" x1="{{k.g.x1}}" y1="{{k.g.y1}}" x2="{{k.g.x2}}" y2="{{k.g.y2}}"></line></svg>
          <div class="ph-readout">{{k.num}}<span class="unit">{{k.unit}}</span></div>
        </div>
      </sc-for>
    </div>
    <div style="margin-left: auto; display: flex; flex-direction: column; justify-content: center; gap: 8px;">
      <span style="display: flex; align-items: center; gap: 8px;">
        <span class="ph-label" style="width: 44px; text-align: left;">Curve</span>
        <div class="ph-select" style="min-width: 0; width: 136px;"><div class="field">Exponential<svg class="ph-icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="square"><path d="M4.5 6.5l3.5 3.5 3.5-3.5"></path></svg></div></div>
      </span>
      <label class="ph-toggle" style="height: 28px; margin-left: 52px;"><span class="sw"></span><span class="ph-label">% of cycle</span></label>
    </div>
  </section>

  <!-- TRIGGER (32, 448): fixed size. Source swaps the contents; nothing else moves. -->
  <section class="ph-panel" style="position: absolute; left: 32px; top: 448px; width: 696px; height: 140px; display: flex; gap: 12px;">
    <h2 class="ph-title" style="margin: 0; align-self: center; writing-mode: vertical-rl; transform: rotate(180deg);">Trigger</h2>
    <div class="ph-row">
      <div style="display: flex; flex-direction: column; align-items: flex-start; gap: 8px;">
        <div class="ph-label">Source</div>
        <div class="ph-select" style="min-width: 0; width: 128px;"><div class="field">{{source}}<svg class="ph-icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="square"><path d="M4.5 6.5l3.5 3.5 3.5-3.5"></path></svg></div></div>
      </div>
      <sc-for list="{{trig}}" as="k" hint-placeholder-count="3">
        <div class="ph-knob">
          <div class="ph-label">{{k.label}}</div>
          <svg viewBox="0 0 48 48"><circle class="disc" cx="24" cy="24" r="16"></circle><path class="rail" d="{{k.g.rail}}"></path><path class="arc" d="{{k.g.arc}}"></path><line class="ptr" x1="{{k.g.x1}}" y1="{{k.g.y1}}" x2="{{k.g.x2}}" y2="{{k.g.y2}}"></line></svg>
          <div class="ph-readout">{{k.num}}<span class="unit">{{k.unit}}</span></div>
        </div>
      </sc-for>
      <sc-if value="{{isMidi}}" hint-placeholder-val="{{true}}">
        <div style="display: flex; flex-direction: column; justify-content: center; align-self: stretch;">
          <label class="ph-toggle" style="height: 28px;"><span class="sw"></span><span class="ph-label">Gate</span></label>
        </div>
      </sc-if>
    </div>
  </section>

  <!-- HINT (y 612): conventions only. -->
  <div style="position: absolute; left: 0; top: 612px; width: 760px; height: 28px; box-sizing: border-box; border-top: 1px solid var(--line-100); padding: 0 32px; display: flex; align-items: center; gap: 16px; font: 400 10px/14px var(--font-mono); letter-spacing: .02em; color: var(--ink-muted);">
    <span style="white-space: nowrap;"><b style="font-weight: 400; color: var(--ink);">drag</b> a handle to shape the duck<span style="margin: 0 12px; color: var(--ink-dim);">–</span><b style="font-weight: 400; color: var(--ink);">shift</b> for fine<span style="margin: 0 12px; color: var(--ink-dim);">–</span><b style="font-weight: 400; color: var(--ink);">double-click</b> to reset</span>
    <label class="ph-toggle on"><span class="sw"></span><span class="ph-label">Motion</span></label>
    <span class="ph-sig" style="margin-left: auto;"><span class="mark"></span>Neon Ingvy</span>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"source":{"editor":"enum","options":["Cycle","MIDI","Sidechain"],"default":"MIDI"},"warning":{"editor":"boolean","default":false},"$preview":{"width":760,"height":656}}'>
class Component extends DCLogic {
  renderVals() {
    const f = (n) => n.toFixed(2);
    // Unipolar arcs start at the minimum; bipolar ones (Delay) start at 12 o'clock.
    const knob = (v, bipolar) => {
      const c = 24, r = 20;
      const pt = (t, rr) => { const a = (-135 + 270 * t) * Math.PI / 180; return [c + rr * Math.sin(a), c - rr * Math.cos(a)]; };
      const s = pt(0, r), e = pt(1, r), p = pt(v, r), i = pt(v, 6), o = pt(v, 15);
      let arc = '';
      if (bipolar) {
        const m = pt(0.5, r);
        if (Math.abs(v - 0.5) > 0.001) arc = 'M' + f(m[0]) + ' ' + f(m[1]) + ' A' + r + ' ' + r + ' 0 0 ' + (v > 0.5 ? 1 : 0) + ' ' + f(p[0]) + ' ' + f(p[1]);
      } else if (v > 0.001) {
        arc = 'M' + f(s[0]) + ' ' + f(s[1]) + ' A' + r + ' ' + r + ' 0 ' + (270 * v > 180 ? 1 : 0) + ' 1 ' + f(p[0]) + ' ' + f(p[1]);
      }
      return {
        rail: 'M' + f(s[0]) + ' ' + f(s[1]) + ' A' + r + ' ' + r + ' 0 1 1 ' + f(e[0]) + ' ' + f(e[1]),
        arc, x1: f(i[0]), y1: f(i[1]), x2: f(o[0]), y2: f(o[1]),
      };
    };
    const K = (label, v, num, unit, bipolar) => ({ label, num, unit: unit ? ' ' + unit : '', g: knob(v, bipolar) });

    const source = this.props.source ?? 'MIDI';
    const trig = source === 'Cycle'
      ? [K('Rate', 4 / 11, '1/4', '')]
      : source === 'MIDI'
        ? [K('Note', 36 / 127, 'C1', ''), K('Channel', 1 / 16, '1', ''), K('Velocity', 0, '0', '%')]
        : [K('Threshold', 0.6, '−24', 'dB'), K('Lockout', 0.1, '20', 'ms')];
    const head = source === 'Cycle' ? 'CYCLE 1/4' : source === 'MIDI' ? 'MIDI C1' : 'SIDECHAIN −24 dB';

    let top = 'M6 113', bottom = '';
    const pts = [];
    for (let x = 6; x <= 688; x += 4) {
      const a = Math.min(0.95, 0.22 + 0.18 * Math.abs(Math.sin(x * 0.21) * Math.cos(x * 0.07)) + 0.72 * Math.exp(-(x - 6) / 22));
      pts.push([x, a]);
    }
    pts.forEach(([x, a]) => { top += ' L' + x + ' ' + f(113 - a * 89); });
    for (let k = pts.length - 1; k >= 0; k--) { const [x, a] = pts[k]; bottom += ' L' + x + ' ' + f(113 + a * 89); }

    return {
      source, trig,
      isMidi: source === 'MIDI',
      warning: !!this.props.warning,
      caption: head + ' · RELEASE · 225 ms',
      scope: top + bottom + ' Z',
      duck: [
        K('Depth', 1, '100', '%'),
        K('Delay', 0.5, '0', '%', true),
        K('Attack', 0.01, '10', 'ms'),
        K('Hold', 0.04, '40', 'ms'),
        K('Release', 0.175, '175', 'ms'),
      ],
    };
  }
}
</script>
</body>
</html>
