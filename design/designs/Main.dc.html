<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>NI Trance Gate — as built</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="uv-tokens.css">
<link rel="stylesheet" href="ds/ultraviolet/components/bundle.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0;background:#060410}
</style>
</helmet>
<div class="ph" style="position: relative; width: 824px; height: 736px; overflow: hidden; font-family: var(--font-mono); color: var(--ink);">

  <!-- Ring column: (32, 32, 240, 240). The kit's own wedge ring, which also edits. -->
  <div style="position: absolute; left: 32px; top: 32px; width: 240px; height: 240px;">
    <svg viewBox="0 0 240 240" width="240" height="240" style="display: block;">
      <sc-for list="{{ring}}" as="s" hint-placeholder-count="16">
        <path d="{{s.d}}" fill="{{s.fill}}" stroke="{{s.stroke}}" stroke-width="{{s.sw}}"></path>
      </sc-for>
    </svg>
    <div style="position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;">
      <div class="ph-readout-text">16</div>
      <div class="ph-label">Steps</div>
    </div>
  </div>

  <!-- Envelope plot: (32, 296, 240, 104), always under the ring. Ends 84px above the panel stack. -->
  <div style="position: absolute; left: 32px; top: 296px; width: 240px; height: 104px; background: var(--bg-000); border: 1px solid var(--line-100); box-sizing: border-box;">
    <svg viewBox="0 0 238 102" width="238" height="102" style="display: block;">
      <text x="6" y="13" fill="var(--ink-muted)" style="font: 400 10px var(--font-mono); letter-spacing: .02em;">ENVELOPE 130 MS  STEP 125.0 MS</text>
      <path d="M6 74 L8.7 22 L177 22 L204 74 L232 74 Z" fill="var(--uv-deep)" fill-opacity="0.45"></path>
      <path d="M6 74 L8.7 22 L177 22 L204 74 L232 74" fill="none" stroke="var(--uv)" stroke-width="1.5"></path>
      <line x1="221" y1="20" x2="221" y2="76" stroke="var(--line-200)"></line>
      <text x="20" y="86" fill="var(--ink-dim)" style="font: 400 10px var(--font-mono);">D</text>
      <text x="96" y="86" fill="var(--ink-dim)" style="font: 400 10px var(--font-mono);">S</text>
      <text x="186" y="86" fill="var(--ink-dim)" style="font: 400 10px var(--font-mono);">R</text>
      <text x="6" y="98" fill="var(--ink-muted)" style="font: 400 10px var(--font-mono);">0</text>
      <text x="48" y="98" fill="var(--ink-muted)" style="font: 400 10px var(--font-mono);">25</text>
      <text x="92" y="98" fill="var(--ink-muted)" style="font: 400 10px var(--font-mono);">50</text>
      <text x="137" y="98" fill="var(--ink-muted)" style="font: 400 10px var(--font-mono);">75</text>
      <text x="232" y="98" text-anchor="end" fill="var(--ink-muted)" style="font: 400 10px var(--font-mono);">100 125 ms</text>
    </svg>
  </div>

  <!-- GATE panel: left 304, top 32, 488 x 140. Vertical title (kit only). Cells stretch to 95px. -->
  <section style="position: absolute; left: 304px; top: 32px; width: 488px; height: 140px; box-sizing: border-box; background: var(--bg-100); border: 1px solid var(--line-100); padding: 16px; display: flex; gap: 12px;">
    <h2 style="margin: 0; align-self: center; writing-mode: vertical-rl; transform: rotate(180deg); font: 500 12px/16px var(--font-mono); letter-spacing: .08em; color: var(--ink-muted);">GATE</h2>
    <div style="display: flex; gap: 16px; flex: 1; min-width: 0;">
      <sc-for list="{{gate}}" as="k" hint-placeholder-count="4">
        <div class="ph-knob" style="width: auto; flex: 1; min-width: 0;">
          <div class="ph-label">{{k.label}}</div>
          <svg viewBox="0 0 48 48" width="48" height="48"><circle class="disc" cx="24" cy="24" r="16"></circle><path class="rail" d="{{k.g.rail}}"></path><path class="arc" d="{{k.g.arc}}"></path><line class="ptr" x1="{{k.g.x1}}" y1="{{k.g.y1}}" x2="{{k.g.x2}}" y2="{{k.g.y2}}"></line></svg>
          <div class="ph-readout" style="width: 100%;">{{k.text}}</div>
        </div>
      </sc-for>
    </div>
  </section>

  <!-- ENVELOPE panel: top 188 (16 gutter, system says 24). -->
  <section style="position: absolute; left: 304px; top: 188px; width: 488px; height: 140px; box-sizing: border-box; background: var(--bg-100); border: 1px solid var(--line-100); padding: 16px; display: flex; gap: 12px;">
    <h2 style="margin: 0; align-self: center; writing-mode: vertical-rl; transform: rotate(180deg); font: 500 12px/16px var(--font-mono); letter-spacing: .08em; color: var(--ink-muted);">ENVELOPE</h2>
    <div style="display: flex; gap: 16px; flex: 1; min-width: 0;">
      <sc-for list="{{env}}" as="k" hint-placeholder-count="4">
        <div class="ph-knob" style="width: auto; flex: 1; min-width: 0;">
          <div class="ph-label">{{k.label}}</div>
          <svg viewBox="0 0 48 48" width="48" height="48"><circle class="disc" cx="24" cy="24" r="16"></circle><path class="rail" d="{{k.g.rail}}"></path><path class="arc" d="{{k.g.arc}}"></path><line class="ptr" x1="{{k.g.x1}}" y1="{{k.g.y1}}" x2="{{k.g.x2}}" y2="{{k.g.y2}}"></line></svg>
          <div class="ph-readout" style="width: 100%;">{{k.text}}</div>
        </div>
      </sc-for>
    </div>
  </section>

  <!-- FADE panel: top 344. The action column squeezes Soft, ORDER and SHUFFLE to 18px (measured). -->
  <section style="position: absolute; left: 304px; top: 344px; width: 488px; height: 140px; box-sizing: border-box; background: var(--bg-100); border: 1px solid var(--line-100); padding: 16px; display: flex; gap: 12px;">
    <h2 style="margin: 0; align-self: center; writing-mode: vertical-rl; transform: rotate(180deg); font: 500 12px/16px var(--font-mono); letter-spacing: .08em; color: var(--ink-muted);">FADE</h2>
    <div style="display: flex; gap: 16px; flex: 1; min-width: 0;">
      <div class="ph-knob" style="width: auto; flex: 1; min-width: 0;">
        <div class="ph-label">Fade</div>
        <svg viewBox="0 0 48 48" width="48" height="48"><circle class="disc" cx="24" cy="24" r="16"></circle><path class="rail" d="{{fade.rail}}"></path><path class="arc" d="{{fade.arc}}"></path><line class="ptr" x1="{{fade.x1}}" y1="{{fade.y1}}" x2="{{fade.x2}}" y2="{{fade.y2}}"></line></svg>
        <div class="ph-readout" style="width: 100%;">100.00%</div>
      </div>
      <div style="flex: 2; min-width: 0; display: flex; flex-direction: column; justify-content: center; gap: 8px;">
        <div style="display: flex; align-items: center; gap: 8px; height: 28px; flex: none;">
          <span class="ph-label" style="width: 28px; text-align: left;">Dir</span>
          <div style="position: relative; width: 76px; height: 28px; box-sizing: border-box; background: var(--bg-200); border: 1px solid var(--line-200); padding: 0 28px 0 12px; font: 400 13px/26px var(--font-mono); color: var(--ink);">In<svg width="8" height="5" viewBox="0 0 8 5" style="position: absolute; right: 10px; top: 11px;"><path d="M0.5 0.5 L4 4 L7.5 0.5" fill="none" stroke="var(--ink-muted)"></path></svg></div>
        </div>
        <div style="display: flex; align-items: center; gap: 8px; height: 18px; overflow: hidden;">
          <span style="position: relative; width: 28px; height: 14px; box-sizing: border-box; background: var(--bg-200); border: 1px solid var(--line-200); flex: none;"><span style="position: absolute; left: 2px; top: 2px; width: 8px; height: 8px; background: var(--ink-dim);"></span></span>
          <span class="ph-label">Soft</span>
        </div>
        <button style="height: 18px; box-sizing: border-box; background: var(--bg-200); border: 1px solid var(--line-200); color: var(--ink); font: 500 12px/14px var(--font-mono); letter-spacing: .04em; padding: 0; cursor: pointer;">ORDER</button>
        <button style="height: 18px; box-sizing: border-box; background: var(--bg-200); border: 1px solid var(--line-200); color: var(--ink); font: 500 12px/14px var(--font-mono); letter-spacing: .04em; padding: 0; cursor: pointer;">SHUFFLE</button>
      </div>
    </div>
  </section>

  <!-- Settings row, y 500. Needs ~820px of a 760px row: the icon buttons shrink to 16px and Paste lands at 836–852, past the window edge. -->
  <div style="position: absolute; left: 32px; top: 500px; width: 760px; height: 28px; font: 400 13px var(--font-mono);">
    <div style="position: absolute; left: 0; top: 0; width: 96px; height: 28px; box-sizing: border-box; background: var(--bg-200); border: 1px solid var(--line-200); padding: 0 28px 0 12px; line-height: 26px; color: var(--ink);">1<svg width="8" height="5" viewBox="0 0 8 5" style="position: absolute; right: 10px; top: 11px;"><path d="M0.5 0.5 L4 4 L7.5 0.5" fill="none" stroke="var(--ink-muted)"></path></svg></div>
    <div style="position: absolute; left: 120px; top: 0; height: 28px; display: flex; align-items: center; gap: 8px;">
      <span style="position: relative; width: 28px; height: 14px; box-sizing: border-box; background: var(--bg-200); border: 1px solid var(--line-200);"><span style="position: absolute; left: 2px; top: 2px; width: 8px; height: 8px; background: var(--ink-dim);"></span></span>
      <span class="ph-label">Join Neighbors</span>
    </div>
    <div style="position: absolute; left: 288px; top: 0; height: 28px; display: flex; align-items: center; gap: 8px;">
      <span class="ph-label" style="width: 44px; text-align: left;">Curve</span>
      <div style="position: relative; width: 124px; height: 28px; box-sizing: border-box; background: var(--bg-200); border: 1px solid var(--line-200); padding: 0 28px 0 12px; line-height: 26px; color: var(--ink);">Linear<svg width="8" height="5" viewBox="0 0 8 5" style="position: absolute; right: 10px; top: 11px;"><path d="M0.5 0.5 L4 4 L7.5 0.5" fill="none" stroke="var(--ink-muted)"></path></svg></div>
    </div>
    <div style="position: absolute; left: 488px; top: 0; height: 28px; display: flex; align-items: center; gap: 8px;">
      <span class="ph-label" style="width: 36px; text-align: left;">Time</span>
      <div style="position: relative; width: 88px; height: 28px; box-sizing: border-box; background: var(--bg-200); border: 1px solid var(--line-200); padding: 0 28px 0 12px; line-height: 26px; color: var(--ink);">ms<svg width="8" height="5" viewBox="0 0 8 5" style="position: absolute; right: 10px; top: 11px;"><path d="M0.5 0.5 L4 4 L7.5 0.5" fill="none" stroke="var(--ink-muted)"></path></svg></div>
    </div>
    <button style="position: absolute; left: 668px; top: 0; width: 72px; height: 28px; box-sizing: border-box; background: var(--bg-200); border: 1px solid var(--line-200); color: var(--ink); font: 500 12px var(--font-mono); letter-spacing: .04em; padding: 0; cursor: pointer;">RANDOM</button>
    <button aria-label="Copy gate config" style="position: absolute; left: 764px; top: 0; width: 16px; height: 28px; box-sizing: border-box; background: var(--bg-200); border: 1px solid var(--line-200); color: var(--ink); padding: 0; display: grid; place-items: center; overflow: visible; cursor: pointer;"><svg width="14" height="14" viewBox="0 0 14 14"><rect x="1.5" y="1.5" width="8" height="8" fill="none" stroke="currentColor"></rect><rect x="4.5" y="4.5" width="8" height="8" fill="none" stroke="currentColor"></rect></svg></button>
    <button aria-label="Paste gate config" style="position: absolute; left: 804px; top: 0; width: 16px; height: 28px; box-sizing: border-box; background: var(--bg-200); border: 1px solid var(--line-200); color: var(--ink); padding: 0; display: grid; place-items: center; overflow: visible; cursor: pointer;"><svg width="14" height="14" viewBox="0 0 14 14"><rect x="2" y="3" width="10" height="9" fill="none" stroke="currentColor"></rect><rect x="5" y="0.5" width="4" height="3" fill="none" stroke="currentColor"></rect></svg></button>
  </div>

  <!-- Band: (32, 536, 760, 92). Pattern plot; the Pattern/Signal tabs cover its last 24px. -->
  <div style="position: absolute; left: 32px; top: 536px; width: 760px; height: 92px; box-sizing: border-box; background: var(--bg-000); border: 1px solid var(--line-100);">
    <svg viewBox="0 0 758 90" width="758" height="90" style="display: block;">
      <sc-for list="{{rules}}" as="r" hint-placeholder-count="16">
        <line x1="{{r.x}}" y1="20" x2="{{r.x}}" y2="86" stroke="var(--line-100)"></line>
        <text x="{{r.tx}}" y="30" fill="var(--ink-dim)" style="font: 400 10px var(--font-mono);">{{r.n}}</text>
      </sc-for>
      <path d="{{patternFill}}" fill="var(--uv-deep)" fill-opacity="0.45"></path>
      <path d="{{patternLine}}" fill="none" stroke="var(--uv)" stroke-width="1.5"></path>
      <line x1="{{playX}}" y1="20" x2="{{playX}}" y2="86" stroke="var(--uv)"></line>
      <text x="6" y="13" fill="var(--ink-muted)" style="font: 400 10px var(--font-mono); letter-spacing: .02em;">PATTERN   ONE CYCLE</text>
    </svg>
    <div style="position: absolute; right: -1px; top: -1px; width: 24px; height: 92px; display: flex; flex-direction: column;">
      <button style="flex: 1; width: 24px; padding: 0; background: var(--uv); border: 1px solid var(--uv); color: var(--on-uv); filter: var(--kit-glow-led); display: grid; place-items: center; cursor: pointer;"><span style="writing-mode: vertical-rl; transform: rotate(180deg); font: 500 10px var(--font-mono); letter-spacing: .1em;">PATTERN</span></button>
      <button style="flex: 1; width: 24px; padding: 0; background: var(--bg-200); border: 1px solid var(--line-200); color: var(--ink-muted); display: grid; place-items: center; cursor: pointer;"><span style="writing-mode: vertical-rl; transform: rotate(180deg); font: 500 10px var(--font-mono); letter-spacing: .1em;">SIGNAL</span></button>
    </div>
  </div>

  <!-- Pads: y 644, 40px steps, 8px gaps. -->
  <div style="position: absolute; left: 32px; top: 644px; display: flex; gap: 8px;">
    <sc-for list="{{pads}}" as="p" hint-placeholder-count="16">
      <div style="{{p.style}}">
        <sc-if value="{{p.fillH}}" hint-placeholder-val="{{true}}">
          <div style="{{p.fillStyle}}"></div>
        </sc-if>
        <sc-if value="{{p.tie}}" hint-placeholder-val="{{false}}">
          <div style="position: absolute; left: 0; right: 0; top: 50%; margin-top: -1px; height: 2px; background: var(--uv);"></div>
        </sc-if>
      </div>
    </sc-for>
  </div>

  <!-- Hint bar: kit geometry (28 tall, 12 padding-top), full width, 32px inset. -->
  <div style="position: absolute; left: 0; top: 708px; width: 824px; height: 28px; box-sizing: border-box; border-top: 1px solid var(--line-100); padding: 12px 32px 0; display: flex; align-items: baseline; font: 400 10px/14px var(--font-mono); letter-spacing: .02em; color: var(--ink-muted);">
    <span style="white-space: nowrap;"><b style="font-weight: 400; color: var(--ink);">click</b> a step to toggle<span style="margin: 0 12px; color: var(--ink-dim);">–</span><b style="font-weight: 400; color: var(--ink);">shift-click</b> for a tie<span style="margin: 0 12px; color: var(--ink-dim);">–</span><b style="font-weight: 400; color: var(--ink);">drag</b> up or down for its amount</span>
    <span style="margin-left: 16px; align-self: center; display: inline-flex; align-items: center; gap: 8px;"><span style="position: relative; width: 28px; height: 14px; box-sizing: border-box; background: var(--bg-200); border: 1px solid var(--uv);"><span style="position: absolute; left: 16px; top: 2px; width: 8px; height: 8px; background: var(--uv);"></span></span><span class="ph-label">Motion</span></span>
    <span class="ph-sig" style="margin-left: auto;"><span class="mark"></span>Neon Ingvy</span>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":824,"height":736}}'>
class Component extends DCLogic {
  renderVals() {
    const f = (n) => n.toFixed(2);
    const knob = (v) => {
      const c = 24, r = 20;
      const pt = (t, rr) => { const a = (-135 + 270 * t) * Math.PI / 180; return [c + rr * Math.sin(a), c - rr * Math.cos(a)]; };
      const s = pt(0, r), e = pt(1, r), p = pt(v, r), i = pt(v, 6), o = pt(v, 15);
      return {
        rail: 'M' + f(s[0]) + ' ' + f(s[1]) + ' A' + r + ' ' + r + ' 0 1 1 ' + f(e[0]) + ' ' + f(e[1]),
        arc: v <= 0.001 ? '' : 'M' + f(s[0]) + ' ' + f(s[1]) + ' A' + r + ' ' + r + ' 0 ' + (270 * v > 180 ? 1 : 0) + ' 1 ' + f(p[0]) + ' ' + f(p[1]),
        x1: f(i[0]), y1: f(i[1]), x2: f(o[0]), y2: f(o[1]),
      };
    };
    const K = (label, v, text) => ({ label, text, g: knob(v) });

    const steps = ['on', 'off', 'on', 'off', 'half', 'off', 'on', 'tie', 'on', 'off', 'on', 'off', 'on', 'off', 'on', 'on'];
    const play = 5, cursor = 0, n = steps.length;

    // The kit's ring: filled wedges between r 84 and 114, 3 degrees apart.
    const ring = steps.map((st, i) => {
      const P = (deg, rr) => { const a = deg * Math.PI / 180; return f(120 + rr * Math.sin(a)) + ' ' + f(120 - rr * Math.cos(a)); };
      const a0 = i * 360 / n + 1.5, a1 = (i + 1) * 360 / n - 1.5;
      const d = 'M' + P(a0, 114) + ' A114 114 0 0 1 ' + P(a1, 114) + ' L' + P(a1, 84) + ' A84 84 0 0 0 ' + P(a0, 84) + ' Z';
      const lit = st === 'on' || st === 'half';
      return {
        d,
        fill: st === 'tie' ? 'none' : lit ? 'var(--uv)' : 'var(--line-200)',
        stroke: i === play ? 'var(--ink)' : st === 'tie' ? 'var(--uv)' : 'none',
        sw: i === play ? 2 : 1.5,
      };
    });

    // Pattern plot, x 6..754 inside the well, baseline 86, top 24.
    const sw = 748 / n, base = 86;
    let line = 'M6 86';
    steps.forEach((st, i) => {
      if (st === 'off' || st === 'tie') return;
      const lvl = st === 'half' ? 0.5 : 1, top = base - lvl * 62;
      let j = i; while (j + 1 < n && steps[j + 1] === 'tie') j++;
      const x0 = 6 + i * sw, xe = 6 + j * sw + 0.75 * sw;
      line += ' L' + f(x0) + ' ' + base + ' L' + f(x0 + 1) + ' ' + f(top) + ' L' + f(xe) + ' ' + f(top) + ' L' + f(xe + 5.6) + ' ' + base;
    });
    line += ' L754 86';
    const rules = steps.map((_, i) => ({ x: f(6 + i * sw), tx: f(9 + i * sw), n: String(i + 1) }));

    const pads = steps.map((st, i) => {
      const bar = i % 4 === 0;
      let border = bar ? 'var(--line-200)' : 'var(--line-100)', bg = 'var(--bg-200)', extra = '';
      if (st === 'on' || st === 'half') { border = 'var(--uv)'; extra += 'filter: var(--kit-glow-led);'; }
      if (st === 'tie') { border = 'var(--uv)'; extra += 'box-shadow: inset 0 0 0 1px var(--uv);'; }
      if (i === play) { bg = 'var(--bg-300)'; border = 'var(--uv)'; extra += 'background-image: linear-gradient(var(--uv-glow), var(--uv-glow));'; }
      if (i === cursor) extra += 'outline: 1px solid var(--ink); outline-offset: 2px;';
      const h = st === 'on' ? 100 : st === 'half' ? 50 : 0;
      return {
        style: 'position: relative; width: 40px; height: 40px; box-sizing: border-box; background-color: ' + bg + '; border: 1px solid ' + border + '; ' + extra,
        fillH: h > 0,
        fillStyle: 'position: absolute; left: 0; right: 0; bottom: 0; height: ' + h + '%; background: var(--uv);',
        tie: st === 'tie',
      };
    });

    return {
      ring, rules, pads,
      patternLine: line,
      patternFill: line + ' Z',
      playX: f(6 + 5.4 * sw),
      gate: [K('Rate', 0.583, '1/16'), K('Length', 0.118, '16'), K('Amount', 0.9, '90.00%'), K('Width', 0.737, '75.00%')],
      env: [K('Attack', 0.008, '1.5 ms'), K('Decay', 0.08, '15.0 ms'), K('Sustain', 1, '100.00%'), K('Release', 0.08, '15.0 ms')],
      fade: knob(1),
      true: true, false: false,
    };
  }
}
</script>
</body>
</html>
