<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>NI Vocalize</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="uv-tokens.css">
<link rel="stylesheet" href="ds/ultraviolet/components/bundle.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0;background:#060410}
</style>
</helmet>
<div class="ph" style="position: relative; width: 888px; height: 532px; overflow: hidden; font-family: var(--font-mono); color: var(--ink); background: var(--bg-000);">

  <!-- VOWEL (32, 32, 264 x 200): the vowel space, F2 across (high on the left), F1 down -- the mouth seen from the side. The letters on the path the Vowel knob walks; the dot is the vowel now. Size slides the path along its diagonal. -->
  <div style="position: absolute; left: 32px; top: 32px; width: 264px; height: 200px; box-sizing: border-box; background: var(--bg-000); border: 1px solid var(--line-100);">
    <span style="position: absolute; left: 6px; top: 3px; font: 400 10px/14px var(--font-mono); letter-spacing: .02em; text-transform: uppercase; color: var(--ink-muted);">Vowel&#160;&#160;&#160;{{vowelText}}</span>
    <svg viewBox="0 0 250 174" width="250" height="174" style="position: absolute; left: 6px; top: 20px; overflow: visible;" aria-hidden="true">
      <path d="{{path}}" fill="none" stroke="var(--line-200)" stroke-width="1"></path>
      <circle cx="{{a.x}}" cy="{{a.y}}" r="2" fill="var(--line-200)"></circle>
      <text x="{{a.tx}}" y="{{a.ty}}" fill="{{a.ink}}" font-family="var(--font-mono)" font-size="11" text-anchor="middle">{{a.name}}</text>
      <circle cx="{{e.x}}" cy="{{e.y}}" r="2" fill="var(--line-200)"></circle>
      <text x="{{e.tx}}" y="{{e.ty}}" fill="{{e.ink}}" font-family="var(--font-mono)" font-size="11" text-anchor="middle">{{e.name}}</text>
      <circle cx="{{i.x}}" cy="{{i.y}}" r="2" fill="var(--line-200)"></circle>
      <text x="{{i.tx}}" y="{{i.ty}}" fill="{{i.ink}}" font-family="var(--font-mono)" font-size="11" text-anchor="middle">{{i.name}}</text>
      <circle cx="{{o.x}}" cy="{{o.y}}" r="2" fill="var(--line-200)"></circle>
      <text x="{{o.tx}}" y="{{o.ty}}" fill="{{o.ink}}" font-family="var(--font-mono)" font-size="11" text-anchor="middle">{{o.name}}</text>
      <circle cx="{{u.x}}" cy="{{u.y}}" r="2" fill="var(--line-200)"></circle>
      <text x="{{u.tx}}" y="{{u.ty}}" fill="{{u.ink}}" font-family="var(--font-mono)" font-size="11" text-anchor="middle">{{u.name}}</text>
      <circle cx="{{dotX}}" cy="{{dotY}}" r="5" fill="var(--uv-deep)" stroke="var(--uv)" stroke-width="2" style="filter: drop-shadow(0 0 3px var(--uv-deep));"></circle>
    </svg>
  </div>

  <!-- ENVELOPE (312, 32, 544 x 200): the sound's colour, 50 Hz to 10 kHz in equal steps of pitch, 0 to -48 dB. Coming in in grey, going out in front; F1 and F2 marked. At Vocal 0 they are one line. -->
  <div style="position: absolute; left: 312px; top: 32px; width: 544px; height: 200px; box-sizing: border-box; background: var(--bg-000); border: 1px solid var(--line-100);">
    <span style="position: absolute; left: 6px; top: 3px; font: 400 10px/14px var(--font-mono); letter-spacing: .02em; text-transform: uppercase; color: var(--ink-muted);">{{envCaption}}</span>
    <svg viewBox="0 0 530 174" width="530" height="174" style="position: absolute; left: 6px; top: 20px; overflow: visible;" aria-hidden="true">
      <path d="{{f1Rule}}" fill="none" stroke="var(--line-200)" stroke-width="1"></path>
      <path d="{{f2Rule}}" fill="none" stroke="var(--line-200)" stroke-width="1"></path>
      <path d="{{inLine}}" fill="none" stroke="var(--line-200)" stroke-width="1"></path>
      <path d="{{outLine}}" fill="none" stroke="var(--uv)" stroke-width="2" stroke-linejoin="round" style="filter: drop-shadow(0 0 3px var(--uv-deep));"></path>
    </svg>
  </div>

  <!-- THREE PANELS (y 256, 208 tall), one column each: VOWEL, VOCAL, LEVEL. Three knob cells a panel in every panel, so the dials line up across the window; Mode under the two knobs it changes the working of. -->
  <sc-for list="{{panels}}" as="p" hint-placeholder-count="3">
    <section class="ph-panel" style="{{p.style}}" aria-label="{{p.title}}">
      <h2 class="ph-title" style="margin: 0 0 12px;">{{p.title}}</h2>
      <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); column-gap: 8px;">
        <sc-for list="{{p.knobs}}" as="k" hint-placeholder-count="3">
          <div style="display: flex; flex-direction: column; align-items: center; gap: 8px;">
            <span class="ph-label">{{k.label}}</span>
            <svg viewBox="0 0 48 48" width="48" height="48" aria-hidden="true">
              <circle cx="24" cy="24" r="16" fill="var(--bg-200)" stroke="var(--line-100)" stroke-width="1"></circle>
              <path d="{{k.ticks}}" fill="none" stroke="var(--line-200)" stroke-width="1"></path>
              <path d="{{k.rail}}" fill="none" stroke="var(--line-200)" stroke-width="2"></path>
              <path d="{{k.arc}}" fill="none" stroke="var(--uv)" stroke-width="2" style="filter: drop-shadow(0 0 3px var(--uv-deep));"></path>
              <path d="{{k.ptr}}" fill="none" stroke="var(--uv)" stroke-width="2"></path>
            </svg>
            <span class="ph-readout" style="width: 100%;">{{k.value}}<span class="unit">{{k.unit}}</span></span>
          </div>
        </sc-for>
      </div>
      <sc-if value="{{p.mode}}">
        <div style="margin-top: 12px; height: 28px; display: flex; align-items: center; gap: 8px;">
          <span class="ph-label" style="width: 44px;">Mode</span>
          <div class="ph-select" style="min-width: 0; width: 112px;"><div class="field">{{modeText}}<svg class="ph-icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="square"><path d="M4.5 6.5l3.5 3.5 3.5-3.5"></path></svg></div></div>
        </div>
      </sc-if>
      <sc-if value="{{p.ceiling}}">
        <div style="margin-top: 12px; height: 28px; display: flex; align-items: center; gap: 16px;">
          <span class="ph-toggle on"><span class="sw"></span><span class="ph-label">Ceiling</span></span>
        </div>
      </sc-if>
      <sc-if value="{{p.capture}}">
        <div style="margin-top: 12px; height: 28px; display: flex; align-items: center; gap: 8px;">
          <button class="ph-btn">Capture…</button>
          <sc-if value="{{captured}}"><button class="ph-btn">Forget</button></sc-if>
          <sc-if value="{{restorable}}"><button class="ph-btn">Restore</button></sc-if>
          <sc-if value="{{nothingToForget}}"><button class="ph-btn" disabled="">Forget</button></sc-if>
        </div>
      </sc-if>
    </section>
  </sc-for>

  <!-- THE HINT (0, 488, 888 x 28): three conventions, the Motion switch, the signature. -->
  <div class="ph-hint" style="position: absolute; left: 0; top: 488px; width: 888px; height: 44px; box-sizing: border-box; padding: 0 32px 16px; align-items: center;">
    <span class="tips"><b>drag</b> a knob to turn it<span class="sep">—</span><b>shift</b> for fine<span class="sep">—</span><b>double-click</b> to reset</span>
    <span class="ph-toggle on"><span class="sw"></span><span class="ph-label">Motion</span></span>
    <span class="ph-sig"><span class="mark"></span>Neon Ingvy</span>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"captured":{"editor":"boolean","default":true,"section":"Voice"},"forgotten":{"editor":"boolean","default":false,"section":"Voice"},"voice":{"editor":"range","min":0,"max":100,"step":5,"default":100,"section":"Voice"},"vowel":{"editor":"range","min":0,"max":4,"step":0.05,"default":1.3,"section":"Vocalize"},"vocal":{"editor":"range","min":0,"max":100,"step":1,"default":80,"section":"Vocalize"},"size":{"editor":"range","min":-100,"max":100,"step":5,"default":0,"section":"Vocalize"},"spectral":{"editor":"boolean","default":false,"section":"Vocalize"},"$preview":{"width":888,"height":532}}'>
class Component extends DCLogic {
  renderVals() {
    const vowel = Math.max(0, Math.min(4, this.props.vowel ?? 1.3));
    const vocal = (this.props.vocal ?? 80) / 100;
    const size = this.props.size ?? 0;
    const spectral = this.props.spectral ?? false;
    const captured = this.props.captured ?? true;
    const amount = captured ? (this.props.voice ?? 100) / 100 : 0;
    const names = ['A', 'E', 'I', 'O', 'U'];

    /* The engine's model (vz-core model.rs): Hillenbrand 1995 men's F1..F3,
     * F4 and F5 constant, Bark between vowels, Size scaling every formant. */
    const table = [
      [768, 1333, 2522, 3500, 4500], [476, 2089, 2691, 3500, 4500], [342, 2322, 3000, 3500, 4500],
      [497, 910, 2459, 3500, 4500], [378, 997, 2343, 3500, 4500]];
    const widths = [60, 90, 120, 200, 250];
    const bark = (f) => 26.81 * f / (1960 + f) - 0.53;
    const hz = (z) => 1960 * (z + 0.53) / (26.28 - z);
    const scale = Math.pow(1.25, -size / 100);
    /* A captured singer (a stand-in): a voice a sixth higher, with an open
     * A, a forward I and a dark U of their own; E and O were not sung. */
    const mine = table.map((row, v) => row.map((f, k) => f * 1.17 * ([[1.08, 1.04, 1, 1, 1], [1, 1, 1, 1, 1], [0.95, 1.07, 1.03, 1, 1], [1, 1, 1, 1, 1], [1.02, 0.9, 1, 1, 1]][v][k])));
    const found = [true, false, true, false, true];
    /* How sure the capture was of each measured vowel: I held steady, U
     * wandered. */
    const sure = [0.9, 0, 0.95, 0, 0.45];
    const voiced = table.map((row, v) => row.map((f, k) => hz(bark(f) + (bark(mine[v][k]) - bark(f)) * amount)));
    const formants = (v) => {
      const i = Math.min(3, Math.floor(v)), t = v - i;
      return voiced[i].map((a, k) => hz(bark(a) + (bark(voiced[i + 1][k]) - bark(a)) * t) * scale);
    };

    const path = (pts) => pts.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' ');
    const logFrac = (v, a, b) => Math.max(0, Math.min(1, Math.log(v / a) / Math.log(b / a)));

    /* VOWEL: F2 3200 -> 560 Hz across, F1 220 -> 1100 Hz down. */
    const at = (f) => [250 * logFrac(f[1], 3200, 560), 174 * logFrac(f[0], 220, 1100)];
    const along = [];
    for (let i = 0; i <= 80; i++) along.push(at(formants(i / 20)));
    const letters = names.map((name, k) => {
      const [x, y] = at(formants(k));
      const dx = x < 125 ? -12 : 12;
      const ink = captured && found[k]
        ? 'color-mix(in srgb, var(--ink) ' + Math.round(100 * (0.45 + 0.55 * sure[k])) + '%, transparent)'
        : 'var(--ink-muted)';
      return { name, ink, x: x.toFixed(1), y: y.toFixed(1), tx: (x + dx).toFixed(1), ty: (y + 4).toFixed(1) };
    });
    const now = formants(vowel);
    const [dotX, dotY] = at(now);

    /* ENVELOPE: a saw pad's colour (a gentle tilt, a body resonance at
     * 2.8 kHz) traded for the vowel's cascade (unity at DC), each with its
     * peak at 0 dB, 0..-48 dB down the well. */
    const fs = 48000;
    const cascade = (f) => {
      const w = 2 * Math.PI * f / fs;
      let db = 0;
      now.forEach((fk, k) => {
        const rho = Math.exp(-Math.PI * widths[k] / fs);
        const b = 2 * rho * Math.cos(2 * Math.PI * fk / fs), c = -rho * rho, a = 1 - b - c;
        const re = 1 - b * Math.cos(w) - c * Math.cos(2 * w), im = b * Math.sin(w) + c * Math.sin(2 * w);
        db += 20 * Math.log10(Math.abs(a) / Math.hypot(re, im));
      });
      return db;
    };
    const input = (f) => -4.5 * Math.log2(f / 120) * (f > 120 ? 1 : 0) + 9 * Math.exp(-Math.pow(Math.log2(f / 2800) * 2.2, 2));
    const freqs = [];
    for (let i = 0; i <= 160; i++) freqs.push(50 * Math.pow(200, i / 160));
    const norm = (vals) => { const top = Math.max(...vals); return vals.map((v) => v - top); };
    const inDb = norm(freqs.map(input));
    const vowelDb = norm(freqs.map(cascade));
    const outDb = norm(inDb.map((v, i) => v + vocal * (vowelDb[i] - v)));
    const yOf = (db) => 174 * Math.min(1, -db / 48);
    const xOf = (f) => 530 * logFrac(f, 50, 10000);
    const rule = (f) => 'M' + xOf(f).toFixed(1) + ' 0 L' + xOf(f).toFixed(1) + ' 174';

    /* A knob's paths for a value 0..1, from the minimum or, bipolar, from
     * 12 o'clock; detents as ticks outside the rail. */
    const knob = (label, n, value, unit, bipolar, detents) => {
      const pt = (t, r) => {
        const a = (-225 + 270 * t) * Math.PI / 180;
        return [24 + r * Math.cos(a), 24 + r * Math.sin(a)];
      };
      const arc = (t0, t1) => {
        if (Math.abs(t1 - t0) < 1e-3) return '';
        const [a, b] = [Math.min(t0, t1), Math.max(t0, t1)];
        const p0 = pt(a, 20), p1 = pt(b, 20);
        const large = (b - a) * 270 > 180 ? 1 : 0;
        return 'M' + p0[0].toFixed(2) + ' ' + p0[1].toFixed(2) + ' A20 20 0 ' + large + ' 1 ' + p1[0].toFixed(2) + ' ' + p1[1].toFixed(2);
      };
      const inner = pt(n, 6), outer = pt(n, 14);
      const ticks = (detents || []).map((d) => {
        const p = pt(d, 22), q = pt(d, 24);
        return 'M' + p[0].toFixed(2) + ' ' + p[1].toFixed(2) + ' L' + q[0].toFixed(2) + ' ' + q[1].toFixed(2);
      }).join(' ');
      return {
        label, value, unit, ticks,
        rail: arc(0, 1),
        arc: bipolar ? arc(0.5, n) : arc(0, n),
        ptr: 'M' + inner[0].toFixed(2) + ' ' + inner[1].toFixed(2) + ' L' + outer[0].toFixed(2) + ' ' + outer[1].toFixed(2),
      };
    };

    /* The engine's words: "E", or "E>I 30 %". */
    const pct = Math.round((vowel - Math.floor(vowel)) * 100);
    const base = Math.floor(vowel) + (pct >= 100 ? 1 : 0);
    const vowelWords = (pct <= 0 || pct >= 100) ? [names[base], ''] : [names[base] + '>' + names[base + 1] + ' ' + pct, '%'];
    const signed = (v) => (v > 0 ? '+' : '') + String(Math.round(v));

    const panelStyle = (x) => 'position: absolute; left: ' + x + 'px; top: 256px; width: 264px; height: 208px; box-sizing: border-box; margin: 0;';
    return {
      vowelText: vowelWords[0] + (vowelWords[1] ? ' ' + vowelWords[1] : '') + (captured ? '\u00a0\u00a0\u00a0MY VOWELS' : ''),
      captured,
      restorable: !captured && (this.props.forgotten ?? false),
      nothingToForget: !captured && !(this.props.forgotten ?? false),
      path: path(along),
      a: letters[0], e: letters[1], i: letters[2], o: letters[3], u: letters[4],
      dotX: dotX.toFixed(1),
      dotY: dotY.toFixed(1),
      envCaption: spectral ? 'Envelope   Spectral   21 ms late' : 'Envelope   Time',
      inLine: path(freqs.map((f, i) => [xOf(f), yOf(inDb[i])])),
      outLine: path(freqs.map((f, i) => [xOf(f), yOf(outDb[i])])),
      f1Rule: rule(now[0]),
      f2Rule: rule(now[1]),
      modeText: spectral ? 'Spectral' : 'Time',
      panels: [
        { title: 'Vowel', style: panelStyle(32), mode: false, capture: true, ceiling: false,
          knobs: [knob('Vowel', vowel / 4, vowelWords[0], vowelWords[1], false, [0, 0.25, 0.5, 0.75, 1]),
                  knob('Size', (size + 100) / 200, signed(size), '%', true),
                  knob('Voice', (this.props.voice ?? 100) / 100, String(Math.round(this.props.voice ?? 100)), '%', false)] },
        { title: 'Vocal', style: panelStyle(312), mode: true, capture: false, ceiling: false,
          knobs: [knob('Vocal', vocal, String(Math.round(vocal * 100)), '%', false),
                  knob('Resonance', 0.5, '50', '%', false),
                  knob('Excite', 0, '0', '%', false)] },
        { title: 'Level', style: panelStyle(592), mode: false, capture: false, ceiling: true,
          knobs: [knob('Mix', 1, '100', '%', false), knob('Output', 0.5, '0.0', 'dB', true)] },
      ],
    };
  }
}
</script>
</body>
</html>
