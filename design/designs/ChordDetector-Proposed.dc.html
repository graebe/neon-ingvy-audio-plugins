<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>NI Chord-Detector — proposed</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="uv-tokens.css">
<link rel="stylesheet" href="ds/ultraviolet/components/bundle.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&amp;family=Noto+Music&amp;display=swap">
<style>
body{margin:0;background:#060410}
</style>
</helmet>
<div class="ph" style="position: relative; width: 760px; height: 616px; overflow: hidden; font-family: var(--font-mono); color: var(--ink); background: var(--bg-000);">

  <!-- CIRCLE OF FIFTHS (32, 32, 232 x 232). Twelve keys on a ring, clockwise in fifths. The key's seven notes are tinted, the sounding ones lit, the root brightest; the chosen tonic carries the window's one amber mark. Click a key to choose it. -->
  <div style="position: absolute; left: 32px; top: 32px; width: 232px; height: 232px;">
    <div style="position: absolute; left: 24px; top: 24px; width: 184px; height: 184px; box-sizing: border-box; border: 1px solid var(--line-100); border-radius: 50%;"></div>
    <sc-for list="{{circle}}" as="n" hint-placeholder-count="12">
      <button type="button" aria-label="{{n.aria}}" onClick="{{n.pick}}" style="{{n.style}}">{{n.label}}</button>
    </sc-for>
    <div style="position: absolute; left: 60px; top: 78px; width: 112px; display: flex; flex-direction: column; align-items: center; gap: 8px;">
      <span class="ph-label">Key</span>
      <button type="button" class="ph-btn" aria-label="Mode: {{modeName}}. Click for the next mode." onClick="{{nextMode}}" style="width: 104px; justify-content: space-between; padding: 0 8px 0 12px; font-weight: 400; font-size: 13px; letter-spacing: 0;">{{modeName}}<svg class="ph-icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="square"><path d="M4.5 6.5l3.5 3.5 3.5-3.5"></path></svg></button>
      <span style="font: 400 10px/14px var(--font-mono); letter-spacing: .02em; color: var(--ink-dim);">{{signature}}</span>
    </div>
  </div>

  <!-- THE READING (296, 32, 432 x 232): the window's one readout, its words, the notes, the other readings, then the three settings. -->
  <div style="position: absolute; left: 296px; top: 32px; width: 432px; height: 232px; display: flex; flex-direction: column;">
    <div style="height: 32px; display: flex; align-items: center; gap: 16px;">
      <span class="ph-readout-text" style="{{nameStyle}}">{{name}}</span>
      <sc-if value="{{hasDegree}}" hint-placeholder-val="{{true}}">
        <span style="height: 24px; box-sizing: border-box; padding: 0 8px; border: 1px solid var(--line-200); background: var(--bg-200); font: 500 13px/22px var(--font-mono); color: var(--uv);">{{degree}}</span>
      </sc-if>
      <sc-if value="{{held}}" hint-placeholder-val="{{false}}">
        <span class="ph-led on" style="margin-left: auto;"><span class="lens"></span><span class="ph-label">Held</span></span>
      </sc-if>
    </div>
    <div class="ph-label" style="margin-top: 8px; height: 16px; color: var(--ink-muted);">{{description}}</div>

    <div style="margin-top: 24px; display: flex; align-items: baseline; gap: 12px;">
      <span class="ph-label" style="width: 48px; flex: none;">Notes</span>
      <span style="font: 400 13px/18px var(--font-mono); color: var(--ink); font-variant-numeric: tabular-nums;">{{notes}}</span>
    </div>
    <div style="margin-top: 12px; height: 24px; display: flex; align-items: center; gap: 12px;">
      <span class="ph-label" style="width: 48px; flex: none;">Also</span>
      <sc-for list="{{alternatives}}" as="a" hint-placeholder-count="1">
        <span style="height: 24px; box-sizing: border-box; padding: 0 8px; border: 1px solid var(--line-100); font: 400 12px/22px var(--font-mono); color: var(--ink-muted);">{{a.text}}</span>
      </sc-for>
      <sc-if value="{{noAlternatives}}" hint-placeholder-val="{{false}}">
        <span style="font: 400 12px/22px var(--font-mono); color: var(--ink-dim);">–</span>
      </sc-if>
    </div>

    <div style="margin-top: auto; height: 28px; display: flex; align-items: center; gap: 24px;">
      <span style="display: flex; align-items: center; gap: 8px;">
        <span class="ph-label" style="width: 72px;">Spelling</span>
        <span class="ph-transport" role="group" aria-label="Spelling">
          <sc-for list="{{spellings}}" as="s" hint-placeholder-count="3">
            <button type="button" class="{{s.cls}}" aria-pressed="{{s.on}}" onClick="{{s.pick}}" style="min-width: 40px; justify-content: center;">{{s.label}}</button>
          </sc-for>
        </span>
      </span>
      <button type="button" class="{{holdClass}}" aria-pressed="{{hold}}" onClick="{{toggleHold}}" style="height: 28px; padding: 0; border: 0; background: none; color: inherit; font: inherit;"><span class="sw"></span><span class="ph-label">Hold</span></button>
      <span class="ph-led" style="margin-left: auto;"><span class="lens"></span><span class="ph-label">Pedal</span></span>
    </div>
  </div>

  <!-- HISTORY (32, 288, 696 x 172): the last bars, scrolling right to left with now at the right edge. Staff is proportional: a head at the onset, a tail for the duration, chord names at each change. MIDI is one numbered line per note. -->
  <div style="position: absolute; left: 32px; top: 288px; width: 696px; height: 28px; display: flex; align-items: center; gap: 16px;">
    <h2 class="ph-title" style="margin: 0;">History</h2>
    <span style="margin-left: auto; display: flex; align-items: center; gap: 8px;">
      <span class="ph-label">Zoom</span>
      <button type="button" class="ph-btn" aria-label="Zoom: {{zoomLabel}}. Click for the next size." onClick="{{nextZoom}}" style="width: 88px; justify-content: space-between; padding: 0 8px 0 12px; font-weight: 400; font-size: 13px; letter-spacing: 0;">{{zoomLabel}}<svg class="ph-icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="square"><path d="M4.5 6.5l3.5 3.5 3.5-3.5"></path></svg></button>
    </span>
    <span style="display: flex; align-items: center; gap: 8px;">
      <span class="ph-label">Span</span>
      <button type="button" class="ph-btn" aria-label="Span: {{spanLabel}}. Click for the next span." onClick="{{nextSpan}}" style="width: 88px; justify-content: space-between; padding: 0 8px 0 12px; font-weight: 400; font-size: 13px; letter-spacing: 0;">{{spanLabel}}<svg class="ph-icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="square"><path d="M4.5 6.5l3.5 3.5 3.5-3.5"></path></svg></button>
    </span>
    <span class="ph-transport" role="group" aria-label="History view">
      <sc-for list="{{views}}" as="v" hint-placeholder-count="2">
        <button type="button" class="{{v.cls}}" aria-pressed="{{v.on}}" onClick="{{v.pick}}" style="min-width: 56px; justify-content: center;">{{v.label}}</button>
      </sc-for>
    </span>
  </div>
  <div style="position: absolute; left: 32px; top: 324px; width: 696px; height: 136px; box-sizing: border-box; background: var(--bg-200); border: 1px solid var(--line-100); overflow: hidden;">
    <sc-for list="{{bars}}" as="b" hint-placeholder-count="4">
      <div style="{{b.style}}"></div>
    </sc-for>
    <sc-if value="{{staff}}" hint-placeholder-val="{{true}}">
      <sc-for list="{{staffLines}}" as="l" hint-placeholder-count="10">
        <div style="{{l.style}}"></div>
      </sc-for>
      <span style="position: absolute; left: 6px; top: 6px; font: 400 44px/1 'Noto Music', serif; color: var(--ink-muted);">𝄞</span>
      <span style="position: absolute; left: 8px; top: 70px; font: 400 30px/1 'Noto Music', serif; color: var(--ink-muted);">𝄢</span>
      <sc-for list="{{keySig}}" as="k" hint-placeholder-count="4">
        <span style="{{k.style}}">{{k.glyph}}</span>
      </sc-for>
      <sc-for list="{{ledgers}}" as="l" hint-placeholder-count="2">
        <div style="{{l.style}}"></div>
      </sc-for>
      <sc-for list="{{heads}}" as="h" hint-placeholder-count="12">
        <div style="{{h.tail}}"></div>
        <div style="{{h.head}}"></div>
        <span style="{{h.accStyle}}">{{h.acc}}</span>
      </sc-for>
      <sc-for list="{{labels}}" as="c" hint-placeholder-count="3">
        <span style="{{c.style}}">{{c.text}}</span>
      </sc-for>
    </sc-if>
    <sc-if value="{{midi}}" hint-placeholder-val="{{false}}">
      <sc-for list="{{rows}}" as="r" hint-placeholder-count="24">
        <div style="{{r.style}}"></div>
        <span style="{{r.labelStyle}}">{{r.label}}</span>
      </sc-for>
      <sc-for list="{{rolls}}" as="n" hint-placeholder-count="12">
        <div style="{{n.style}}"></div>
      </sc-for>
    </sc-if>
    <div style="position: absolute; right: 6px; top: 0; bottom: 0; width: 1px; background: var(--uv-deep); opacity: .6;"></div>
  </div>

  <!-- KEYBOARD (32, 476, 696 x 72): four octaves from C2, held keys lit, the bass marked underneath. -->
  <div style="position: absolute; left: 32px; top: 476px; width: 696px; height: 72px; box-sizing: border-box; background: var(--bg-100); border: 1px solid var(--line-100);">
    <div style="position: absolute; left: 11px; top: 4px; width: 672px; height: 56px;">
      <sc-for list="{{whites}}" as="w" hint-placeholder-count="28">
        <div style="{{w.style}}"><span style="{{w.labelStyle}}">{{w.label}}</span></div>
      </sc-for>
      <sc-for list="{{blacks}}" as="k" hint-placeholder-count="20">
        <div style="{{k.style}}"></div>
      </sc-for>
      <sc-for list="{{bassMark}}" as="m" hint-placeholder-count="1">
        <div style="{{m.style}}"></div>
      </sc-for>
    </div>
  </div>

  <!-- HINT (32, 572): three conventions, then the signature. -->
  <div class="ph-hint" style="position: absolute; left: 32px; top: 572px; width: 696px; height: 28px; box-sizing: border-box; padding: 0;">
    <span class="tips" style="white-space: nowrap;"><b>play</b> notes on this track<span class="sep">–</span><b>click</b> a key on the circle<span class="sep">–</span><b>hold</b> keeps the last chord</span>
    <span class="ph-sig"><span class="mark"></span>Neon Ingvy</span>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":760,"height":616}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { tonic: 0, mode: 0, spelling: 0, hold: true, view: 'staff', span: 2, zoom: 1, tick: 40 };
  }

  componentDidMount() {
    this.timer = setInterval(() => this.setState((s) => ({ tick: s.tick + 1 })), 150);
  }

  componentWillUnmount() {
    clearInterval(this.timer);
  }

  renderVals() {
    const S = this.state;
    const MODES = ['Ionian', 'Dorian', 'Phrygian', 'Lydian', 'Mixolydian', 'Aeolian', 'Locrian'];
    const IONIAN = [0, 2, 4, 5, 7, 9, 11];
    const CHROMATIC = [0, 1, 1, 2, 2, 3, 3, 4, 5, 5, 6, 6];
    const LETTERS = 'CDEFGAB';
    const steps = IONIAN.map((_, i) => (IONIAN[(S.mode + i) % 7] - IONIAN[S.mode] + 12) % 12);
    const scale = steps.map((x) => (S.tonic + x) % 12);
    const parent = (S.tonic - IONIAN[S.mode] + 12) % 12;
    const fifths = (parent * 7) % 12;
    const signature = fifths > 6 ? fifths - 12 : fifths;

    /* Naming, as music-core's Key::name_of and NoteName::of do it. */
    const plain = (pc, flats) => {
      const white = IONIAN.indexOf(pc);
      if (white >= 0) return { l: white, a: 0 };
      return flats ? { l: IONIAN.indexOf((pc + 1) % 12), a: -1 } : { l: IONIAN.indexOf((pc + 11) % 12), a: 1 };
    };
    const stepOf = (pc) => {
      const above = (pc - S.tonic + 12) % 12;
      const i = steps.indexOf(above);
      if (i >= 0) return [i, 0];
      const j = CHROMATIC[above];
      return [j, above - steps[j]];
    };
    const nameOf = (pc) => {
      if (S.spelling === 1) return plain(pc, false);
      if (S.spelling === 2) return plain(pc, true);
      const t = plain(S.tonic, signature < 0);
      const l = (t.l + stepOf(pc)[0]) % 7;
      return { l, a: (((pc - IONIAN[l]) % 12) + 18) % 12 - 6 };
    };
    const text = (n) => LETTERS[n.l] + (n.a < 0 ? 'b'.repeat(-n.a) : '#'.repeat(n.a));
    const written = (midi) => {
      const n = nameOf(midi % 12);
      const octave = Math.floor((midi - n.a - IONIAN[n.l]) / 12) - 1;
      return { n, octave, step: octave * 7 + n.l, text: text(n) + octave };
    };

    const Q = {
      maj: { sym: '', name: 'major', low: false, suf: '', iv: [0, 4, 7] },
      m7: { sym: 'm7', name: 'minor 7', low: true, suf: '7', iv: [0, 3, 7, 10] },
      dom7: { sym: '7', name: 'dominant 7', low: false, suf: '7', iv: [0, 4, 7, 10] },
      maj7: { sym: 'maj7', name: 'major 7', low: false, suf: 'maj7', iv: [0, 4, 7, 11] },
      m7b5: { sym: 'm7b5', name: 'half-diminished 7', low: true, suf: 'ø7', iv: [0, 3, 6, 10] },
      six: { sym: '6', name: 'major 6', low: false, suf: '6', iv: [0, 4, 7, 9] },
      m6: { sym: 'm6', name: 'minor 6', low: true, suf: '6', iv: [0, 3, 7, 9] },
    };
    const SONG = [
      { root: 9, q: 'm7', notes: [45, 55, 60, 64], alts: [{ root: 0, q: 'six' }] },
      { root: 2, q: 'm7', notes: [50, 53, 57, 60], alts: [{ root: 5, q: 'six' }] },
      { root: 7, q: 'dom7', notes: [47, 53, 55, 62], alts: [] },
      { root: 0, q: 'maj7', notes: [48, 55, 59, 64], alts: [] },
      { root: 10, q: 'maj', notes: [46, 53, 62], alts: [] },
      { root: 6, q: 'm7b5', notes: [42, 48, 52, 57], alts: [{ root: 9, q: 'm6' }] },
    ];
    const chordText = (root, q, bass) => {
      const name = text(nameOf(root)) + Q[q].sym;
      return bass % 12 === root ? name : name + '/' + text(nameOf(bass % 12));
    };

    /* The clock: a sixteenth per tick, a bar per chord, released for the last eighth. */
    const now = S.tick * 0.25;
    const bar = Math.floor(now / 4);
    const into = now - bar * 4;
    const sounding = into < 3.5;
    const chordAt = (k) => SONG[((k % SONG.length) + SONG.length) % SONG.length];
    const shown = sounding ? chordAt(bar) : (S.hold ? chordAt(bar) : null);
    const held = !sounding && S.hold;

    let reading = { name: '—', degree: '', description: 'play notes on this track', notes: '', alternatives: [], root: -1, pcs: [], midis: [] };
    if (shown) {
      const q = Q[shown.q];
      const bass = shown.notes[0];
      const [step, acc] = stepOf(shown.root);
      const numeral = ['I', 'II', 'III', 'IV', 'V', 'VI', 'VII'][step];
      const inv = q.iv.indexOf((bass % 12 - shown.root + 12) % 12);
      const ord = ['', 'st', 'nd', 'rd'][inv] || 'th';
      reading = {
        name: chordText(shown.root, shown.q, bass),
        degree: (acc < 0 ? 'b' : acc > 0 ? '#' : '') + (q.low ? numeral.toLowerCase() : numeral) + q.suf,
        description: text(nameOf(shown.root)) + ' ' + q.name + (inv > 0 ? ' · ' + inv + ord + ' inversion' : ''),
        notes: shown.notes.map((m) => written(m).text).join(' '),
        alternatives: shown.alts.map((a) => ({ text: chordText(a.root, a.q, bass) })),
        root: shown.root,
        pcs: shown.notes.map((m) => m % 12),
        midis: shown.notes,
      };
    }
    const litColor = held ? 'var(--uv-deep)' : 'var(--uv)';

    /* The circle. */
    const NAMES = ['C', 'G', 'D', 'A', 'E', 'B', 'F#', 'Db', 'Ab', 'Eb', 'Bb', 'F'];
    const circle = NAMES.map((label, i) => {
      const pc = (i * 7) % 12;
      const angle = (-90 + i * 30) * Math.PI / 180;
      const x = 116 + 92 * Math.cos(angle) - 18;
      const y = 116 + 92 * Math.sin(angle) - 18;
      const inScale = scale.includes(pc);
      const lit = reading.pcs.includes(pc);
      const isRoot = pc === reading.root;
      let look = 'background: var(--bg-100); border: 1px solid var(--line-100); color: var(--ink-dim);';
      if (inScale) look = 'background: var(--bg-200); border: 1px solid var(--line-200); color: var(--ink-muted);';
      if (lit) look = 'background: var(--bg-200); border: 1px solid ' + litColor + '; color: ' + litColor + '; box-shadow: ' + (held ? 'none' : 'var(--glow-led)') + ';';
      if (isRoot) look = 'background: ' + litColor + '; border: 1px solid ' + litColor + '; color: var(--on-uv); box-shadow: ' + (held ? 'none' : 'var(--glow-led)') + ';';
      const ring = pc === S.tonic ? ' outline: 1px solid var(--amber); outline-offset: 3px;' : '';
      return {
        label,
        aria: label + (pc === S.tonic ? ', the chosen tonic' : '') + (lit ? ', sounding' : ''),
        pick: () => this.setState({ tonic: pc }),
        style: 'position: absolute; left: ' + x.toFixed(1) + 'px; top: ' + y.toFixed(1) + 'px; width: 36px; height: 36px; box-sizing: border-box; border-radius: 50%; padding: 0; cursor: pointer; font: 500 12px/1 var(--font-mono); ' + look + ring,
      };
    });

    /* The history's window. */
    const spanBars = [1, 2, 4, 8][S.span];
    const beats = spanBars * 4;
    const left = now - beats;
    const X0 = 56, X1 = 682;
    const xOf = (t) => X0 + ((t - left) / beats) * (X1 - X0);
    const events = [];
    for (let k = Math.floor(left / 4); k <= bar; k++) {
      const start = k * 4;
      const end = Math.min(start + 3.5, now);
      if (end <= left || start > now) continue;
      const c = chordAt(k);
      for (const m of c.notes) events.push({ m, start: Math.max(start, left), end, live: k === bar && sounding, k, onset: start >= left });
    }
    const bars = [];
    for (let t = Math.ceil(left / 4) * 4; t <= now; t += 4) {
      bars.push({ style: 'position: absolute; left: ' + xOf(t).toFixed(1) + 'px; top: 0; bottom: 0; width: 1px; background: var(--line-200);' });
    }

    /* Staff: treble F5 at 20 px, bass A3 at 76 px, 4 px a step. */
    const yOf = (s) => (s >= 28 ? 20 + (38 - s) * 4 : 76 + (26 - s) * 4);
    const staffLines = [];
    for (const top of [20, 76]) for (let i = 0; i < 5; i++) staffLines.push({ style: 'position: absolute; left: 4px; right: 4px; top: ' + (top + i * 8) + 'px; height: 1px; background: var(--line-200);' });
    const SHARP_T = [38, 35, 39, 36, 33, 37, 34], FLAT_T = [34, 37, 33, 36, 32, 35, 31];
    const keySig = [];
    const count = Math.abs(signature);
    for (let i = 0; i < count; i++) {
      const sharp = signature > 0;
      const t = (sharp ? SHARP_T : FLAT_T)[i];
      for (const s of [t, t - 14]) keySig.push({ glyph: sharp ? '♯' : '♭', style: 'position: absolute; left: ' + (34 + i * 7) + 'px; top: ' + (yOf(s) - 9) + 'px; font: 400 14px/1 \'Noto Music\', serif; color: var(--ink-muted);' });
    }
    const sigAcc = {};
    for (let i = 0; i < count; i++) sigAcc[(signature > 0 ? 'FCGDAEB' : 'BEADGCF')[i]] = signature > 0 ? 1 : -1;
    const ledgers = [], heads = [], labels = [];
    const seenLedger = {};
    for (const e of events) {
      const w = written(e.m);
      const y = yOf(w.step);
      const x = xOf(e.start);
      const color = e.live ? litColor : 'var(--ink-muted)';
      const lines = [];
      if (w.step === 28) lines.push(28);
      if (w.step < 18) for (let s = 16; s >= w.step; s -= 2) lines.push(s);
      if (w.step > 38) for (let s = 40; s <= w.step; s += 2) lines.push(s);
      for (const s of lines) {
        const key = e.k + ':' + s;
        if (seenLedger[key] || !e.onset) continue;
        seenLedger[key] = true;
        ledgers.push({ style: 'position: absolute; left: ' + (x - 7).toFixed(1) + 'px; top: ' + yOf(s) + 'px; width: 14px; height: 1px; background: var(--line-200);' });
      }
      const expected = sigAcc[LETTERS[w.n.l]] || 0;
      const acc = e.onset && w.n.a !== expected ? (w.n.a > 0 ? '♯' : w.n.a < 0 ? '♭' : '♮') : '';
      heads.push({
        tail: 'position: absolute; left: ' + x.toFixed(1) + 'px; top: ' + (y - 1) + 'px; width: ' + Math.max(0, xOf(e.end) - x).toFixed(1) + 'px; height: 2px; background: ' + (e.live ? 'var(--uv-deep)' : 'var(--line-200)') + ';',
        head: e.onset ? 'position: absolute; left: ' + (x - 5).toFixed(1) + 'px; top: ' + (y - 3) + 'px; width: 10px; height: 7px; border-radius: 50%; transform: rotate(-20deg); background: ' + color + ';' + (e.live && !held ? ' box-shadow: var(--glow-led);' : '') : 'display: none;',
        acc,
        accStyle: 'position: absolute; left: ' + (x - 17).toFixed(1) + 'px; top: ' + (y - 9) + 'px; font: 400 13px/1 \'Noto Music\', serif; color: ' + color + ';',
      });
    }
    for (let k = Math.ceil(left / 4); k <= bar; k++) {
      const c = chordAt(k);
      labels.push({ text: chordText(c.root, c.q, c.notes[0]), style: 'position: absolute; left: ' + (xOf(k * 4) + 4).toFixed(1) + 'px; top: 2px; font: 400 10px/12px var(--font-mono); color: ' + (k === bar ? 'var(--ink)' : 'var(--ink-dim)') + ';' });
    }

    /* MIDI: one line per note over the played range, numbered at C. */
    const all = events.map((e) => e.m);
    let lo = Math.min(...all, 60) - 2, hi = Math.max(...all, 60) + 2;
    while (hi - lo < 23) { lo--; hi++; }
    const rowH = 134 / (hi - lo + 1);
    const rowY = (m) => (hi - m) * rowH;
    const rows = [];
    for (let m = lo; m <= hi; m++) {
      const black = [1, 3, 6, 8, 10].includes(m % 12);
      rows.push({
        style: 'position: absolute; left: 48px; right: 0; top: ' + rowY(m).toFixed(1) + 'px; height: ' + rowH.toFixed(1) + 'px; background: ' + (black ? 'var(--bg-100)' : 'transparent') + ';' + (m % 12 === 0 ? ' border-bottom: 1px solid var(--line-200);' : ''),
        label: m % 12 === 0 ? written(m).text + ' ' + m : '',
        labelStyle: 'position: absolute; left: 6px; top: ' + (rowY(m) - 4).toFixed(1) + 'px; font: 400 9px/12px var(--font-mono); color: var(--ink-dim); font-variant-numeric: tabular-nums;',
      });
    }
    const rolls = events.map((e) => ({
      style: 'position: absolute; left: ' + xOf(e.start).toFixed(1) + 'px; top: ' + rowY(e.m).toFixed(1) + 'px; width: ' + Math.max(2, xOf(e.end) - xOf(e.start)).toFixed(1) + 'px; height: ' + Math.max(2, rowH - 1).toFixed(1) + 'px; background: ' + (e.live ? litColor : 'var(--ink-dim)') + ';' + (e.live && !held ? ' box-shadow: var(--glow-led);' : ''),
    }));

    /* The keyboard: C2 to B5. */
    const WHITE = [0, 2, 4, 5, 7, 9, 11];
    const whites = [], blacks = [];
    let bassMark = [];
    for (let i = 0; i < 28; i++) {
      const m = 36 + Math.floor(i / 7) * 12 + WHITE[i % 7];
      const lit = reading.midis.includes(m);
      whites.push({
        style: 'position: absolute; left: ' + (i * 24) + 'px; top: 0; width: 23px; height: 56px; background: ' + (lit ? litColor : 'var(--bg-300)') + ';' + (lit && !held ? ' box-shadow: var(--glow-led);' : ''),
        label: i % 7 === 0 ? 'C' + (2 + i / 7) : '',
        labelStyle: 'position: absolute; left: 0; right: 0; bottom: 3px; text-align: center; font: 400 9px/10px var(--font-mono); color: ' + (lit ? 'var(--on-uv)' : 'var(--ink-dim)') + ';',
      });
      if (m === reading.midis[0]) bassMark = [{ style: 'position: absolute; left: ' + (i * 24 + 4) + 'px; top: 60px; width: 15px; height: 3px; background: ' + litColor + ';' }];
      if ([0, 1, 3, 4, 5].includes(i % 7)) {
        const b = m + 1;
        const bl = reading.midis.includes(b);
        blacks.push({ style: 'position: absolute; left: ' + (i * 24 + 16) + 'px; top: 0; width: 14px; height: 34px; box-sizing: border-box; border: 1px solid var(--line-200); background: ' + (bl ? litColor : 'var(--bg-000)') + ';' });
        if (b === reading.midis[0]) bassMark = [{ style: 'position: absolute; left: ' + (i * 24 + 17) + 'px; top: 60px; width: 12px; height: 3px; background: ' + litColor + ';' }];
      }
    }

    const sigText = signature === 0 ? 'no sharps or flats' : Math.abs(signature) + (signature > 0 ? ' sharp' : ' flat') + (Math.abs(signature) > 1 ? 's' : '');
    return {
      circle,
      modeName: MODES[S.mode],
      nextMode: () => this.setState({ mode: (S.mode + 1) % 7 }),
      signature: text(plain(S.tonic, signature < 0)) + ' · ' + sigText,
      name: reading.name,
      nameStyle: shown ? '' : 'color: var(--ink-dim);',
      degree: reading.degree,
      hasDegree: reading.degree !== '',
      held,
      description: reading.description,
      notes: reading.notes || '–',
      alternatives: reading.alternatives,
      noAlternatives: reading.alternatives.length === 0,
      spellings: ['Auto', '#', 'b'].map((label, i) => ({
        label, on: S.spelling === i, cls: 'ph-btn' + (S.spelling === i ? ' active' : ''),
        pick: () => this.setState({ spelling: i }),
      })),
      hold: S.hold,
      holdClass: 'ph-toggle' + (S.hold ? ' on' : ''),
      toggleHold: () => this.setState({ hold: !S.hold }),
      spanLabel: spanBars + (spanBars === 1 ? ' bar' : ' bars'),
      nextSpan: () => this.setState({ span: (S.span + 1) % 4 }),
      zoomLabel: ['75%', '100%', '125%', '150%'][S.zoom],
      nextZoom: () => this.setState({ zoom: (S.zoom + 1) % 4 }),
      views: [['staff', 'Staff'], ['midi', 'MIDI']].map(([id, label]) => ({
        label, on: S.view === id, cls: 'ph-btn' + (S.view === id ? ' active' : ''),
        pick: () => this.setState({ view: id }),
      })),
      staff: S.view === 'staff',
      midi: S.view === 'midi',
      bars, staffLines, keySig, ledgers, heads, labels, rows, rolls,
      whites, blacks, bassMark,
    };
  }
}
</script>
</body>
</html>
