<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>NI Side-Chain — as built</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="uv-tokens.css">
<link rel="stylesheet" href="ds/ultraviolet/components/bundle.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0;background:#060410}
</style>
</helmet>
<div class="ph" style="position: relative; width: 760px; height: 604px; overflow: hidden; font-family: var(--font-mono); color: var(--ink);">

  <!-- Tag row (32, 32): repeats the plugin name the host already shows. -->
  <div style="position: absolute; left: 32px; top: 32px; width: 696px; height: 16px; display: flex; align-items: baseline; gap: 12px; font: 400 10px/14px var(--font-mono); letter-spacing: .08em; color: var(--ink-muted);">
    NI SIDE-CHAIN
    <span style="color: var(--ink-dim);">CYCLE 1/4 · RELEASE</span>
  </div>

  <!-- Shaper plot (32, 56, 696 x 260): input in an off-palette grey, handles round. -->
  <div style="position: absolute; left: 32px; top: 56px; width: 696px; height: 260px; box-sizing: border-box; background: var(--bg-000); border: 1px solid var(--line-100);">
    <svg viewBox="0 0 694 258" width="694" height="258" style="display: block;">
      <path d="{{scope}}" fill="var(--kit-scope-dry)" fill-opacity="0.55"></path>
      <line x1="6" y1="129" x2="688" y2="129" stroke="var(--line-100)"></line>
      <path d="M6 20 L20 129 L75 129 Q111 20 314 20 L688 20" fill="none" stroke="var(--ink)" stroke-width="1.5"></path>
      <path d="M6 238 L20 129 L75 129 Q111 238 314 238 L688 238" fill="none" stroke="var(--ink)" stroke-width="1.5"></path>
      <line x1="430" y1="20" x2="430" y2="238" stroke="var(--uv)"></line>
      <circle cx="6" cy="20" r="4" fill="var(--ink)"></circle>
      <circle cx="20" cy="129" r="4" fill="var(--ink)"></circle>
      <circle cx="75" cy="129" r="4" fill="var(--ink)"></circle>
      <circle cx="314" cy="20" r="4" fill="var(--ink)"></circle>
      <text x="6" y="13" fill="var(--ink-muted)" style="font: 400 10px var(--font-mono); letter-spacing: .02em; white-space: pre;">ONE CYCLE   INPUT IN GREY BEHIND   DRAG A HANDLE, SHIFT FOR FINE</text>
    </svg>
  </div>

  <!-- Knob row (32, 340, 696 x 104): class "panel", but no fill and no border. Cells stretch to 120. -->
  <div style="position: absolute; left: 32px; top: 340px; width: 696px; height: 104px; display: flex; gap: 24px; align-items: flex-start;">
    <sc-for list="{{knobs}}" as="k" hint-placeholder-count="5">
      <div class="ph-knob" style="width: 120px; flex: none;">
        <div class="ph-label">{{k.label}}</div>
        <svg viewBox="0 0 48 48" width="48" height="48"><circle class="disc" cx="24" cy="24" r="16"></circle><path class="rail" d="{{k.g.rail}}"></path><path class="arc" d="{{k.g.arc}}"></path><line class="ptr" x1="{{k.g.x1}}" y1="{{k.g.y1}}" x2="{{k.g.x2}}" y2="{{k.g.y2}}"></line></svg>
        <div class="ph-readout" style="width: 100%;">{{k.text}}</div>
      </div>
    </sc-for>
  </div>

  <!-- Select row 1, the trigger (y 464). Abbreviated inline labels. -->
  <div style="position: absolute; left: 32px; top: 464px; height: 28px; display: flex; align-items: center; gap: 16px; font: 400 13px var(--font-mono);">
    <span style="display: flex; align-items: center; gap: 8px;"><span class="ph-label" style="width: 30px; text-align: left;">Src</span><span style="position: relative; display: block; width: 104px; height: 28px; box-sizing: border-box; background: var(--bg-200); border: 1px solid var(--line-200); padding: 0 28px 0 12px; line-height: 26px;">Cycle<svg width="8" height="5" viewBox="0 0 8 5" style="position: absolute; right: 10px; top: 11px;"><path d="M0.5 0.5 L4 4 L7.5 0.5" fill="none" stroke="var(--ink-muted)"></path></svg></span></span>
    <span style="display: flex; align-items: center; gap: 8px;"><span class="ph-label" style="width: 38px; text-align: left;">Rate</span><span style="position: relative; display: block; width: 84px; height: 28px; box-sizing: border-box; background: var(--bg-200); border: 1px solid var(--line-200); padding: 0 28px 0 12px; line-height: 26px;">1/4<svg width="8" height="5" viewBox="0 0 8 5" style="position: absolute; right: 10px; top: 11px;"><path d="M0.5 0.5 L4 4 L7.5 0.5" fill="none" stroke="var(--ink-muted)"></path></svg></span></span>
  </div>

  <!-- Select row 2, the shape (y 500). Time has two options and is still a Select. -->
  <div style="position: absolute; left: 32px; top: 500px; height: 28px; display: flex; align-items: center; gap: 16px; font: 400 13px var(--font-mono);">
    <span style="display: flex; align-items: center; gap: 8px;"><span class="ph-label" style="width: 42px; text-align: left;">Curve</span><span style="position: relative; display: block; width: 118px; height: 28px; box-sizing: border-box; background: var(--bg-200); border: 1px solid var(--line-200); padding: 0 28px 0 12px; line-height: 26px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis;">Exponential<svg width="8" height="5" viewBox="0 0 8 5" style="position: absolute; right: 10px; top: 11px;"><path d="M0.5 0.5 L4 4 L7.5 0.5" fill="none" stroke="var(--ink-muted)"></path></svg></span></span>
    <span style="display: flex; align-items: center; gap: 8px;"><span class="ph-label" style="width: 38px; text-align: left;">Time</span><span style="position: relative; display: block; width: 92px; height: 28px; box-sizing: border-box; background: var(--bg-200); border: 1px solid var(--line-200); padding: 0 28px 0 12px; line-height: 26px;">ms<svg width="8" height="5" viewBox="0 0 8 5" style="position: absolute; right: 10px; top: 11px;"><path d="M0.5 0.5 L4 4 L7.5 0.5" fill="none" stroke="var(--ink-muted)"></path></svg></span></span>
  </div>

  <!-- Hint (measured 576, 20 tall, 8px off the bottom): tips truncate at 496px, Motion 4px from the signature. -->
  <div style="position: absolute; left: 32px; top: 576px; width: 696px; height: 20px; box-sizing: border-box; border-top: 1px solid var(--line-100); padding-top: 4px; display: flex; align-items: baseline; font: 400 10px/14px var(--font-mono); letter-spacing: .02em; color: var(--ink-muted);">
    <span style="width: 496px; flex: none; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;"><b style="font-weight: 400; color: var(--ink);">drag</b> a handle, shift for fine<span style="margin: 0 12px; color: var(--ink-dim);">–</span><b style="font-weight: 400; color: var(--ink);">cycle</b> follows the transport<span style="margin: 0 12px; color: var(--ink-dim);">–</span><b style="font-weight: 400; color: var(--ink);">times</b> 225 ms total</span>
    <span style="margin-left: 16px; align-self: center; display: inline-flex; align-items: center; gap: 8px;"><span style="position: relative; width: 28px; height: 14px; box-sizing: border-box; background: var(--bg-200); border: 1px solid var(--uv);"><span style="position: absolute; left: 16px; top: 2px; width: 8px; height: 8px; background: var(--uv);"></span></span><span class="ph-label">Motion</span></span>
    <span class="ph-sig" style="margin-left: 4px;"><span class="mark"></span>Neon Ingvy</span>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":760,"height":604}}'>
class Component extends DCLogic {
  renderVals() {
    const f = (n) => n.toFixed(2);
    // The kit's knob: the arc always starts at the minimum, bipolar or not.
    const knob = (v) => {
      const c = 24, r = 20;
      const pt = (t, rr) => { const a = (-135 + 270 * t) * Math.PI / 180; return [c + rr * Math.sin(a), c - rr * Math.cos(a)]; };
      const s = pt(0, r), e = pt(1, r), p = pt(v, r), i = pt(v, 6), o = pt(v, 15);
      return {
        rail: 'M' + f(s[0]) + ' ' + f(s[1]) + ' A' + r + ' ' + r + ' 0 1 1 ' + f(e[0]) + ' ' + f(e[1]),
        arc: v <= 0.001 ? '' : 'M' + f(s[0]) + ' ' + f(s[1]) + ' A' + r + ' ' + r + ' 0 ' + (270 * v > 180 ? 1 : 0) + ' 1 ' + f(p[0]) + ' ' + f(p[1]),
        x1: f(i[0]), y1: f(i[1]), x2: f(o[0]), y2: f(o[1]),
      };
    };
    const K = (label, v, text) => ({ label, text, g: knob(v) });

    // The input behind the curve: a kick at the top of the cycle, then the track.
    let top = 'M6 129', bottom = '';
    const pts = [];
    for (let x = 6; x <= 688; x += 4) {
      const a = Math.min(0.95, 0.22 + 0.18 * Math.abs(Math.sin(x * 0.21) * Math.cos(x * 0.07)) + 0.72 * Math.exp(-(x - 6) / 22));
      pts.push([x, a]);
    }
    pts.forEach(([x, a]) => { top += ' L' + x + ' ' + f(129 - a * 104); });
    for (let k = pts.length - 1; k >= 0; k--) { const [x, a] = pts[k]; bottom += ' L' + x + ' ' + f(129 + a * 104); }

    return {
      scope: top + bottom + ' Z',
      knobs: [
        K('Depth', 1, '100.00%'),
        K('Delay', 0.5, '0.00%'),
        K('Attack', 0.01, '10.0 ms'),
        K('Hold', 0.04, '40.0 ms'),
        K('Release', 0.175, '175.0 ms'),
      ],
    };
  }
}
</script>
</body>
</html>
