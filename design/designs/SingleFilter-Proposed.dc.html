<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>NI Single Filter</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="uv-tokens.css">
<link rel="stylesheet" href="ds/ultraviolet/components/bundle.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0;background:#060410}
.sf-plain{background:none;border:0;padding:0;margin:0;font:inherit;color:inherit;cursor:pointer;text-align:inherit}
.ph-select .list button{display:block;width:100%;padding:0 12px;border:0;background:none;text-align:left;font:400 13px/28px var(--font-mono);color:var(--ink);cursor:pointer}
.ph-select .list button:hover{background:var(--bg-300)}
.ph-select .list button.selected{color:var(--uv)}
.sf-cap:hover{color:var(--ink)}
</style>
</helmet>
<div class="ph" style="position: relative; width: 664px; height: 572px; overflow: hidden; font-family: var(--font-mono); color: var(--ink); background: var(--bg-000);">

  <!-- RESPONSE (32, 32, 600 x 232): the filter's one picture, Filter Designer's ResponseWell with one filter in it. 10 Hz to 22 kHz in equal steps of pitch across, ±6, ±12, ±18 or ±30 dB up (clicked in the caption). Back to front: the analyzer (pre faded as plot-dry at a quarter, post highlighted as plot-ghost under a 1.5px ink-dim edge, its own -6 to -84 dBFS scale), the rulers, 0 dB as the grey line, the filter in uv with its glow -- Output included, what the lane hears. All Pass, whose magnitude is flat, draws its PHASE as the uv curve instead, on a ±180° scale named at the right (the 0 dB line stays as the reference). The HANDLE is the kit's PlotHandle in uv: Freq across; Gain up and down for a Bell, a shelf and a Tilt; Q up and down for a cut, a band-pass, a notch and an all-pass (alt for Q on a gain type). A Bell, Band Pass or Notch shows its -3 dB edges as two ink-dim ticks, dragged to set Q. The caption names the lane drawn: the filter's Channel (a Stereo filter's is the mid, what a centred source hears). The plugin draws the engine's own curve (sf_shell_read); this board computes it from the same designs. -->
  <div style="position: absolute; left: 32px; top: 32px; width: 600px; height: 232px; box-sizing: border-box; background: var(--bg-000); border: 1px solid var(--line-100);">
    <span style="position: absolute; left: 6px; top: 3px; font: 400 10px/14px var(--font-mono); letter-spacing: .02em; text-transform: uppercase; color: var(--ink-muted);">{{caption}}</span>
    <span style="position: absolute; right: 6px; top: 3px; display: flex; gap: 16px; font: 400 10px/14px var(--font-mono); letter-spacing: .02em; color: var(--ink-muted);">
      <button class="sf-plain sf-cap" style="text-transform: uppercase;" onClick="{{cycleAnalyzer}}" aria-label="Analyzer: pre, post, both or off">{{analyzerText}}</button>
      <button class="sf-plain sf-cap" onClick="{{cycleRange}}" aria-label="The dB range of the picture">{{rangeText}}</button>
    </span>
    <svg viewBox="0 0 588 206" width="588" height="206" style="position: absolute; left: 6px; top: 20px; overflow: visible; touch-action: none; outline: none;" tabIndex="0" role="img" aria-label="Frequency response: drag the handle to move the filter" onPointerDown="{{wellDown}}" onPointerMove="{{wellMove}}" onPointerUp="{{wellUp}}" onDoubleClick="{{wellDouble}}">
      <sc-if value="{{showPre}}" hint-placeholder-val="{{false}}">
        <path d="{{preArea}}" fill="#6b6b78" fill-opacity="0.25" stroke="none"></path>
      </sc-if>
      <sc-if value="{{showPost}}" hint-placeholder-val="{{true}}">
        <path d="{{postArea}}" fill="#3a2a66" stroke="none"></path>
        <path d="{{postEdge}}" fill="none" stroke="var(--ink-dim)" stroke-width="1.5" stroke-linejoin="round"></path>
      </sc-if>
      <path d="{{ticks}}" fill="none" stroke="var(--line-200)" stroke-width="1"></path>
      <sc-for list="{{labels}}" as="l" hint-placeholder-count="12">
        <text x="{{l.x}}" y="{{l.y}}" text-anchor="{{l.anchor}}" fill="var(--ink-muted)" style="font: 400 9px var(--font-mono);">{{l.text}}</text>
      </sc-for>
      <path d="{{zeroLine}}" fill="none" stroke="#6b6b78" stroke-width="1.5"></path>
      <path d="{{curve}}" fill="none" stroke="var(--uv)" stroke-width="2" stroke-linejoin="round" style="filter: drop-shadow(0 0 3px var(--uv-deep));"></path>
      <path d="{{widthTicks}}" fill="none" stroke="var(--ink-dim)" stroke-width="1"></path>
      <circle cx="{{handle.x}}" cy="{{handle.y}}" r="4.5" fill="{{handle.fill}}" stroke="var(--bg-000)" stroke-width="1.5" style="{{handle.style}}"></circle>
    </svg>
  </div>

  <!-- FILTER (32, 288, 600 x 216): the product's controls, and only those its type has. The title is the type, Bypass at its right (the host's bypass, crossfaded in 10 ms), and the type's switch before it: Matched for a High Pass or Low Pass (the analog magnitude to Nyquist), Adaptive for a Bell (Q narrows as it boosts or cuts). Then the selects -- Family, Slope (an All Pass's Order), Channel -- then the knobs left to right in Filter Designer's order (Freq, Gain, Q, Ripple, Stopband), Output always in the last column, so the level sits in the same place in all nine windows. What the type has but does not use right now is drawn disabled, never hidden: Q at 6 dB/oct, Ripple and Stopband for a family that takes neither. -->
  <section class="ph-panel" style="position: absolute; left: 32px; top: 288px; width: 600px; height: 216px; box-sizing: border-box; margin: 0;" aria-label="{{title}}">
    <h2 class="ph-title" style="margin: 0 0 12px;">{{title}}</h2>
    <div style="position: absolute; right: 16px; top: 14px; display: flex; gap: 24px;">
      <sc-if value="{{hasSwitch}}" hint-placeholder-val="{{true}}">
        <button class="sf-plain {{switch.cls}}" onClick="{{switch.click}}"><span class="sw"></span><span class="ph-label">{{switch.label}}</span></button>
      </sc-if>
      <button class="sf-plain {{bypass.cls}}" onClick="{{bypass.click}}"><span class="sw"></span><span class="ph-label">Bypass</span></button>
    </div>
    <div style="display: flex; gap: 16px; height: 48px;">
      <sc-for list="{{selects}}" as="s" hint-placeholder-count="3">
        <div style="display: flex; flex-direction: column; gap: 8px; width: {{s.w}}px;">
          <span class="ph-label" style="text-align: left;">{{s.label}}</span>
          <div class="ph-select {{s.openCls}}" style="min-width: 0; width: 100%;">
            <button class="sf-plain field" style="display: block; width: 100%; box-sizing: border-box; text-align: left; white-space: nowrap; overflow: hidden;" onClick="{{s.toggle}}" aria-haspopup="listbox" aria-label="{{s.label}}">{{s.value}}<svg class="ph-icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="square"><path d="M4.5 6.5l3.5 3.5 3.5-3.5"></path></svg></button>
            <sc-if value="{{s.open}}" hint-placeholder-val="{{false}}">
              <div class="list" role="listbox" style="top: auto; bottom: 27px;">
                <sc-for list="{{s.options}}" as="o" hint-placeholder-count="6">
                  <button class="{{o.cls}}" onClick="{{o.pick}}" role="option">{{o.text}}</button>
                </sc-for>
              </div>
            </sc-if>
          </div>
        </div>
      </sc-for>
    </div>
    <div style="margin-top: 16px; display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); column-gap: 8px;">
      <sc-for list="{{knobs}}" as="k" hint-placeholder-count="6">
        <div class="ph-knob {{k.cls}}" style="width: 100%; grid-column: {{k.col}};">
          <span class="ph-label">{{k.label}}</span>
          <svg viewBox="0 0 48 48" style="cursor: ns-resize; touch-action: none;" onPointerDown="{{k.down}}" onPointerMove="{{knobMove}}" onPointerUp="{{knobUp}}" onDoubleClick="{{k.reset}}" role="slider" aria-label="{{k.label}}" aria-valuetext="{{k.aria}}">
            <circle class="disc" cx="24" cy="24" r="16"></circle>
            <path class="rail" d="{{k.rail}}"></path>
            <path class="arc" d="{{k.arc}}"></path>
            <path class="ptr" d="{{k.ptr}}"></path>
          </svg>
          <span class="ph-readout {{k.roCls}}" style="min-width: 0; width: 84px; box-sizing: border-box;">{{k.value}}<span class="unit">{{k.unit}}</span></span>
        </div>
      </sc-for>
    </div>
  </section>

  <!-- THE HINT (0, 528, 664 x 44): the well's conventions, the signature. -->
  <div class="ph-hint" style="position: absolute; left: 0; top: 528px; width: 664px; height: 44px; box-sizing: border-box; padding: 0 32px 16px; align-items: center;">
    <span class="tips"><b>drag</b> the dot: {{hintAxes}}<span class="sep">—</span><b>shift</b> for fine<span class="sep">—</span><b>double-click</b> resets</span>
    <span class="ph-sig"><span class="mark"></span>Neon Ingvy</span>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"product":{"editor":"enum","options":["High Pass","Low Pass","Band Pass","Notch","Bell","Low Shelf","High Shelf","Tilt","All Pass"],"default":"High Pass"},"$preview":{"width":664,"height":572}}'>
class Component extends DCLogic {
  /* THE FILTER MATH: Filter Designer's board's, unchanged -- analog
   * prototypes on the bilinear transform's warped axis at 48 kHz, the EQ
   * shapes as their analog magnitudes. */
  fd() {
    if (this._fd) return this._fd;
    const FS = 48000;
    const C = {
      add: (a, b) => [a[0] + b[0], a[1] + b[1]],
      sub: (a, b) => [a[0] - b[0], a[1] - b[1]],
      mul: (a, b) => [a[0] * b[0] - a[1] * b[1], a[0] * b[1] + a[1] * b[0]],
      div: (a, b) => { const d = b[0] * b[0] + b[1] * b[1]; return [(a[0] * b[0] + a[1] * b[1]) / d, (a[1] * b[0] - a[0] * b[1]) / d]; },
      scale: (a, k) => [a[0] * k, a[1] * k],
      abs: (a) => Math.hypot(a[0], a[1]),
      sqrt: (a) => { const r = Math.hypot(a[0], a[1]); const re = Math.sqrt(Math.max(0, (r + a[0]) / 2)); const im = Math.sqrt(Math.max(0, (r - a[0]) / 2)); return [re, a[1] < 0 ? -im : im]; },
      cos: (a) => [Math.cos(a[0]) * Math.cosh(a[1]), -Math.sin(a[0]) * Math.sinh(a[1])],
      sin: (a) => [Math.sin(a[0]) * Math.cosh(a[1]), Math.cos(a[0]) * Math.sinh(a[1])],
      log: (a) => [Math.log(Math.hypot(a[0], a[1])), Math.atan2(a[1], a[0])],
    };
    C.asin = (z) => { const iz = [-z[1], z[0]]; const w = C.log(C.add(iz, C.sqrt(C.sub([1, 0], C.mul(z, z))))); return [w[1], -w[0]]; };

    /* Elliptic functions by Landen's transformation (Orfanidis, Lecture Notes on
     * Elliptic Filter Design, 2006). */
    const landen = (k) => { const v = []; for (let i = 0; i < 7; i++) { k = Math.pow(k / (1 + Math.sqrt(1 - k * k)), 2); v.push(k); } return v; };
    const cde = (u, k) => { const v = landen(k); let w = C.cos(C.scale(u, Math.PI / 2)); for (let i = v.length - 1; i >= 0; i--) w = C.div(C.scale(w, 1 + v[i]), C.add([1, 0], C.scale(C.mul(w, w), v[i]))); return w; };
    const sne = (u, k) => { const v = landen(k); let w = C.sin(C.scale(u, Math.PI / 2)); for (let i = v.length - 1; i >= 0; i--) w = C.div(C.scale(w, 1 + v[i]), C.add([1, 0], C.scale(C.mul(w, w), v[i]))); return w; };
    const asne = (w, k) => { const v = landen(k); for (let i = 0; i < v.length; i++) { const v1 = i === 0 ? k : v[i - 1]; w = C.scale(C.div(w, C.add([1, 0], C.sqrt(C.sub([1, 0], C.scale(C.mul(w, w), v1 * v1))))), 2 / (1 + v[i])); } return C.scale(C.asin(w), 2 / Math.PI); };
    const ellipdeg = (n, k1) => { const k1p = Math.sqrt(1 - k1 * k1); let prod = 1; for (let i = 1; i <= Math.floor(n / 2); i++) prod *= Math.pow(sne([(2 * i - 1) / n, 0], k1p)[0], 4); const kp = Math.pow(k1p, n) * prod; return Math.sqrt(1 - kp * kp); };

    /* A prototype: sections of one or two poles (and their zeros), each at unity
     * gain at DC, times `dc`. */
    const pair = (p, z) => ({ ps: [p, [p[0], -p[1]]], zs: z ? [z, [z[0], -z[1]]] : [] });
    const single = (p) => ({ ps: [[p, 0]], zs: [] });
    const butterPoles = (n) => {
      const out = [];
      for (let k = 0; k < Math.floor(n / 2); k++) { const t = Math.PI * (2 * k + n + 1) / (2 * n); out.push(pair([Math.cos(t), Math.sin(t)])); }
      if (n % 2) out.push(single(-1));
      return out;
    };
    const besselPoles = (n) => {
      /* The reverse Bessel polynomial's roots, by Durand-Kerner. */
      const fact = (m) => { let f = 1; for (let i = 2; i <= m; i++) f *= i; return f; };
      const a = []; for (let k = 0; k <= n; k++) a.push(fact(2 * n - k) / (Math.pow(2, n - k) * fact(k) * fact(n - k)));
      const poly = (s) => { let y = [a[n], 0]; for (let k = n - 1; k >= 0; k--) y = C.add(C.mul(y, s), [a[k], 0]); return y; };
      let r = []; for (let i = 0; i < n; i++) r.push([Math.cos(2 * Math.PI * i / n + 0.4) * 1.5, Math.sin(2 * Math.PI * i / n + 0.4) * 1.5]);
      for (let it = 0; it < 200; it++) {
        r = r.map((ri, i) => { let d = [a[n], 0]; r.forEach((rj, j) => { if (j !== i) d = C.mul(d, C.sub(ri, rj)); }); return C.sub(ri, C.div(poly(ri), d)); });
      }
      const out = [];
      r.filter((p) => p[1] > 1e-9).forEach((p) => out.push(pair(p)));
      r.filter((p) => Math.abs(p[1]) <= 1e-9).forEach((p) => out.push(single(p[0])));
      return out;
    };
    const cheby1 = (n, ripple) => {
      const e = Math.sqrt(Math.pow(10, ripple / 10) - 1), a = Math.asinh(1 / e) / n, out = [];
      for (let k = 0; k < Math.floor(n / 2); k++) { const t = Math.PI * (2 * k + 1) / (2 * n); out.push(pair([-Math.sinh(a) * Math.sin(t), Math.cosh(a) * Math.cos(t)])); }
      if (n % 2) out.push(single(-Math.sinh(a)));
      return { sections: out, dc: n % 2 ? 1 : 1 / Math.sqrt(1 + e * e) };
    };
    const cheby2 = (n, stop) => {
      const e = 1 / Math.sqrt(Math.pow(10, stop / 10) - 1), a = Math.asinh(1 / e) / n, out = [];
      for (let k = 0; k < Math.floor(n / 2); k++) {
        const t = Math.PI * (2 * k + 1) / (2 * n);
        const q = [-Math.sinh(a) * Math.sin(t), Math.cosh(a) * Math.cos(t)];
        out.push(pair(C.div([1, 0], q), [0, 1 / Math.cos(t)]));
      }
      if (n % 2) out.push(single(-1 / Math.sinh(a)));
      return { sections: out, dc: 1 };
    };
    const ellip = (n, ripple, stop) => {
      const ep = Math.sqrt(Math.pow(10, ripple / 10) - 1), es = Math.sqrt(Math.pow(10, stop / 10) - 1);
      const k1 = ep / es, k = ellipdeg(n, k1), out = [];
      const v0 = C.scale(asne([0, 1 / ep], k1), 1 / n)[1];
      for (let i = 1; i <= Math.floor(n / 2); i++) {
        const u = (2 * i - 1) / n, zeta = cde([u, 0], k)[0];
        const p = C.mul([0, 1], cde([u, -v0], k));
        out.push(pair(p, [0, 1 / (k * zeta)]));
      }
      if (n % 2) out.push(single(C.mul([0, 1], sne([0, v0], k))[0]));
      return { sections: out, dc: n % 2 ? 1 : Math.pow(10, -ripple / 20) };
    };

    const sectionAt = (sec, x) => {
      const s = [0, x];
      let num = 1, den = 1;
      sec.ps.forEach((p) => { den *= C.abs(C.sub(s, p)); num *= C.abs(p); });
      sec.zs.forEach((z) => { num *= C.abs(C.sub(s, z)); den *= C.abs(z); });
      return num / den;
    };
    const protoAt = (proto, x) => proto.sections.reduce((m, sec) => m * sectionAt(sec, x), proto.dc);

    /* -3 dB at 1 for every family; Linkwitz-Riley -6 dB, so a pair sums flat. */
    const normalise = (proto) => {
      let lo = 1e-3, prev = lo;
      for (let i = 1; i <= 600; i++) {
        const x = 1e-3 * Math.pow(1e6, i / 600);
        if (protoAt(proto, x) < Math.SQRT1_2) { lo = prev; let hi = x; for (let j = 0; j < 60; j++) { const m = Math.sqrt(lo * hi); if (protoAt(proto, m) < Math.SQRT1_2) hi = m; else lo = m; } return Math.sqrt(lo * hi); }
        prev = x;
      }
      return 1;
    };
    const protoCache = new Map();
    const prototype = (family, order, ripple, stop) => {
      const key = [family, order, ripple.toFixed(3), stop.toFixed(2)].join('|');
      if (protoCache.has(key)) return protoCache.get(key);
      let proto;
      if (family === 'Bessel') proto = { sections: besselPoles(order), dc: 1 };
      else if (family === 'Chebyshev I') proto = cheby1(order, ripple);
      else if (family === 'Chebyshev II') proto = cheby2(order, stop);
      else if (family === 'Elliptic') proto = order === 1 ? { sections: butterPoles(1), dc: 1 } : ellip(order, ripple, stop);
      else if (family === 'Linkwitz-Riley') { const half = butterPoles(Math.max(1, Math.ceil(order / 2))); proto = { sections: half.concat(half.map((s) => ({ ps: s.ps.slice(), zs: s.zs.slice() }))), dc: 1 }; }
      else proto = { sections: butterPoles(order), dc: 1 };
      proto.w3 = family === 'Butterworth' || family === 'Linkwitz-Riley' ? 1 : normalise(proto);
      if (protoCache.size > 200) protoCache.clear();
      protoCache.set(key, proto);
      return proto;
    };
    /* Q on a high-pass or low-pass: the section with the highest Q, its Q times Q / 0.7071, at the same |p|. */
    const resonate = (proto, q) => {
      let best = -1, bestQ = 0;
      proto.sections.forEach((sec, i) => {
        if (sec.ps.length !== 2 || Math.abs(sec.ps[0][1]) < 1e-12) return;
        const p = sec.ps[0], qq = C.abs(p) / (-2 * p[0]);
        if (qq > bestQ) { bestQ = qq; best = i; }
      });
      if (best < 0 || Math.abs(q - Math.SQRT1_2) < 1e-6) return proto;
      const sec = proto.sections[best], w0 = C.abs(sec.ps[0]);
      const qn = Math.min(40, bestQ * q / Math.SQRT1_2), sigma = -w0 / (2 * qn);
      const d = w0 * w0 - sigma * sigma;
      const ps = d >= 0 ? [[sigma, Math.sqrt(d)], [sigma, -Math.sqrt(d)]] : [[sigma + Math.sqrt(-d), 0], [sigma - Math.sqrt(-d), 0]];
      const sections = proto.sections.slice();
      sections[best] = { ps, zs: sec.zs };
      return Object.assign({}, proto, { sections });
    };

    const warp = (f) => Math.tan(Math.PI * Math.min(f, 0.499 * FS) / FS);
    const db = (m) => 20 * Math.log10(Math.max(m, 1e-9));

    /* One node's response in dB at `f`. */
    const GAIN_TYPES = ['Bell', 'Low Shelf', 'High Shelf', 'Tilt'];
    const nodeDb = (n, f, opts) => {
      const scale = (opts && opts.scale != null ? opts.scale : 100) / 100;
      const adaptive = opts && opts.adaptive;
      const G = n.gain * scale;
      const w = f / n.freq;
      if (n.type === 'Bell') {
        const A = Math.pow(10, G / 40), Q = adaptive ? n.q * Math.pow(10, Math.abs(G) / 40) : n.q;
        const re = 1 - w * w;
        return db(Math.hypot(re, w * A / Q) / Math.hypot(re, w / (A * Q)));
      }
      if (n.type === 'Low Shelf' || n.type === 'High Shelf') {
        /* Order 1 a one-pole shelf; 2..4 a cascade of shelving sections on
         * Butterworth angles (Holters-Zolzer), the top one's Q from the knob. */
        const order = Math.max(1, Math.min(4, n.order)), low = n.type === 'Low Shelf';
        let total = 0;
        const halves = Math.floor(order / 2);
        for (let k = 0; k < halves; k++) {
          let Q = 1 / (2 * Math.sin(Math.PI * (2 * k + 1) / (2 * order)));
          if (k === halves - 1) Q *= n.q / Math.SQRT1_2;
          const g = G * 2 / order, A = Math.pow(10, g / 40), r = Math.sqrt(A) / Q, re1 = low ? A - w * w : 1 - A * w * w, re2 = low ? 1 - A * w * w : A - w * w;
          total += db(A * Math.hypot(re1, r * w) / Math.hypot(re2, r * w));
        }
        if (order % 2) {
          const g = Math.pow(10, (G / order) / 20), a = low ? 1 / Math.sqrt(g) : Math.sqrt(g);
          total += low ? db(Math.hypot(g * a, w) / Math.hypot(a, w)) : db(Math.hypot(a, g * w) / Math.hypot(a, w));
        }
        return total;
      }
      if (n.type === 'Tilt') {
        const g = Math.sqrt(Math.pow(10, G / 20));
        return db(Math.hypot(1, g * w) / Math.hypot(g, w));
      }
      if (n.type === 'All-Pass' || n.type === 'None') return 0;
      const family = (n.type === 'Band-Pass' || n.type === 'Notch') && n.family === 'Linkwitz-Riley' ? 'Butterworth' : n.family;
      let proto = prototype(family, n.order, n.ripple, n.stopband);
      const W = warp(f);
      if (n.type === 'High-Pass' || n.type === 'Low-Pass') {
        if (n.order >= 2) proto = resonate(proto, n.q);
        /* Matched: the analog curve, unwarped (the plugin's matched design
         * holds it within about 2 dB to 20 kHz). */
        const matched = opts && opts.matched;
        const x = matched ? (n.type === 'Low-Pass' ? f / n.freq : n.freq / f) : n.type === 'Low-Pass' ? W / warp(n.freq) : warp(n.freq) / W;
        return db(protoAt(proto, x * proto.w3));
      }
      /* Band Pass and Notch: Freq the centre, Q the -3 dB edges, both prewarped. */
      const h = 1 / (2 * n.q), r = Math.sqrt(1 + h * h);
      const w1 = warp(n.freq * (r - h)), w2 = warp(n.freq * (r + h)), w0 = Math.sqrt(w1 * w2), B = w2 - w1;
      const x = n.type === 'Band-Pass' ? (W * W - w0 * w0) / (B * W) : (B * W) / (w0 * w0 - W * W);
      return db(protoAt(proto, Math.min(Math.abs(x), 1e9) * proto.w3));
    };

    this._fd = { nodeDb, FS, C, warp };
    return this._fd;
  }

  /* THE NINE PRODUCTS: each one Filter Designer type, and the controls that
   * type has (sf-core's layouts). */
  products() {
    const cut = { selects: ['family', 'order', 'channel'], knobs: ['freq', 'q', 'ripple', 'stopband'], families: 6, orders: 8, sw: 'Matched' };
    const band = { selects: ['family', 'order', 'channel'], knobs: ['freq', 'q', 'ripple', 'stopband'], families: 5, orders: 8 };
    const shelf = { selects: ['order', 'channel'], knobs: ['freq', 'gain', 'q'], orders: 4 };
    return {
      'High Pass': Object.assign({ type: 'High-Pass', freq: 100 }, cut),
      'Low Pass': Object.assign({ type: 'Low-Pass', freq: 10000 }, cut),
      'Band Pass': Object.assign({ type: 'Band-Pass', freq: 1000 }, band),
      'Notch': Object.assign({ type: 'Notch', freq: 1000 }, band),
      'Bell': { type: 'Bell', freq: 1000, selects: ['channel'], knobs: ['freq', 'gain', 'q'], sw: 'Adaptive' },
      'Low Shelf': Object.assign({ type: 'Low Shelf', freq: 200 }, shelf),
      'High Shelf': Object.assign({ type: 'High Shelf', freq: 5000 }, shelf),
      'Tilt': { type: 'Tilt', freq: 1000, selects: ['channel'], knobs: ['freq', 'gain'] },
      'All Pass': { type: 'All-Pass', freq: 1000, selects: ['order', 'channel'], knobs: ['freq', 'q'], orders: 8, ordinal: true },
    };
  }

  /* Each product's filter as the board opens it: something to see. */
  st() {
    const name = this.props.product ?? 'High Pass';
    if (this.state && this.state.name === name) return this.state;
    const p = this.products()[name];
    const demo = {
      'High Pass': { freq: 120, order: 4 }, 'Low Pass': { freq: 8000, order: 4 }, 'Band Pass': { q: 2 }, 'Notch': { q: 4 },
      'Bell': { gain: 6, q: 1 }, 'Low Shelf': { gain: 4 }, 'High Shelf': { gain: -3 }, 'Tilt': { gain: 4 }, 'All Pass': { order: 2 },
    }[name];
    return Object.assign({
      name, type: p.type, on: true, family: 'Butterworth', order: 2, freq: p.freq, gain: 0, q: Math.SQRT1_2, ripple: 1, stopband: 60,
      channel: 'Stereo', output: 0, matched: false, adaptive: false, bypass: false, open: null, range: 18, analyzer: 'Both',
    }, demo);
  }

  set(patch) {
    this.setState(Object.assign({}, this.st(), patch));
  }

  /* An all-pass's phase in degrees at `f`, wrapped to ±180: second-order
   * sections on Butterworth angles, the steepest one's Q from the knob, a
   * first-order one for an odd order. */
  allPassPhase(n, f) {
    const { warp } = this.fd();
    const w = warp(f) / warp(n.freq);
    let phi = 0;
    const halves = Math.floor(n.order / 2);
    for (let k = 0; k < halves; k++) {
      let Q = 1 / (2 * Math.sin(Math.PI * (2 * k + 1) / (2 * n.order)));
      if (k === halves - 1) Q *= n.q / Math.SQRT1_2;
      phi -= 2 * Math.atan2(w / Q, 1 - w * w);
    }
    if (n.order % 2) phi -= 2 * Math.atan(w);
    const deg = phi * 180 / Math.PI;
    return ((deg + 180) % 360 + 360) % 360 - 180;
  }

  renderVals() {
    const { nodeDb } = this.fd();
    const s = this.st();
    const p = this.products()[s.name];
    const self = this;
    const FAMILIES = ['Butterworth', 'Bessel', 'Chebyshev I', 'Chebyshev II', 'Elliptic', 'Linkwitz-Riley'].slice(0, p.families || 6);
    const CHANNELS = ['Stereo', 'Left', 'Right', 'Mid', 'Side'];
    const isGain = p.knobs.indexOf('gain') >= 0;
    const isAllPass = s.type === 'All-Pass';

    /* THE WELL, in the svg's units: the plot x 30..558, y 0..192. */
    const AX = 30, AW = 528, AH = 192, LO = 10, HI = 22000, SPAN = Math.log(HI / LO);
    const R = s.range;
    const fx = (f) => AX + AW * Math.log(f / LO) / SPAN;
    const fOfX = (x) => Math.max(LO, Math.min(HI, LO * Math.exp(SPAN * (x - AX) / AW)));
    const gy = (d) => AH * (R - Math.max(-R - 1, Math.min(R + 1, d))) / (2 * R);
    const py = (deg) => AH * (180 - deg) / 360;
    const path = (pts) => pts.map((q, i) => (i ? 'L' : 'M') + q[0].toFixed(1) + ' ' + q[1].toFixed(1)).join('');
    const freqs = [];
    for (let i = 0; i <= 330; i++) freqs.push(LO * Math.exp(SPAN * i / 330));
    const n = { type: s.type, family: s.family, order: s.order, freq: s.freq, gain: s.gain, q: s.q, ripple: s.ripple, stopband: s.stopband };
    const opts = { scale: 100, adaptive: s.adaptive, matched: s.matched };
    const own = freqs.map((f) => nodeDb(n, f, opts));
    const total = own.map((d) => d + s.output);

    /* The curve: what the lane hears; an All Pass's phase, broken where it wraps. */
    let curve = '';
    if (isAllPass) {
      let prev = null;
      freqs.forEach((f) => {
        const deg = this.allPassPhase(n, f), x = fx(f).toFixed(1), y = py(deg).toFixed(1);
        curve += (prev === null || Math.abs(deg - prev) > 180 ? 'M' : 'L') + x + ' ' + y;
        prev = deg;
      });
    } else {
      curve = path(total.map((d, i) => [fx(freqs[i]), gy(d)]));
    }

    /* The analyzer: a stand-in mix, the same frame before and after. */
    const music = (f) => {
      const o = Math.log2(f);
      return -34 + 6 * Math.exp(-Math.pow(Math.log2(f / 58), 2) / 0.35) + 3 * Math.exp(-Math.pow(Math.log2(f / 220), 2) / 0.8)
        - 3.2 * Math.max(0, Math.log2(f / 300)) - 14 * Math.max(0, Math.log2(36 / f)) - 9 * Math.max(0, Math.log2(f / 15000))
        + 2.2 * Math.sin(37 * o) + 1.3 * Math.sin(91 * o + 1.7) + 0.8 * Math.sin(211 * o + 0.4);
    };
    const ay = (d) => Math.max(0, Math.min(AH, AH * (-6 - d) / 78));
    const heard = (i) => (s.bypass ? 0 : total[i]);
    const area = (fn) => path([[AX, AH]].concat(freqs.map((f, i) => [fx(f), ay(fn(f, i))])).concat([[AX + AW, AH]])) + 'Z';
    const preArea = area((f) => music(f));
    const postArea = area((f, i) => music(f) + heard(i));
    const postEdge = path(freqs.map((f, i) => [fx(f), ay(music(f) + heard(i))]));

    /* RULERS: Filter Designer's; an All Pass names its phase at the right. */
    const tick = (pts) => pts.map(([x, y, dx, dy]) => 'M' + x.toFixed(1) + ' ' + y.toFixed(1) + 'l' + dx + ' ' + dy).join('');
    const xLabel = (x, text) => ({ x: Math.min(AX + AW - 3 * text.length, Math.max(AX + 3 * text.length, x)).toFixed(1), y: AH + 12, anchor: 'middle', text });
    const yLabel = (y, text) => ({ x: AX - 5, y: Math.min(AH, Math.max(7, y + 3)).toFixed(1), anchor: 'end', text });
    const minor = [], labels = [];
    for (let decade = 10; decade <= 10000; decade *= 10) {
      for (let k = 1; k <= 9; k++) {
        const f = decade * k;
        if (f > HI) continue;
        const named = (k === 1 || k === 2 || k === 5) && f >= 20;
        minor.push([fx(f), AH, 0, named ? 3 : 2]);
        if (named) labels.push(xLabel(fx(f), f >= 1000 ? (f / 1000) + 'k' : String(f)));
      }
    }
    const step = { 6: 3, 12: 6, 18: 6, 30: 10 }[R];
    for (let g = R; g >= -R; g -= step / 2) {
      const named = Math.abs(g / step - Math.round(g / step)) < 1e-9;
      minor.push([AX, gy(g), named ? -3 : -2, 0]);
      if (named) labels.push(yLabel(gy(g), (g > 0 ? '+' : '') + g));
    }
    let ticks = 'M' + AX + ' 0V' + AH + 'H' + (AX + AW) + tick(minor);
    if (isAllPass) {
      ticks += 'M' + (AX + AW) + ' 0V' + AH;
      [180, 90, 0, -90, -180].forEach((d) => {
        ticks += 'M' + (AX + AW) + ' ' + py(d).toFixed(1) + 'l3 0';
        labels.push({ x: AX + AW + 5, y: Math.min(AH, Math.max(7, py(d) + 3)).toFixed(1), anchor: 'start', text: (d > 0 ? '+' : '') + d + '°' });
      });
    }

    /* THE HANDLE: Freq across; up its Gain, or for a cut its curve at Freq,
     * or 0 dB. */
    const hy = Math.max(0, Math.min(AH, isGain ? gy(s.type === 'Tilt' ? 0 : s.gain) : s.type === 'High-Pass' || s.type === 'Low-Pass' ? gy(nodeDb(n, s.freq, opts)) : gy(0)));
    const hx = fx(s.freq);
    const handle = { x: hx.toFixed(1), y: hy.toFixed(1), fill: s.bypass ? 'var(--bg-000)' : 'var(--uv)', style: s.bypass ? 'stroke: var(--ink-dim);' : 'filter: drop-shadow(0 0 4px var(--uv-deep));' };
    const hits = [{ kind: 'node', x: hx, y: hy }];
    let widthTicks = '';
    if (['Bell', 'Band-Pass', 'Notch'].indexOf(s.type) >= 0) {
      const oct = 2 * Math.asinh(1 / (2 * s.q)) / Math.LN2;
      [-1, 1].forEach((sgn) => {
        const f = s.freq * Math.pow(2, sgn * oct / 2);
        if (f < LO || f > HI) return;
        widthTicks += 'M' + fx(f).toFixed(1) + ' ' + (hy - 6).toFixed(1) + 'v12';
        hits.push({ kind: 'width', x: fx(f), y: hy });
      });
    }
    this._geo = { AX, AW, AH, R, fOfX, hits };

    /* KNOBS: Filter Designer's ranges and words. */
    const specs = {
      freq: { min: 10, max: 22000, log: true }, gain: { min: -30, max: 30, bipolar: true }, q: { min: 0.1, max: 40, log: true },
      ripple: { min: 0.01, max: 3 }, stopband: { min: 20, max: 120 }, output: { min: -24, max: 24, bipolar: true },
    };
    const norm = (k, v) => { const q = specs[k]; return q.log ? Math.log(v / q.min) / Math.log(q.max / q.min) : (v - q.min) / (q.max - q.min); };
    const denorm = (k, t) => { const q = specs[k]; t = Math.max(0, Math.min(1, t)); return q.log ? q.min * Math.pow(q.max / q.min, t) : q.min + t * (q.max - q.min); };
    const knobPaths = (t, bipolar) => {
      const at = (u, r) => { const a = (-225 + 270 * u) * Math.PI / 180; return [24 + r * Math.cos(a), 24 + r * Math.sin(a)]; };
      const arc = (t0, t1) => {
        if (Math.abs(t1 - t0) < 1e-3) return '';
        const a = Math.min(t0, t1), b = Math.max(t0, t1), p0 = at(a, 20), p1 = at(b, 20);
        return 'M' + p0[0].toFixed(2) + ' ' + p0[1].toFixed(2) + ' A20 20 0 ' + ((b - a) * 270 > 180 ? 1 : 0) + ' 1 ' + p1[0].toFixed(2) + ' ' + p1[1].toFixed(2);
      };
      const i = at(t, 6), o = at(t, 14);
      return { rail: arc(0, 1), arc: bipolar ? arc(0.5, t) : arc(0, t), ptr: 'M' + i[0].toFixed(2) + ' ' + i[1].toFixed(2) + ' L' + o[0].toFixed(2) + ' ' + o[1].toFixed(2) };
    };
    const hz = (f) => (f >= 10000 ? [(f / 1000).toFixed(1), 'kHz'] : f >= 1000 ? [(f / 1000).toFixed(2), 'kHz'] : [String(Math.round(f)), 'Hz']);
    const signed = (v, d) => (v > 0 ? '+' : v < 0 ? '−' : '') + Math.abs(v).toFixed(d);
    const fam = s.type === 'Band-Pass' || s.type === 'Notch' ? (s.family === 'Linkwitz-Riley' ? 'Butterworth' : s.family) : s.family;
    const usesQ = s.type === 'Bell' || s.type === 'Band-Pass' || s.type === 'Notch' || s.order >= 2;
    const usesRipple = fam === 'Chebyshev I' || (fam === 'Elliptic' && s.order >= 2);
    const usesStop = fam === 'Chebyshev II' || (fam === 'Elliptic' && s.order >= 2);
    const KNOBS = {
      freq: () => { const [v, u] = hz(s.freq); return ['Freq', v, u, true, p.freq]; },
      gain: () => ['Gain', signed(s.gain, 1), 'dB', true, 0],
      q: () => [isAllPass || s.type === 'High-Pass' || s.type === 'Low-Pass' ? 'Q' : 'Q', s.q.toFixed(2), '', usesQ, Math.SQRT1_2],
      ripple: () => ['Ripple', s.ripple.toFixed(2), 'dB', usesRipple, 1],
      stopband: () => ['Stopband', s.stopband.toFixed(0), 'dB', usesStop, 60],
      output: () => ['Output', signed(s.output, 1), 'dB', true, 0],
    };
    const knob = (key, col) => {
      const [label, text, unit, enabled, dflt] = KNOBS[key]();
      const t = norm(key, s[key]);
      return Object.assign({
        label, value: text, unit, aria: text + ' ' + unit, col: String(col),
        cls: enabled ? '' : 'disabled', roCls: enabled ? '' : 'disabled',
        down: (e) => { if (!enabled) return; e.currentTarget.setPointerCapture(e.pointerId); self._knob = { y0: e.clientY, t0: t, key }; },
        reset: () => { if (enabled) this.set({ [key]: dflt }); },
      }, knobPaths(t, !!specs[key].bipolar));
    };
    const knobs = p.knobs.map((k, i) => knob(k, i + 1)).concat([knob('output', 6)]);

    /* SELECTS: Family, Slope (an All Pass's Order), Channel. */
    const ordinal = (o) => o + (o === 1 ? 'st' : o === 2 ? 'nd' : o === 3 ? 'rd' : 'th') + ' order';
    const orderText = (o) => (p.ordinal ? ordinal(o) : 6 * o + ' dB/oct');
    const selects = p.selects.map((key) => {
      const open = s.open === key;
      let label, w, value, options;
      if (key === 'family') {
        label = 'Family'; w = 152; value = fam;
        options = FAMILIES.map((f) => ({ text: f, value: f }));
      } else if (key === 'order') {
        label = p.ordinal ? 'Order' : 'Slope'; w = 114; value = orderText(s.order);
        options = []; for (let o = 1; o <= p.orders; o++) options.push({ text: orderText(o), value: o });
      } else {
        label = 'Channel'; w = 100; value = s.channel;
        options = CHANNELS.map((c) => ({ text: c, value: c }));
      }
      return {
        label, w, value, open, openCls: open ? 'open' : '',
        toggle: () => this.set({ open: open ? null : key }),
        options: options.map((o) => ({
          text: o.text, cls: o.value === s[key] ? 'selected' : '',
          pick: () => {
            const patch = { [key]: o.value, open: null };
            /* A Linkwitz-Riley cut is even: the slope snaps up. */
            const nf = key === 'family' ? o.value : s.family, no = key === 'order' ? o.value : s.order;
            if (nf === 'Linkwitz-Riley' && (s.type === 'High-Pass' || s.type === 'Low-Pass') && no % 2) patch.order = Math.min(8, no + 1);
            this.set(patch);
          },
        })),
      };
    });

    const swKey = p.sw === 'Matched' ? 'matched' : 'adaptive';
    const lane = s.channel === 'Stereo' ? 'Stereo (mid)' : s.channel;
    return {
      title: s.name,
      caption: ['Response', lane, '48 kHz'].join('   '),
      analyzerText: s.analyzer === 'Off' ? 'Analyzer off' : s.analyzer === 'Both' ? 'Pre + post' : s.analyzer,
      rangeText: '±' + R + ' dB',
      cycleAnalyzer: () => { const m = ['Both', 'Post', 'Pre', 'Off']; this.set({ analyzer: m[(m.indexOf(s.analyzer) + 1) % m.length] }); },
      cycleRange: () => { const m = [6, 12, 18, 30]; this.set({ range: m[(m.indexOf(s.range) + 1) % m.length] }); },
      showPre: s.analyzer === 'Pre' || s.analyzer === 'Both', showPost: s.analyzer === 'Post' || s.analyzer === 'Both',
      preArea, postArea, postEdge, ticks, labels,
      zeroLine: 'M' + AX + ' ' + gy(0).toFixed(1) + 'H' + (AX + AW),
      curve, widthTicks, handle, selects, knobs,
      hasSwitch: !!p.sw,
      switch: { label: p.sw || '', cls: 'ph-toggle' + (s[swKey] ? ' on' : ''), click: () => this.set({ [swKey]: !s[swKey] }) },
      bypass: { cls: 'ph-toggle' + (s.bypass ? ' on' : ''), click: () => this.set({ bypass: !s.bypass }) },
      hintAxes: isGain ? 'freq across, gain up and down, alt for Q' : 'freq across, Q up and down',
      knobMove: (e) => {
        const k = self._knob;
        if (!k) return;
        const fine = e.shiftKey ? 0.2 : 1;
        this.set({ [k.key]: denorm(k.key, k.t0 + fine * (k.y0 - e.clientY) / 200) });
      },
      knobUp: () => { self._knob = null; },
      wellDown: (e) => this.wellDown(e),
      wellMove: (e) => this.wellMove(e),
      wellUp: () => { self._drag = null; },
      wellDouble: (e) => this.wellDouble(e),
    };
  }

  point(e) {
    const r = e.currentTarget.getBoundingClientRect();
    return [(e.clientX - r.left) * 588 / r.width, (e.clientY - r.top) * 206 / r.height];
  }

  hit(x, y) {
    let best = null, bestD = 9;
    this._geo.hits.forEach((h) => { const d = Math.max(Math.abs(x - h.x), Math.abs(y - h.y)); if (d < bestD) { bestD = d; best = h; } });
    return best;
  }

  wellDown(e) {
    const [x, y] = this.point(e);
    const h = this.hit(x, y);
    if (!h) return;
    e.currentTarget.setPointerCapture(e.pointerId);
    const s = this.st();
    this._drag = { kind: h.kind, x0: x, y0: y, f0: s.freq, g0: s.gain, q0: s.q, alt: e.altKey };
  }

  wellMove(e) {
    const d = this._drag;
    if (!d) return;
    const [x, y] = this.point(e);
    const g = this._geo, s = this.st(), fine = e.shiftKey ? 0.2 : 1;
    const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
    if (d.kind === 'width') {
      const oct = Math.max(0.05, 2 * Math.abs(Math.log2(g.fOfX(x) / s.freq)));
      this.set({ q: clamp(1 / (2 * Math.sinh(oct * Math.LN2 / 2)), 0.1, 40) });
      return;
    }
    const patch = { freq: clamp(d.f0 * Math.pow(2200, fine * (x - d.x0) / g.AW), 10, 22000) };
    const gainType = ['Bell', 'Low Shelf', 'High Shelf', 'Tilt'].indexOf(s.type) >= 0;
    if (gainType && !(d.alt || e.altKey)) patch.gain = clamp(d.g0 - fine * (y - d.y0) * 2 * g.R / g.AH, -30, 30);
    else if (s.type !== 'Tilt') patch.q = clamp(d.q0 * Math.pow(2, -fine * (y - d.y0) / 48), 0.1, 40);
    this.set(patch);
  }

  wellDouble(e) {
    const [x, y] = this.point(e);
    if (!this.hit(x, y)) return;
    const s = this.st();
    this.set(['Bell', 'Low Shelf', 'High Shelf', 'Tilt'].indexOf(s.type) >= 0 ? { gain: 0 } : { q: Math.SQRT1_2 });
  }
}
</script>
</body>
</html>
