.ph-title { font: 500 12px/16px var(--font-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--ink-muted); }
.ph-label { font: 500 11px/14px var(--font-mono); letter-spacing: .1em; text-transform: uppercase; color: var(--ink-muted); text-align: center; }
.ph-value { font: 400 13px/16px var(--font-mono); color: var(--ink); }
.ph-readout-text { font: 500 28px/32px var(--font-mono); letter-spacing: -.01em; color: var(--ink); }
.ph-hint { display: flex; align-items: center; gap: 16px; font: 400 10px/14px var(--font-mono); letter-spacing: .02em; color: var(--ink-muted); text-align: left; padding: 8px 16px; border-top: 1px solid var(--line-100); }

.ph-hint .sep { margin: 0 12px; color: var(--ink-dim); }
.ph-hint .tips { flex: 1; min-width: 0; }

/* Signature — the publisher, once per window */
.ph-sig { display: inline-flex; align-items: center; gap: 8px; flex: none; font: 500 10px/14px var(--font-mono); letter-spacing: .2em; text-transform: uppercase; color: var(--ink-muted); white-space: nowrap; }
.ph-sig .mark { width: 6px; height: 6px; background: var(--uv); box-shadow: var(--glow-led); flex: none; }

.ph-panel { background: var(--bg-100); border: 1px solid var(--line-100); padding: 16px; }
.ph-panel > .ph-title { margin: 0 0 12px; }
.ph-row { display: flex; gap: 16px; align-items: flex-start; }
.ph-group { display: flex; gap: 16px; }
.ph-group + .ph-group { margin-left: 8px; }

/* Knob */
.ph-knob { display: inline-flex; flex-direction: column; align-items: center; gap: 8px; width: 64px; }
.ph-knob svg { display: block; width: 48px; height: 48px; }
.ph-knob.lg svg { width: 64px; height: 64px; }
.ph-knob .disc { fill: var(--bg-200); stroke: var(--line-100); stroke-width: 1; }
.ph-knob .rail { fill: none; stroke: var(--line-200); stroke-width: 2; stroke-linecap: butt; }
.ph-knob .arc  { fill: none; stroke: var(--uv); stroke-width: 2; stroke-linecap: butt; filter: drop-shadow(0 0 3px var(--uv-deep)); }
.ph-knob .ptr  { stroke: var(--uv); stroke-width: 2; stroke-linecap: butt; }
.ph-knob.disabled .arc, .ph-knob.disabled .ptr { stroke: var(--ink-dim); }
.ph-knob.disabled .ph-label, .ph-knob.disabled .ph-readout { color: var(--ink-dim); }
.ph-knob:focus-within svg, .ph-knob:focus-visible svg { box-shadow: var(--glow-focus); border-radius: 999px; }

/* Readout */
.ph-readout { flex: none; min-width: 64px; height: 28px; padding: 0 8px; border: 1px solid var(--line-200); background: var(--bg-000); color: var(--ink); font: 400 13px/26px var(--font-mono); text-align: center; white-space: nowrap; }
.ph-readout .unit { color: var(--ink-muted); margin-left: 2px; }
.ph-readout.editing { border-color: var(--uv); box-shadow: var(--glow-focus); }
.ph-readout.disabled { color: var(--ink-dim); border-color: var(--line-100); }

/* Slider */
.ph-slider { display: inline-flex; flex-direction: column; align-items: center; gap: 8px; width: 64px; }
.ph-slider .track { position: relative; width: 24px; height: 120px; background: var(--bg-200); border: 1px solid var(--line-100); }
.ph-slider .rail { position: absolute; left: 11px; top: 8px; bottom: 8px; width: 2px; background: var(--line-200); }
.ph-slider .fill { position: absolute; left: 11px; bottom: 8px; width: 2px; background: var(--uv); box-shadow: 0 0 6px var(--uv-deep); }
.ph-slider .thumb { position: absolute; left: 4px; width: 16px; height: 6px; margin-bottom: -3px; background: var(--ink); border-radius: 2px; }
.ph-slider.h .track { width: 160px; height: 24px; }
.ph-slider.h .rail { left: 8px; right: 8px; top: 11px; bottom: auto; width: auto; height: 2px; }
.ph-slider.h .fill { left: 8px; bottom: auto; top: 11px; height: 2px; width: 0; }
.ph-slider.h .thumb { left: auto; top: 4px; width: 6px; height: 16px; margin: 0 0 0 -3px; }
.ph-slider.disabled .fill { background: var(--ink-dim); } .ph-slider.disabled .thumb { background: var(--ink-dim); }

/* Button */
.ph-btn { white-space: nowrap; flex: none; height: 28px; padding: 0 12px; border: 1px solid var(--line-200); background: var(--bg-200); color: var(--ink); font: 500 12px/26px var(--font-mono); letter-spacing: .04em; cursor: pointer; border-radius: 0; }
.ph-btn:hover, .ph-btn.hover { background: var(--bg-300); border-color: var(--ink-dim); }
.ph-btn:active, .ph-btn.active { background: var(--uv); color: var(--on-uv); border-color: var(--uv); }
.ph-btn.primary { background: var(--uv); color: var(--on-uv); border-color: var(--uv); box-shadow: var(--glow-led); }
.ph-btn:disabled, .ph-btn.disabled { color: var(--ink-dim); border-color: var(--line-100); background: var(--bg-100); cursor: default; }
.ph-btn:focus-visible { outline: none; box-shadow: var(--glow-focus); }

/* Icons */
.ph-icon { display: inline-block; width: 16px; height: 16px; vertical-align: -3px; color: inherit; flex: none; }
.ph-btn { display: inline-flex; align-items: center; gap: 8px; white-space: nowrap; flex: none; }
.ph-btn.icon { width: 28px; padding: 0; justify-content: center; }
.ph-btn.icon.on { background: var(--uv); color: var(--on-uv); border-color: var(--uv); box-shadow: var(--glow-led); }
.ph-btn.icon.rec.on { background: var(--red); border-color: var(--red); color: var(--bg-000); box-shadow: 0 0 10px var(--red); }
.ph-transport { display: inline-flex; }
.ph-transport .ph-btn + .ph-btn { margin-left: -1px; }

/* Select */
.ph-select { position: relative; display: inline-block; min-width: 96px; }
.ph-select .field { height: 28px; padding: 0 28px 0 12px; border: 1px solid var(--line-200); background: var(--bg-200); color: var(--ink); font: 400 13px/26px var(--font-mono); }
.ph-select .field .ph-icon { position: absolute; right: 6px; top: 6px; color: var(--ink-muted); }
.ph-select.open .field { border-color: var(--uv); }
.ph-select .list { position: absolute; left: 0; right: 0; top: 27px; border: 1px solid var(--uv); background: var(--bg-100); z-index: 1; }
.ph-select .list div { padding: 0 12px; font: 400 13px/28px var(--font-mono); color: var(--ink); }
.ph-select .list div:hover, .ph-select .list .hover { background: var(--bg-300); }
.ph-select .list .selected { color: var(--uv); }

/* LED + Toggle */
.ph-led { display: inline-flex; align-items: center; gap: 8px; }
.ph-led .lens { width: 8px; height: 8px; border-radius: 999px; background: var(--ink-dim); }
.ph-led.on .lens { background: var(--uv); box-shadow: var(--glow-led); }
.ph-led.warn .lens { background: var(--amber); box-shadow: 0 0 6px var(--amber); }
.ph-led.clip .lens { background: var(--red); box-shadow: 0 0 6px var(--red); }
.ph-toggle { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; }
.ph-toggle .sw { position: relative; width: 28px; height: 14px; border: 1px solid var(--line-200); background: var(--bg-200); }
.ph-toggle .sw::after { content: ""; position: absolute; top: 2px; left: 2px; width: 8px; height: 8px; background: var(--ink-dim); }
.ph-toggle.on .sw { border-color: var(--uv); }
.ph-toggle.on .sw::after { left: 16px; background: var(--uv); box-shadow: var(--glow-led); }

/* Step + grid */
.ph-step { position: relative; width: 40px; height: 40px; background: var(--bg-200); border: 1px solid var(--line-100); cursor: pointer; overflow: hidden; }
.ph-step.on { background: var(--uv); border-color: var(--uv); box-shadow: var(--glow-led); }
.ph-step.on.partial { background: var(--bg-200); border-color: var(--uv); }
.ph-step.on .amt { position: absolute; left: 0; right: 0; bottom: 0; background: var(--uv); }
.ph-step.play { box-shadow: var(--glow-led); border-color: var(--uv); }
.ph-step.play:not(.on)::before { content: ""; position: absolute; inset: 0; background: var(--uv-glow); opacity: .5; }
.ph-step.accent { border-color: var(--amber); }
.ph-step .n { position: absolute; left: 4px; top: 2px; font: 400 10px/14px var(--font-mono); color: var(--ink-dim); }
.ph-step.on .n { color: var(--on-uv); }
.ph-grid { display: grid; grid-template-columns: repeat(16, 40px); gap: 8px; width: max-content; }
.ph-grid.beat > :nth-child(4n+1):not(.on):not(.play) { border-color: var(--line-200); }

/* Ring */
.ph-ring { position: relative; width: 240px; height: 240px; }
.ph-ring svg { display: block; width: 100%; height: 100%; }
.ph-ring .track { fill: none; stroke: var(--line-100); stroke-width: 1; }
.ph-ring .seg { stroke: var(--ink-dim); stroke-width: 12; fill: none; stroke-linecap: butt; }
.ph-ring .seg.on { stroke: var(--uv); filter: drop-shadow(0 0 3px var(--uv-deep)); }
.ph-ring .seg.play { stroke: var(--ink); }
.ph-ring .center { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; }

/* Ground (animated) */
.ph-window.has-ground { position: relative; overflow: hidden; }
.ph-window.has-ground > .ph-ground { position: absolute; inset: 0; width: 100%; height: 100%; display: block; z-index: 0; }
.ph-window.has-ground > :not(.ph-ground) { position: relative; z-index: 1; }

/* Actions (copy/paste and other window-level verbs) + side column */
.ph-actions { display: inline-flex; }
.ph-actions.stack { flex-direction: column; gap: 8px; }
.ph-actions.stack .ph-btn { justify-content: flex-start; }
.ph-actions.joined .ph-btn + .ph-btn, .ph-transport .ph-btn + .ph-btn { margin-left: -1px; }
.ph-actions.joined .ph-btn:hover, .ph-actions.joined .ph-btn:focus-visible, .ph-transport .ph-btn:hover, .ph-transport .ph-btn:focus-visible, .ph-transport .ph-btn.on { position: relative; z-index: 1; }
.ph-side { display: flex; flex-direction: column; justify-content: space-between; align-self: stretch; gap: 16px; flex: none; margin-left: auto; }
.ph-side .foot { display: flex; align-items: center; gap: 16px; }

/* Hint: info on hover and focus. The clauses stay laid out under the info string, hidden, so the bar never changes width. */
.ph-hint .tips.stack { display: grid; }
.ph-hint .tips.stack > .clauses, .ph-hint .tips.stack > .info { grid-area: 1 / 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ph-hint .tips.stack > .info { contain: inline-size; }
.ph-hint .clauses.held { visibility: hidden; }
.ph-hint .ph-toggle { flex: none; }

/* Knob detents: 1px radial ticks just outside the rail */
.ph-knob .tick { fill: none; stroke: var(--ink-dim); stroke-width: 1; stroke-linecap: butt; }
.ph-knob .tick.on { stroke: var(--uv); }
.ph-knob.disabled .tick { stroke: var(--line-200); }

/* Panel, compact: the title runs up the left edge */
.ph-panel.compact { display: flex; align-items: center; gap: 12px; height: 140px; }
.ph-panel.compact > .ph-title { margin: 0; writing-mode: vertical-rl; transform: rotate(180deg); white-space: nowrap; }

/* Step, tie: a hollow uv outline with a bar across it */
.ph-step.tie { border-color: var(--uv); box-shadow: inset 0 0 0 1px var(--uv); }
.ph-step.tie::after { content: ""; position: absolute; left: 0; right: 0; top: 50%; height: 2px; margin-top: -1px; background: var(--uv); }
.ph-step.tie.play { box-shadow: inset 0 0 0 1px var(--uv), var(--glow-led); }
.ph-step.tie.play::before { display: none; }

/* Ring, editable: annular wedges, filled */
.ph-ring.edit { cursor: pointer; }
.ph-ring.edit:focus { outline: none; }
.ph-ring.edit:focus-visible svg { box-shadow: var(--glow-focus); border-radius: 999px; }
.ph-ring .wedge { fill: var(--line-200); }
.ph-ring .lit { filter: drop-shadow(0 0 10px var(--uv-glow)) drop-shadow(0 0 2px var(--uv)); }
.ph-ring .lit .wedge { fill: var(--uv); }
.ph-ring .lit .tie { fill: none; stroke: var(--uv); stroke-width: 1; }
.ph-ring .head { fill: var(--ink); filter: drop-shadow(0 0 2px var(--uv)); }

/* PlotWell: the frame of an engine-rendered plot */
.ph-plot { position: relative; display: block; background: var(--bg-000); border: 1px solid var(--line-100); }
.ph-plot > svg { display: block; }
.ph-plot > .caption { position: absolute; left: 6px; top: 0; font: 400 10px/14px var(--font-mono); letter-spacing: .02em; text-transform: uppercase; white-space: pre; color: var(--ink-muted); pointer-events: none; }
.ph-plot .curve { fill: none; stroke: var(--uv); stroke-width: 2; stroke-linejoin: round; filter: drop-shadow(0 0 3px var(--uv-deep)); }
.ph-plot .under { fill: var(--plot-fill); }
.ph-plot .ghost { fill: none; stroke: var(--plot-ghost); stroke-width: 1; }
.ph-plot .key { fill: var(--plot-key); opacity: .3; }
.ph-plot .key-edge { fill: none; stroke: var(--plot-key); stroke-width: 1; opacity: .9; }
.ph-plot .dry { fill: var(--plot-dry); opacity: .5; }
.ph-plot .wet { fill: var(--uv); filter: drop-shadow(0 0 3px var(--uv-deep)); }
.ph-plot .rule { stroke: var(--line-200); stroke-width: 1; }
.ph-plot .rule.warn { stroke: var(--amber); stroke-width: 2; }
.ph-plot .axis { stroke: var(--line-200); stroke-width: 1; }
.ph-plot .tick-label { fill: var(--ink-muted); font: 400 10px var(--font-mono); letter-spacing: .02em; }

/* Meter: a level, read-only */
.ph-meter { position: relative; height: 12px; min-width: 64px; background: var(--bg-200); border: 1px solid var(--line-100); border-radius: 0; }
.ph-meter .fill { position: absolute; left: 0; top: 0; bottom: 0; background: var(--uv); box-shadow: 0 0 6px var(--uv-deep); }
.ph-meter.off .fill { background: var(--line-200); box-shadow: none; }

/* TextField: a name or a value, typed */
.ph-field { height: 28px; min-width: 96px; padding: 0 8px; background: var(--bg-200); border: 1px solid var(--line-200); border-radius: 0; color: var(--ink); font: 400 13px/26px var(--font-mono); outline: none; }
.ph-field::placeholder { color: var(--ink-muted); opacity: 1; }
.ph-field:focus, .ph-field.editing { border-color: var(--uv); box-shadow: var(--glow-focus); }
.ph-field:disabled, .ph-field.disabled { color: var(--ink-dim); border-color: var(--line-100); background: var(--bg-100); }


</style>
</head>

 <input class="ph-field" type="text" placeholder="name this bus" aria-label="Bus name" maxlength="31" style="width:188px">
 <input class="ph-field" type="text" value="kick bus" aria-label="Bus name" maxlength="31" style="width:188px">
