.ph-panel { background: var(--bg-100); border: 1px solid var(--line-100); padding: 16px; }
.ph-panel > .ph-title { margin: 0 0 12px; }
.ph-row { display: flex; gap: 16px; align-items: flex-start; }
.ph-group { display: flex; gap: 16px; }
.ph-group + .ph-group { margin-left: 8px; }

/* Knob */
.ph-knob { display: inline-flex; flex-direction: column; align-items: center; gap: 8px; width: 64px; }
.ph-knob svg { display: block; width: 48px; height: 48px; }
.ph-knob.lg svg { width: 64px; height: 64px; }
.ph-knob .disc { fill: var(--bg-200); stroke: var(--line-100); stroke-width: 1; }
.ph-knob .rail { fill: none; stroke: var(--line-200); stroke-width: 2; stroke-linecap: butt; }
.ph-knob .arc  { fill: none; stroke: var(--uv); stroke-width: 2; stroke-linecap: butt; filter: drop-shadow(0 0 3px var(--uv-deep)); }
.ph-knob .ptr  { stroke: var(--uv); stroke-width: 2; stroke-linecap: butt; }
.ph-knob.disabled .arc, .ph-knob.disabled .ptr { stroke: var(--ink-dim); }
.ph-knob.disabled .ph-label, .ph-knob.disabled .ph-readout { color: var(--ink-dim); }
.ph-knob:focus-within svg, .ph-knob:focus-visible svg { box-shadow: var(--glow-focus); border-radius: 999px; }

/* Readout */
.ph-readout { flex: none; min-width: 64px; height: 28px; padding: 0 8px; border: 1px solid var(--line-200); background: var(--bg-000); color: var(--ink); font: 400 13px/26px var(--font-mono); text-align: center; white-space: nowrap; }
.ph-readout .unit { color: var(--ink-muted); margin-left: 2px; }
.ph-readout.editing { border-color: var(--uv); box-shadow: var(--glow-focus); }
.ph-readout.disabled { color: var(--ink-dim); border-color: var(--line-100); }

/* Slider */
.ph-slider { display: inline-flex; flex-direction: column; align-items: center; gap: 8px; width: 64px; }
.ph-slider .track { position: relative; width: 24px; height: 120px; background: var(--bg-200); border: 1px solid var(--line-100); }
.ph-slider .rail { position: absolute; left: 11px; top: 8px; bottom: 8px; width: 2px; background: var(--line-200); }
.ph-slider .fill { position: absolute; left: 11px; bottom: 8px; width: 2px; background: var(--uv); box-shadow: 0 0 6px var(--uv-deep); }
.ph-slider .thumb { position: absolute; left: 4px; width: 16px; height: 6px; margin-bottom: -3px; background: var(--ink); border-radius: 2px; }
.ph-slider.h .track { width: 160px; height: 24px; }
.ph-slider.h .rail { left: 8px; right: 8px; top: 11px; bottom: auto; width: auto; height: 2px; }
.ph-slider.h .fill { left: 8px; bottom: auto; top: 11px; height: 2px; width: 0; }
.ph-slider.h .thumb { left: auto; top: 4px; width: 6px; height: 16px; margin: 0 0 0 -3px; }
.ph-slider.disabled .fill { background: var(--ink-dim); } .ph-slider.disabled .thumb { background: var(--ink-dim); }

/* Button */
.ph-btn { white-space: nowrap; flex: none; height: 28px; padding: 0 12px; border: 1px solid var(--line-200); background: var(--bg-200); color: var(--ink); font: 500 12px/26px var(--font-mono); letter-spacing: .04em; cursor: pointer; border-radius: 0; }
.ph-btn:hover, .ph-btn.hover { background: var(--bg-300); border-color: var(--ink-dim); }
.ph-btn:active, .ph-btn.active { background: var(--uv); color: var(--on-uv); border-color: var(--uv); }
.ph-btn.primary { background: var(--uv); color: var(--on-uv); border-color: var(--uv); box-shadow: var(--glow-led); }
.ph-btn:disabled, .ph-btn.disabled { color: var(--ink-dim); border-color: var(--line-100); background: var(--bg-100); cursor: default; }
.ph-btn:focus-visible { outline: none; box-shadow: var(--glow-focus); }

/* Icons */
.ph-icon { display: inline-block; width: 16px; height: 16px; vertical-align: -3px; color: inherit; flex: none; }
.ph-btn { display: inline-flex; align-items: center; gap: 8px; white-space: nowrap; flex: none; }
.ph-btn.icon { width: 28px; padding: 0; justify-content: center; }
.ph-btn.icon.on { background: var(--uv); color: var(--on-uv); border-color: var(--uv); box-shadow: var(--glow-led); }
.ph-btn.icon.rec.on { background: var(--red); border-color: var(--red); color: var(--bg-000); box-shadow: 0 0 10px var(--red); }
.ph-transport { display: inline-flex; }
.ph-transport .ph-btn + .ph-btn { margin-left: -1px; }

/* Select */
.ph-select { position: relative; display: inline-block; min-width: 96px; }
.ph-select .field { height: 28px; padding: 0 28px 0 12px; border: 1px solid var(--line-200); background: var(--bg-200); color: var(--ink); font: 400 13px/26px var(--font-mono); }
.ph-select .field .ph-icon { position: absolute; right: 6px; top: 6px; color: var(--ink-muted); }
.ph-select.open .field { border-color: var(--uv); }
.ph-select .list { position: absolute; left: 0; right: 0; top: 27px; border: 1px solid var(--uv); background: var(--bg-100); z-index: 1; }
.ph-select .list div { padding: 0 12px; font: 400 13px/28px var(--font-mono); color: var(--ink); }
.ph-select .list div:hover, .ph-select .list .hover { background: var(--bg-300); }
.ph-select .list .selected { color: var(--uv); }

/* LED + Toggle */
.ph-led { display: inline-flex; align-items: center; gap: 8px; }
.ph-led .lens { width: 8px; height: 8px; border-radius: 999px; background: var(--ink-dim); }
.ph-led.on .lens { background: var(--uv); box-shadow: var(--glow-led); }
.ph-led.warn .lens { background: var(--amber); box-shadow: 0 0 6px var(--amber); }
.ph-led.clip .lens { background: var(--red); box-shadow: 0 0 6px var(--red); }
.ph-toggle { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; }
.ph-toggle .sw { position: relative; width: 28px; height: 14px; border: 1px solid var(--line-200); background: var(--bg-200); }
.ph-toggle .sw::after { content: ""; position: absolute; top: 2px; left: 2px; width: 8px; height: 8px; background: var(--ink-dim); }
.ph-toggle.on .sw { border-color: var(--uv); }
.ph-toggle.on .sw::after { left: 16px; background: var(--uv); box-shadow: var(--glow-led); }

/* Step + grid */
.ph-step { position: relative; width: 40px; height: 40px; background: var(--bg-200); border: 1px solid var(--line-100); cursor: pointer; overflow: hidden; }
.ph-step.on { background: var(--uv); border-color: var(--uv); box-shadow: var(--glow-led); }
.ph-step.on.partial { background: var(--bg-200); border-color: var(--uv); }
.ph-step.on .amt { position: absolute; left: 0; right: 0; bottom: 0; background: var(--uv); }
.ph-step.play { box-shadow: var(--glow-led); border-color: var(--uv); }
.ph-step.play:not(.on)::before { content: ""; position: absolute; inset: 0; background: var(--uv-glow); opacity: .5; }

.ph-ring { position: relative; width: 240px; height: 240px; }

.ph-actions { display: inline-flex; }

<script>
/* Ultraviolet Ground 1.2.0 — the dot-paper ground as a wave field that keeps the host's musical time.
 * Reference implementation, no dependencies. Two parts:
 *   UVGround.Field      simulates and renders the ground (dots + grain) into a <canvas>
 *   UVGround.BeatClock  turns the host's transport into rings: one on every quarter note while it
 *                       plays, a stronger one on each bar's downbeat, none while it is stopped
 *
 * Model: the damped 2D wave equation  u_tt = c²∇²u − γ·u_t + A·s·ψ(t − t₀)·S(x)
 * on a 6 px grid (every second node is a dot). S marks the sources: every open node next to a
 * box edge and every node on the window border. ψ is a Ricker wavelet (peak f₀), so each ring
 * is one slow wave of wavelength c/f₀, s its strength. Box edges and the window border reflect
 * (Neumann, no phase flip), waves superpose linearly, so they interfere, and γ = 2/τ lets the whole
 * field, reflections included, ring out over ~20 s. The field is soft-clipped with tanh for display.
 * Peaks (u > 0): bigger, brighter dots and more grain. Valleys (u < 0): smaller, dimmer dots, less grain.
 *
 * Clock: the field steps on a timer at its frame rate, never on requestAnimationFrame, and page
 * visibility does not pause it: plugin hosts report their editor pages as hidden while they are on
 * screen. The timer runs only while the field moves; destroy() stops it, which the host does when
 * the window closes.
 */
(function (root) {
  'use strict';

  var DEFAULTS = {
    pitch: 12,          // dot pitch, px (space-3)
    cell: 6,            // simulation grid, px (half a pitch)
    speed: 100,         // c, px/s
    freq: 1.5,          // f₀ of the source wavelet, Hz → wavelength c/f₀ ≈ 67 px; a ring on every beat (90–140 BPM) does not cancel the last
    tau: 3.5,           // amplitude e-folding time, s (γ = 2/τ); the field rings out in ~20 s
    gain: 65,           // source strength A: one downbeat peaks near u ≈ 0.9
    border: true,       // the window border emits as well as reflects
    dt: 1 / 60,         // fixed simulation step, s
    maxSteps: 6,        // per frame, after a stall
    rest: 0.004,        // below this everywhere (and no ring active) the field is reset and the timer stops
    dotR: 1.0,          // dot radius at rest, px
    dotDR: 0.4,         // ± radius at |v| = 1
    dotDA: 0.3,         // ± relative dot opacity at |v| = 1
    grainBase: 0.5,     // grain layer opacity at rest (tile mean 10% → 5% effective)
    grainK: 0.8,        // grain gain per unit v
    grainMin: 0.2,      // → 2% effective in the deepest valley
    grainMax: 0.9,      // → 9% effective on the highest peak
    fps: 30,            // the timer's rate while the field moves; 0 at rest
    bg: [6, 4, 16],          // bg-000
    dot: [42, 30, 74],       // bg-dot
    grain: [162, 89, 255]    // uv-deep

  function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }

    for (var i = 0; i < 3; i++) s.push(Math.round((o.dot[i] - o.bg[i] * (1 - a)) / a));

    this.u = new Float32Array(n); this.up = new Float32Array(n); this.un = new Float32Array(n);
    var wall = this.wall = new Uint8Array(n), i, j, r;

    this.enabled = !!on;

  Field.prototype._start = function () {
    if (!this.timer) { this.lastTick = now(); this.acc = 0; this.timer = root.setInterval(this._tick, 1000 / this.o.fps); }

  Field.prototype._stop = function () {
    if (this.timer) root.clearInterval(this.timer);
    this.timer = 0;
  };

  // one explicit step of the damped wave equation, Neumann at walls and at the border
  Field.prototype._step = function () {
    var o = this.o, nx = this.nx, ny = this.ny, u = this.u, up = this.up, un = this.un, wall = this.wall;
    var dt = o.dt, k2 = (o.speed * dt / o.cell) * (o.speed * dt / o.cell), g = (2 / o.tau) * dt / 2;
    var a = 1 / (1 + g), b = 1 - g;

        var t = (j > 0 && !wall[q - nx]) ? u[q - nx] : c;

  Field.prototype._tick = function () {
    var o = this.o, t = now();

    var peak = this.draw();

    }
  };

  Field.prototype._peak = function () {
    var m = 0, u = this.u;
    for (var q = 0; q < u.length; q++) { var v = u[q] < 0 ? -u[q] : u[q]; if (v > m) m = v; }
    return m;
  };

  // Sprite atlas: every cell state rendered once — 8×8 grain positions × LEVELS wave values.
  // A frame blits the baked ground, then one atlas sprite per cell a wave is crossing.
  var LEVELS = 25, MID = (LEVELS - 1) / 2;   // level MID is v = 0, the ground at rest

  Field.prototype._bake = function () {
    if (!this.w) return;
    var o = this.o, p = o.pitch, dpr = this.dpr, cw = this.cw = Math.round(p * dpr);
    var A = this.atlas || (this.atlas = document.createElement('canvas'));
    A.width = 64 * cw; A.height = LEVELS * cw;
    var x = A.getContext('2d'), bg = 'rgb(' + o.bg.join(',') + ')';
    for (var l = 0; l < LEVELS; l++) {
      var v = (l - MID) / MID;
      for (var g = 0; g < 64; g++) {
        var gi = g % 8, gj = (g / 8) | 0;
        x.setTransform(dpr, 0, 0, dpr, g * cw, l * cw);          // cell-local CSS px, dot at (p/2, p/2)
        x.globalAlpha = 1; x.fillStyle = bg; x.fillRect(0, 0, p, p);
        x.globalAlpha = clamp(o.grainBase * (1 + o.grainK * v), o.grainMin, o.grainMax);
        x.drawImage(this.grain, gi * p, gj * p, p, p, 0, 0, p, p);
        x.globalAlpha = clamp(this.dot.alpha * (1 + o.dotDA * v), 0, 1);
        x.fillStyle = this.dot.rgb;
        x.beginPath(); x.arc(p / 2, p / 2, o.dotR + o.dotDR * v, 0, 2 * Math.PI); x.fill();
      }
    }
    var B = this.baked || (this.baked = document.createElement('canvas'));
    B.width = this.canvas.width; B.height = this.canvas.height;
    var y = B.getContext('2d');
    y.fillStyle = bg; y.fillRect(0, 0, B.width, B.height);
    for (var j = 0; j < this.rows; j++) for (var i = 0; i < this.cols; i++) this._blit(y, i, j, MID);
  };

  Field.prototype._blit = function (x, i, j, level) {
    var cw = this.cw, g = (j % 8) * 8 + (i % 8), half = cw / 2;
    x.drawImage(this.atlas, g * cw, level * cw, cw, cw,
      Math.round(i * cw - half), Math.round(j * cw - half), cw, cw);
  };

  // blit the baked ground, then one atlas sprite per dot the field has moved; returns the peak |u|
  Field.prototype.draw = function () {
    if (!this.baked || !this.u) return 0;
    var x = this.ctx, u = this.u, wall = this.wall, nx = this.nx, step = Math.round(this.o.pitch / this.o.cell);
    x.setTransform(1, 0, 0, 1, 0, 0);
    x.globalAlpha = 1;
    x.drawImage(this.baked, 0, 0);
    for (var j = 0; j < this.rows; j++) {
      var gj = j * step; if (gj >= this.ny) break;
      for (var i = 0; i < this.cols; i++) {
        var gi = i * step; if (gi >= nx) break;
        var q = gj * nx + gi;
        if (wall[q]) continue;
        var level = Math.round((Math.tanh(u[q]) + 1) * MID);
        if (level !== MID) this._blit(x, i, j, level);
      }
    }
    return this._peak();
  };

  Field.prototype.destroy = function () {
    this._stop();
    this.rings = [];
  };

  /* ---------- beat clock ---------- */
  var BEAT = {
    downbeat: 1,          // a bar's first beat: the field's full source strength
    beat: 0.55,           // every other quarter note: about half (a plugin may tune it)
    fps: 30,              // ticks per second: one tick's travel is how far past a beat a start may land and still ring it
    slack: 1 / 16         // quarter notes: a position this far behind the last tick is jitter, not a jump
  };

  // quarter notes in a bar: numerator × 4 ÷ denominator; 4/4 when the host gives no time signature
  function barQuarters(num, den) { return num > 0 && den > 0 ? num * 4 / den : 4; }

  // trigger(strength) is called once per ring — pass field.trigger.bind(field)
  function BeatClock(trigger, opts) {
    var o = this.o = {};
    for (var k in BEAT) o[k] = BEAT[k];
    for (k in (opts || {})) o[k] = opts[k];
    this.trigger = trigger;
    this.last = null;     // the position at the last playing tick, in quarter notes; null while stopped
  }

  // forget the last tick: the next playing tick is a start
  BeatClock.prototype.reset = function () { this.last = null; };

  // One tick at the frame rate: the host's position in quarter notes, its tempo (quarter notes per
  // minute), its time signature and whether the transport plays. Rings every quarter note and every
  // bar start crossed since the last tick; returns how many.
  BeatClock.prototype.tick = function (pos, bpm, num, den, playing) {
    var o = this.o;
    if (!playing || !isFinite(pos)) { this.last = null; return 0; }
    var step = (isFinite(bpm) && bpm > 0 ? bpm : 120) / 60 / o.fps;   // quarter notes one tick covers
    var last = this.last;
    var jump = last === null || pos < last - o.slack || pos > last + 4 * step + o.slack;
    this.last = pos;
    // a start, a loop or a seek rings only what its own tick holds: the beat it lands on, never the ones it skipped
    var lo = jump ? pos - step : last;
    if (pos <= lo) return 0;
    var bar = barQuarters(num, den), q = Math.floor(lo) + 1, d = Math.ceil(lo / bar) * bar, rings = [];
    if (d <= lo) d += bar;
    while (Math.min(q, d) <= pos && rings.length < 16) {
      if (Math.abs(q - d) < 1e-9) { rings.push(o.downbeat); q += 1; d += bar; }   // a downbeat on a quarter is one ring
      else if (d < q) { rings.push(o.downbeat); d += bar; }                      // 7/8: a downbeat between two quarters
      else { rings.push(o.beat); q += 1; }
    }
    if (jump) rings = rings.slice(-1);
    for (var i = 0; i < rings.length; i++) this.trigger(rings[i]);
    return rings.length;
  };

  root.UVGround = { version: '1.2.0', Field: Field, BeatClock: BeatClock, defaults: DEFAULTS, beatDefaults: BEAT };
})(window);

</script>
<script>
(function () {
  var win = document.getElementById('win'), cv = document.getElementById('ground');
  var field = new UVGround.Field(cv);
  var led = document.getElementById('beat'), pos = document.getElementById('pos'), status = document.getElementById('status');
  function sources() {
    var o = cv.getBoundingClientRect();
    field.setSources([].map.call(win.querySelectorAll('.ph-panel, .ph-grid, .ph-ring, .ph-plot, [data-wave-source]'), function (el) {
      var r = el.getBoundingClientRect(); return { x: r.left - o.left, y: r.top - o.top, w: r.width, h: r.height };
    }));
  }
  var flash = 0;
  function ring(s) {
    field.trigger(s);
    led.classList.add('on'); clearTimeout(flash); flash = setTimeout(function () { led.classList.remove('on'); }, 90);
  }
  var clock = new UVGround.BeatClock(ring);
  sources();
  if (window.ResizeObserver) new ResizeObserver(function () { field.resize(); sources(); }).observe(win);
  if (field.reduced) status.textContent = 'reduced motion: ground is static';

  win.addEventListener('click', function (e) {
    if (e.target.closest('.ph-panel, .ph-grid, .side, button, .ph-hint')) return;
    ring(1);
  });

  // a host's transport, simulated: 120 BPM from bar 1, ticked by a timer at the frame rate, never by animation frames
  var BPM = 120, METERS = [[4, 4], [3, 4], [7, 8]], meter = 0, t0 = 0, timer = 0;
  var play = document.getElementById('play'), sig = document.getElementById('sig');
  function position() { return (performance.now() - t0) / 60000 * BPM; }
  function show(p) {
    var m = METERS[meter], bar = m[0] * 4 / m[1], b = Math.floor(p / bar);
    pos.textContent = (b + 1) + '.' + (Math.floor(p - b * bar) + 1);
  }
  function tick() {
    var p = position(), m = METERS[meter];
    clock.tick(p, BPM, m[0], m[1], true);
    show(p);
  }
  play.addEventListener('click', function () {
    if (timer) return;
    t0 = performance.now(); clock.reset(); tick();
    timer = setInterval(tick, 1000 / 30);
    play.classList.add('on'); status.textContent = BPM + ' BPM: a ring on every beat, the downbeat strongest';
  });
  document.getElementById('stop').addEventListener('click', function () {
    clearInterval(timer); timer = 0;
    clock.tick(0, BPM, 4, 4, false);
    play.classList.remove('on'); show(0); status.textContent = '';
  });
  sig.addEventListener('click', function () {
    meter = (meter + 1) % METERS.length;
    sig.textContent = METERS[meter][0] + '/' + METERS[meter][1];
  });
  var mo = document.getElementById('motion');
  function toggleMotion() {
    var on = !mo.classList.contains('on'); mo.classList.toggle('on', on); mo.setAttribute('aria-checked', on); field.setEnabled(on);
  }
  mo.addEventListener('click', toggleMotion);
  mo.addEventListener('keydown', function (e) { if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); toggleMotion(); } });
  window.__uvField = field;
  window.__uvClock = clock;
})();
</script>
</body>
</html>
