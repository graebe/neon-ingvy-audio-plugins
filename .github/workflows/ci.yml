#
# The two tiers on a clean runner, and the C and C++ tests under
# ThreadSanitizer.
#
# THE SUITE IS THE ASSET HERE. It is not a smoke test: tg_render_ab renders
# four seconds through the plugin's audio path and hashes it against the Move
# module's reference render, the oracles hold the engines to their own
# measured output, and the host tests reopen every saved set of the iPlug2
# builds in the built VST3s. Those are the checks that say a refactor did not
# change the sound or break a set.
#
# macOS, because the snapshot goldens are macOS renders and the bundles ship
# universal from there; release-plugins.yml builds and tests Windows and Linux
# natively at publishing time. The runner image is pinned (macos-15, not
# macos-latest) so an image rollover is a change somebody makes here rather
# than a red build nobody caused.
#
# The Schwung modules are Linux cross-builds in Docker and are NOT built here:
# release-schwung.yml builds and verifies them on every module tag, and
# `ctest -R release` checks their configuration on every run of this one.
name: CI

# BY HAND ONLY. Every change is built and tested LOCALLY before it is pushed
# (scripts/test.sh quick and full; docs/tech/testing.md): that is the gate, and
# the owner's rule is that GitHub Actions publish rather than discover. This
# workflow is kept as the hand crank for a check on a clean runner, and runs
# only when someone starts it.
on:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # THE QUICK TIER: every Rust crate's tests, the C tests against the
  # engines' ABIs and the oracles, the C++ units of the processors, the kit
  # and the editors, and the lint-like checks. No bundle, no host.
  quick:
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2

      # The licence gate (ctest's cargo_deny) is in every tier, so cargo-deny
      # is installed at its pin (scripts/licence-tools.sh). rust-cache keeps
      # ~/.cargo/bin, so it compiles once per cache.
      - name: cargo-deny, at its pin
        run: scripts/licence-tools.sh install cargo-deny

      - uses: actions/setup-node@v4
        with:
          node-version: '22'      # node --test, which every check over the tree uses

      - name: Ninja and ccache
        run: brew install ninja ccache

      - name: Quick tier
        run: scripts/test.sh quick

  # THE FULL TIER: the release preset's universal build and the site, every
  # test, coverage with the 80% floor, and the validators -- pluginval at
  # strictness 10 with its editor tests, Steinberg's validator, and every
  # bundle's signature.
  full:
    needs: quick
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Rust, with both Apple targets, and the coverage tools
        run: |
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
          rustup component add llvm-tools-preview

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2

      - name: cargo-deny and cargo-llvm-cov
        run: |
          scripts/licence-tools.sh install cargo-deny
          cargo install cargo-llvm-cov --locked

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # The documentation site's dependencies: the full tier builds it and
      # checks its links.
      - run: npm ci

      - name: Ninja and ccache
        run: brew install ninja ccache

      - name: Full tier
        run: scripts/test.sh full

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: build/coverage
          retention-days: 14

  # THE C AND C++ TESTS UNDER THREADSANITIZER. Every test in tests/ and
  # tests/cpp/ is built with -fsanitize=thread (cmake/Sanitize.cmake); the
  # plugins are not. One slice, because the sanitizer runtime is per-arch.
  #
  # NOT THE HOST TESTS (-LE host). They load the bundles -- uninstrumented, by
  # design -- and what they exist to exercise, the plugin's threads, is all
  # inside them, where TSan sees no memory access at all.
  tsan:
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Rust, with the arm64 target
        run: rustup target add aarch64-apple-darwin

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2

      - name: cargo-deny, at its pin
        run: scripts/licence-tools.sh install cargo-deny

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Ninja
        run: brew install ninja

      - name: Configure (thread sanitizer, arm64)
        run: >
          cmake -B build-tsan -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DNI_SANITIZE=thread -DCMAKE_OSX_ARCHITECTURES=arm64

      - name: Build
        run: cmake --build build-tsan

      - name: Test
        env:
          TSAN_OPTIONS: halt_on_error=1:second_deadlock_stack=1
        run: ctest --test-dir build-tsan -L full -LE host --output-on-failure
