# Tag <product>-v<version> for a product with a plugin -> build that ONE
# product's macOS bundles, validate them, sign and notarise them when the
# secrets exist, and attach them to the release.
#
# ONE PRODUCT PER TAG, and the prefix says which. A bare `v*` namespace would
# make a Spectrogram tag publish a Trance Gate, which is the kind of mistake
# that is only ever noticed by whoever downloads the wrong thing.
# tests/release.test.mjs holds the tag list below to exactly the plugins that
# exist.
#
# A tag for a product that also has a Schwung module (trance-gate, side-chain)
# ALSO triggers release-schwung.yml, which builds the Move module from the same
# commit. One tag ships both shells, so their versions cannot drift apart.
#
# SIGNING IS GATED ON SECRETS, and skipped cleanly without them. With all six
# of MACOS_CERTIFICATE_P12 (base64 of a Developer ID Application .p12),
# MACOS_CERTIFICATE_PASSWORD, MACOS_SIGNING_IDENTITY, NOTARY_APPLE_ID,
# NOTARY_TEAM_ID and NOTARY_PASSWORD (an app-specific password), every bundle
# is signed with the hardened runtime and a secure timestamp, notarised and
# stapled. Without them the bundles ship unsigned and the release notes say
# how to clear the quarantine. The build is the same either way.
name: Release plugins

on:
  push:
    tags:
      - 'trance-gate-v*'
      - 'spectrogram-v*'
      - 'listen-in-v*'
      - 'side-chain-v*'

permissions:
  contents: write

# One run per tag. Not cancel-in-progress: a half-finished release is worse
# than a duplicate one.
concurrency:
  group: release-plugins-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # WHICH PRODUCT, WHAT VERSION, AND DOES THE TREE AGREE. Parsed by
      # scripts/release.mjs, the one parser both release workflows share and
      # tests/release.test.mjs runs: the tag is <product>-<version exactly as
      # versions.json spells it>, e.g. trance-gate-v2026.09.29.3. versions.json
      # is where a version is decided and `ctest -R versions` holds config.h,
      # the plists, module.json and every crate to it -- so checking the tag
      # against versions.json checks it against all of them.
      - name: Resolve the tag
        id: tag
        run: |
          node scripts/release.mjs resolve "$GITHUB_REF_NAME" | tee -a "$GITHUB_OUTPUT"
          grep -q '^bundle=' "$GITHUB_OUTPUT" || {
            echo "::error::$GITHUB_REF_NAME names a product with no plugin"; exit 1; }

      # The SDKs at their pins -- see scripts/fetch-sdks.sh and ci.yml.
      - name: SDK cache key
        id: sdk
        run: echo "key=$(scripts/fetch-sdks.sh --cache-key)" >> "$GITHUB_OUTPUT"

      - name: Cache the iPlug2 SDKs
        id: sdks
        uses: actions/cache@v4
        with:
          path: |
            external/iPlug2/Dependencies/IPlug/VST3_SDK
            external/iPlug2/Dependencies/IPlug/CLAP_SDK
            external/iPlug2/Dependencies/IPlug/CLAP_HELPERS
          key: ${{ steps.sdk.outputs.key }}

      - name: Download the iPlug2 SDKs
        if: steps.sdks.outputs.cache-hit != 'true'
        run: scripts/fetch-sdks.sh

      - name: The SDKs are the pinned ones
        run: scripts/fetch-sdks.sh --verify

      - name: Rust, with both Apple targets
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - run: npm ci

      # Deploy on (the default): auval and pluginval need the installed AU.
      - name: Build
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j3

      # The suite runs here too. A tag is the worst possible moment to discover
      # that the render A/B moved, and it costs a couple of minutes. The AU
      # tests load build/out's bundles by path, so they cannot skip.
      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Validate (auval, pluginval, clap-validator)
        run: |
          scripts/validate-plugins.sh fetch "$RUNNER_TEMP/validators"
          scripts/validate-plugins.sh run "$RUNNER_TEMP/validators" build/out

      # THE BUNDLES ARE STAGED BEFORE ANYTHING IS SIGNED. A signature covers
      # every file in the bundle, so the editor (Contents/Resources/web) and
      # the notices (Contents/Resources/LICENSE, THIRD_PARTY_LICENSES.md) must
      # already be inside -- they are, because CMake put them there -- and
      # nothing may be added afterwards.
      - name: Stage the bundles
        env:
          B: ${{ steps.tag.outputs.bundle }}
        run: |
          set -euo pipefail
          mkdir -p stage
          for f in vst3 component clap; do
            src="build/out/$B.$f"
            [ -d "$src" ] || { echo "::error::missing $src"; exit 1; }
            lipo -archs "$src/Contents/MacOS/$B" | grep -q arm64
            lipo -archs "$src/Contents/MacOS/$B" | grep -q x86_64
            for n in LICENSE THIRD_PARTY_LICENSES.md web/index.html web/assets/ui.js.LICENSE.txt web/fonts/OFL.txt; do
              [ -f "$src/Contents/Resources/$n" ] || { echo "::error::$B.$f has no Contents/Resources/$n"; exit 1; }
            done
            ditto "$src" "stage/$B.$f"
          done
          # And beside the bundles at the top of the zip, for whoever reads
          # the download before installing it.
          cp LICENSE THIRD_PARTY_LICENSES.md stage/

      - name: Is signing configured?
        id: signing
        env:
          P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          P12_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}
          NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
        run: |
          if [ -n "$P12" ] && [ -n "$P12_PASSWORD" ] && [ -n "$IDENTITY" ] \
             && [ -n "$APPLE_ID" ] && [ -n "$TEAM_ID" ] && [ -n "$NOTARY_PASSWORD" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "Signing and notarising."
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Signing secrets are not set; the bundles ship unsigned."
          fi

      # A throwaway keychain, so the certificate never touches the login one
      # and is gone with the runner.
      - name: Import the signing certificate
        if: steps.signing.outputs.enabled == 'true'
        env:
          P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          P12_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          KC="$RUNNER_TEMP/signing.keychain-db"
          KC_PASSWORD=$(openssl rand -hex 24)
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KC_PASSWORD" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KC_PASSWORD" "$KC"
          security import "$RUNNER_TEMP/cert.p12" -k "$KC" -P "$P12_PASSWORD" \
            -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KC_PASSWORD" "$KC"
          # Put it on the search list without dropping the ones already there.
          existing=()
          while IFS= read -r k; do
            existing+=("$k")
          done < <(security list-keychains -d user | sed -e 's/^[[:space:]]*"//' -e 's/"$//')
          security list-keychains -d user -s "$KC" "${existing[@]}"
          rm "$RUNNER_TEMP/cert.p12"

      # Hardened runtime and a secure timestamp: notarisation refuses anything
      # without both. No --deep: each bundle has one executable and nothing
      # nested, and --deep would paper over a nested item signed wrongly.
      - name: Sign
        if: steps.signing.outputs.enabled == 'true'
        env:
          IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
        run: |
          set -euo pipefail
          for b in stage/*.vst3 stage/*.component stage/*.clap; do
            codesign --force --options runtime --timestamp --sign "$IDENTITY" "$b"
            codesign --verify --strict --verbose=2 "$b"
          done

      - name: Notarise and staple
        if: steps.signing.outputs.enabled == 'true'
        env:
          APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}
          NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
        run: |
          set -euo pipefail
          ( cd stage && ditto -c -k --keepParent . "$RUNNER_TEMP/notarise.zip" )
          xcrun notarytool submit "$RUNNER_TEMP/notarise.zip" \
            --apple-id "$APPLE_ID" --team-id "$TEAM_ID" --password "$NOTARY_PASSWORD" \
            --wait --timeout 30m
          for b in stage/*.vst3 stage/*.component stage/*.clap; do
            xcrun stapler staple "$b"
            xcrun stapler validate "$b"
          done

      - name: Remove the signing keychain
        if: always() && steps.signing.outputs.enabled == 'true'
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true

      # ditto, not zip: it preserves the bundle structure, the resource forks a
      # macOS plug-in bundle carries, and the stapled tickets.
      - name: Package
        id: pack
        env:
          OUT: ${{ steps.tag.outputs.zip }}
        run: |
          set -euo pipefail
          ( cd stage && ditto -c -k --sequesterRsrc --keepParent . "../$OUT" )
          unzip -l "$OUT" | grep -q 'THIRD_PARTY_LICENSES.md' || { echo "::error::no notices in $OUT"; exit 1; }
          echo "zip=$OUT" >> "$GITHUB_OUTPUT"
          ls -la "$OUT"

      # THE SOURCE IS LINKED FROM EVERY RELEASE. GPLv3 gives whoever receives a
      # build the right to the source it was made from (section 6), and that
      # source is exactly the tagged tree: its scripts fetch the pinned
      # submodule and SDKs.
      - name: Release notes
        env:
          BUNDLE: ${{ steps.tag.outputs.bundle }}
          VERSION: ${{ steps.tag.outputs.version }}
          SIGNED: ${{ steps.signing.outputs.enabled }}
        run: |
          {
            echo "## $BUNDLE $VERSION"
            echo
            echo "VST3, Audio Unit and CLAP, universal (arm64 + x86_64)."
            echo
            echo "Copy the bundles to:"
            echo
            echo "| format | destination |"
            echo "|---|---|"
            echo "| \`.vst3\` | \`~/Library/Audio/Plug-Ins/VST3/\` |"
            echo "| \`.component\` | \`~/Library/Audio/Plug-Ins/Components/\` |"
            echo "| \`.clap\` | \`~/Library/Audio/Plug-Ins/CLAP/\` |"
            echo
            if [ "$SIGNED" = true ]; then
              echo "Signed with a Developer ID and notarised by Apple."
            else
              echo "**These builds are not signed or notarised**, so macOS will refuse"
              echo "to load them until the download quarantine is removed:"
              echo
              echo '```sh'
              echo "xattr -dr com.apple.quarantine ~/Library/Audio/Plug-Ins/VST3/$BUNDLE.vst3"
              echo '```'
              echo
              echo "(and likewise for the other two)."
            fi
            echo
            echo "A host that has already scanned an older build needs to rescan."
            echo
            echo "Licence: GPL-3.0-or-later. This build's source is the tag"
            echo "[\`$GITHUB_REF_NAME\`]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/tree/$GITHUB_REF_NAME)."
            echo "The licence and the third-party notices, LICENSE and"
            echo "THIRD_PARTY_LICENSES.md, are in the zip and inside every bundle."
          } > "$RUNNER_TEMP/notes.md"

      - name: Create Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65  # v2.6.2
        with:
          files: ${{ steps.pack.outputs.zip }}
          fail_on_unmatched_files: true
          prerelease: ${{ steps.tag.outputs.prerelease }}
          body_path: ${{ runner.temp }}/notes.md
