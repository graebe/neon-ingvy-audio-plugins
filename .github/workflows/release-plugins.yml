#
# Tag <product>-v<version> for a product with a plugin -> build that ONE
# product's VST3 on macOS, test it, validate it, stage it with its notices,
# sign and notarise it when the secrets exist, and attach the macOS zip to the
# release.
#
# MACOS ONLY, FOR NOW. The owner's decision of 2026-10-08: releases are VST3
# for macOS, and Linux and Windows rejoin later, only as part of the full
# build. The cross-build kit (tools/docker, tools/cross, scripts/build-*.sh)
# stays in the repository and is not released.
#
# GITHUB ACTIONS IS FOR PUBLISHING ONLY: everything here is built and tested
# locally first (scripts/test.sh).
#
# ONE PRODUCT PER TAG, and the prefix says which. A bare `v*` namespace would
# make a Spectrogram tag publish a Trance Gate, which is the kind of mistake
# that is only ever noticed by whoever downloads the wrong thing.
# tests/release.test.mjs holds the tag list below to exactly the plugins that
# exist, and the staging to what a built bundle holds.
#
# A tag for a product that also has a Schwung module (trance-gate, side-chain)
# ALSO triggers release-schwung.yml, which builds the Move module from the same
# commit. One tag ships both shells, so their versions cannot drift apart.
#
# SIGNING IS GATED ON SECRETS, and skipped cleanly without them. With all six
# of MACOS_CERTIFICATE_P12 (base64 of a Developer ID Application .p12),
# MACOS_CERTIFICATE_PASSWORD, MACOS_SIGNING_IDENTITY, NOTARY_APPLE_ID,
# NOTARY_TEAM_ID and NOTARY_PASSWORD (an app-specific password), the macOS
# bundle is signed with the hardened runtime and a secure timestamp, notarised
# and stapled. Without them it ships ad-hoc signed, as the build signs it, and
# the release notes say how to clear the quarantine. The build is the same
# either way.
name: Release plugins

on:
  push:
    tags:
      - 'trance-gate-v*'
      - 'spectrogram-v*'
      - 'listen-in-v*'
      - 'side-chain-v*'
      - 'chord-detector-v*'

permissions:
  contents: write

# One run per tag. Not cancel-in-progress: a half-finished release is worse
# than a duplicate one.
concurrency:
  group: release-plugins-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    name: macos
    # Linux and Windows come back here when the full build carries them
    # (docs/tech/cross-build.md).
    runs-on: macos-15
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # WHICH PRODUCT, WHAT VERSION, AND DOES THE TREE AGREE. Parsed by
      # scripts/release.mjs, the one parser both release workflows share and
      # tests/release.test.mjs runs: the tag is <product>-<version exactly as
      # versions.json spells it>, e.g. trance-gate-v2026.10.08.1. versions.json
      # is where a version is decided and `ctest -R versions` holds the build,
      # module.json and every crate to it -- so checking the tag against
      # versions.json checks it against all of them.
      - name: Resolve the tag
        id: tag
        run: |
          node scripts/release.mjs resolve "$GITHUB_REF_NAME" | tee -a "$GITHUB_OUTPUT"
          grep -q '^bundle=' "$GITHUB_OUTPUT" || {
            echo "::error::$GITHUB_REF_NAME names a product with no plugin"; exit 1; }

      - name: Ninja
        run: command -v ninja || brew install ninja

      - name: Rust, with both Apple targets
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      # The suite below includes the licence gate, ctest's cargo_deny.
      - name: cargo-deny, at its pin
        run: scripts/licence-tools.sh install cargo-deny

      # The release preset: Release, link-time optimisation and the universal
      # binary (CMakePresets.json).
      - name: Build
        run: |
          cmake --preset release -B build
          cmake --build build

      # The suite runs here too: a tag is the worst moment to discover that
      # the render A/B moved. The full tier: the snapshot goldens are macOS
      # renders.
      - name: Test (the full tier)
        run: ctest --test-dir build -L full --output-on-failure

      # pluginval at strictness 10 with its editor tests, Steinberg's
      # validator, and the signature as Live's scanner checks it.
      - name: Validate
        run: |
          scripts/validate-plugins.sh fetch "$RUNNER_TEMP/validators"
          scripts/validate-plugins.sh run "$RUNNER_TEMP/validators" build/out

      # THE BUNDLE IS STAGED AS BUILT, BEFORE ANYTHING IS SIGNED. Everything
      # it carries -- its notices, moduleinfo.json -- the build put there
      # before it signed, and scripts/stage-release.mjs checks that each is,
      # for this product on macOS, then copies it with LICENSE and
      # THIRD_PARTY_LICENSES.md beside it.
      - name: Stage the bundle
        env:
          PRODUCT: ${{ steps.tag.outputs.product }}
        run: node scripts/stage-release.mjs "$PRODUCT" build/out stage --os macos

      - name: Is signing configured?
        id: signing
        env:
          P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          P12_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}
          NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
        run: |
          if [ -n "$P12" ] && [ -n "$P12_PASSWORD" ] && [ -n "$IDENTITY" ] \
             && [ -n "$APPLE_ID" ] && [ -n "$TEAM_ID" ] && [ -n "$NOTARY_PASSWORD" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "Signing and notarising."
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Signing secrets are not set; the macOS bundle ships ad-hoc signed."
          fi

      # A throwaway keychain, so the certificate never touches the login one
      # and is gone with the runner.
      - name: Import the signing certificate
        if: steps.signing.outputs.enabled == 'true'
        env:
          P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          P12_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          KC="$RUNNER_TEMP/signing.keychain-db"
          KC_PASSWORD=$(openssl rand -hex 24)
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KC_PASSWORD" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KC_PASSWORD" "$KC"
          security import "$RUNNER_TEMP/cert.p12" -k "$KC" -P "$P12_PASSWORD" \
            -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KC_PASSWORD" "$KC"
          # Put it on the search list without dropping the ones already there.
          existing=()
          while IFS= read -r k; do
            existing+=("$k")
          done < <(security list-keychains -d user | sed -e 's/^[[:space:]]*"//' -e 's/"$//')
          security list-keychains -d user -s "$KC" "${existing[@]}"
          rm "$RUNNER_TEMP/cert.p12"

      # Hardened runtime and a secure timestamp: notarisation refuses anything
      # without both. The signature replaces the build's ad-hoc one and is the
      # LAST thing written into the bundle; --deep --strict is what Live's
      # scanner checks.
      - name: Sign
        if: steps.signing.outputs.enabled == 'true'
        env:
          IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
        run: |
          set -euo pipefail
          for b in stage/*.vst3; do
            codesign --force --options runtime --timestamp --sign "$IDENTITY" "$b"
            codesign --verify --deep --strict --verbose=2 "$b"
          done

      - name: Notarise and staple
        if: steps.signing.outputs.enabled == 'true'
        env:
          APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}
          NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
        run: |
          set -euo pipefail
          ( cd stage && ditto -c -k --keepParent . "$RUNNER_TEMP/notarise.zip" )
          xcrun notarytool submit "$RUNNER_TEMP/notarise.zip" \
            --apple-id "$APPLE_ID" --team-id "$TEAM_ID" --password "$NOTARY_PASSWORD" \
            --wait --timeout 30m
          for b in stage/*.vst3; do
            xcrun stapler staple "$b"
            xcrun stapler validate "$b"
            codesign --verify --deep --strict --verbose=2 "$b"
          done

      - name: Remove the signing keychain
        if: always() && steps.signing.outputs.enabled == 'true'
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true

      # ditto, not zip: it keeps the bundle's structure, its signature and the
      # stapled ticket.
      - name: Package
        id: pack
        env:
          OUT: ${{ steps.tag.outputs.zip_macos }}
        run: |
          set -euo pipefail
          ( cd stage && ditto -c -k --sequesterRsrc --keepParent . "../$OUT" )
          unzip -l "$OUT" | grep -q 'THIRD_PARTY_LICENSES.md' || { echo "::error::no notices in $OUT"; exit 1; }
          echo "zip=$OUT" >> "$GITHUB_OUTPUT"
          ls -la "$OUT"

      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: ${{ steps.pack.outputs.zip }}
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Resolve the tag
        id: tag
        run: node scripts/release.mjs resolve "$GITHUB_REF_NAME" | tee -a "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v4
        with:
          path: zips
          merge-multiple: true

      - name: Was the macOS bundle notarised?
        id: signing
        env:
          P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
        run: |
          if [ -n "$P12" ] && [ -n "$IDENTITY" ] && [ -n "$NOTARY_PASSWORD" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      # THE SOURCE IS LINKED FROM EVERY RELEASE. GPLv3 gives whoever receives a
      # build the right to the source it was made from (section 6), and that
      # source is exactly the tagged tree: its JUCE submodule is pinned, and
      # cargo builds from Cargo.lock.
      - name: Release notes
        env:
          BUNDLE: ${{ steps.tag.outputs.bundle }}
          VERSION: ${{ steps.tag.outputs.version }}
          SIGNED: ${{ steps.signing.outputs.enabled }}
        run: |
          {
            echo "## $BUNDLE $VERSION"
            echo
            echo "VST3 for macOS (universal: Apple silicon and Intel). Linux and Windows follow in a later release."
            echo "Unzip it and copy \`$BUNDLE.vst3\` to \`~/Library/Audio/Plug-Ins/VST3/\`."
            echo
            if [ "$SIGNED" = true ]; then
              echo "The macOS bundle is signed with a Developer ID and notarised by Apple."
            else
              echo "**The macOS bundle is not notarised**, so macOS will refuse to load it"
              echo "until the download quarantine is removed:"
              echo
              echo '```sh'
              echo "xattr -dr com.apple.quarantine ~/Library/Audio/Plug-Ins/VST3/$BUNDLE.vst3"
              echo '```'
            fi
            echo
            echo "A host that has already scanned an older build needs to rescan."
            echo "What changed is in [CHANGELOG.md]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/blob/$GITHUB_REF_NAME/CHANGELOG.md)."
            echo
            echo "Licence: GPL-3.0-or-later. This build's source is the tag"
            echo "[\`$GITHUB_REF_NAME\`]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/tree/$GITHUB_REF_NAME)."
            echo "The licence and the third-party notices, LICENSE and"
            echo "THIRD_PARTY_LICENSES.md, are in the zip and inside the bundle."
          } > "$RUNNER_TEMP/notes.md"

      # A tag with both a plugin and a module is released by BOTH workflows.
      # The action looks the release up by tag before creating one, so each
      # attaches its files to the same release.
      - name: Create Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65  # v2.6.2
        with:
          files: |
            zips/${{ steps.tag.outputs.zip_macos }}
          fail_on_unmatched_files: true
          prerelease: ${{ steps.tag.outputs.prerelease }}
          body_path: ${{ runner.temp }}/notes.md
