# ONE WORKSPACE, EVERY ENGINE.
#
# The Trance Gate's crates and the Spectrogram's were two separate workspaces
# with two lock files and two copies of the profile below -- and the
# Spectrogram's carried a comment admitting it: "The same settings as the
# Trance Gate engine, for the same reasons". A shared setting that is stated
# twice is a setting that will eventually be stated differently.
#
# Merging them was free, and that was checked rather than assumed: no crate had
# an external dependency then, so there were no third-party versions for one
# lock file to resolve differently from two. The render A/B
# (tests/render_plugin.c) proved it after the fact: it hashes four seconds
# through the plugin's audio path against the Move module's reference render,
# and that number did not move.
#
# Crates from crates.io came later, when docs/adr/0003-established-rust-crates.md
# reversed the zero-dependency rule, and one lock file is what keeps them
# cheap: every engine links the same version of each, and
# [workspace.dependencies] below is the one place that version is written.
#
# PRODUCT engines stay INDEPENDENT of each other. A product crate may depend on
# its own engine's crates, on the house transport and on the shared crates
# below, and on nothing else in this file; spectro-core knowing about tg-core
# would be a coupling nobody asked for.
#
# audio-bus is the exception that names the rule. It is NOT a product engine --
# it is the house transport, the Rust counterpart of ui-kit, and it exists
# precisely so that two products can share one thing: a Listen-In publishes
# audio and a Spectrogram reads it. It depends on no product in return, which is
# the direction that actually matters.
#
# engines/ground, engines/shell and engines/shared are shared the same way and
# hold the same line: products use them, and they depend on no product.
[workspace]
resolver = "2"
members = [
    # The Trance Gate: one core, two wrappers around it.
    "engines/trance-gate/crates/tg-core",     # the DSP
    "engines/trance-gate/crates/tg-capi",     # the C ABI -> the plugin
    "engines/trance-gate/crates/tg-move",     # the Schwung vtable -> the module
    # The Spectrogram: one core, one wrapper. No Move target -- the hardware
    # has no screen to draw a spectrogram on.
    "engines/spectro/crates/spectro-core",
    "engines/spectro/crates/spectro-recv",   # listen-in: many sources, and the clash
    "engines/spectro/crates/spectro-capi",
    # The house transport. Not a product -- see the note above.
    "engines/audio-bus/crates/bus-core",
    "engines/audio-bus/crates/bus-capi",
    # NI Side-Chain: one core, two wrappers, same shape as the Trance Gate.
    "engines/side-chain/crates/sc-core",      # the DSP
    "engines/side-chain/crates/sc-capi",      # the C ABI -> the plugin
    "engines/side-chain/crates/sc-move",      # the Schwung vtable -> the module
    # The animated ground's beat clock. Like audio-bus it is not a
    # product: it ships inside EVERY editor, because the design system gives
    # every window the same ground. It depends on no product in return.
    "engines/ground/crates/ground-core",      # the beat clock
    "engines/ground/crates/ground-capi",      # the C ABI -> every plugin
    # How a plugin shell's threads reach an engine: the command queue in, the
    # published snapshot out, and the handoff for objects the main thread
    # builds and frees. Not a product either, and for the same reason as the
    # two above: every plugin's shell has the same threads. It knows no product;
    # each product's capi crate supplies the engine-shaped half.
    "engines/shell/crates/shell-core",        # the mechanism
    "engines/shell/crates/shell-capi",        # the handoff's C ABI -> the shells
    # What two products would otherwise each keep a copy of. Product-free by
    # the same rule: a piece moves here only once it names no product.
    "engines/shared/crates/ni-dsp",           # C-compatible fmt, rates, curves, glides
    "engines/shared/crates/ni-schwung",       # the audio_fx v2 glue -> every module
    "engines/shared/crates/ni-testkit",       # test-only: the counting allocator
]

# NEVER PUBLISHED. These crates ship inside the products and nowhere else, so
# none of them goes to crates.io -- and publish = false is also how cargo-about
# (about.toml) tells this repository's own crates, listed by hand in
# THIRD_PARTY_LICENSES.md, from the third-party ones whose notices it writes.
# Every member says `publish.workspace = true`.
[workspace.package]
publish = false

# THE CRATES FROM crates.io, EACH VERSION WRITTEN ONCE. A member takes one with
# `name = { workspace = true }` and names the features it uses, with its
# reasons, in its own manifest. Several engines share a crate here -- rtrb,
# atomic_float, arrayvec and fastrand already do -- and a version written in
# each of them would drift the way the two workspaces' profiles did.
#
# NO DEFAULT FEATURES, for any of them. A crate's defaults are usually `std`, or
# a convenience nothing here calls, and Cargo merges features across the whole
# graph: one member that took a crate's defaults would switch them on for every
# engine linking that crate. So the switch is off here, once, and each member
# asks for exactly what it uses.
#
# What may appear here at all is deny.toml's to decide (licence and source);
# scripts/gen-rust-notices.sh writes the notices for whatever ships.
[workspace.dependencies]
# The Spectrogram's FFT, and the complex transform its test oracle runs.
realfft = { version = "3.5.0", default-features = false }
rustfft = { version = "6.4.1", default-features = false }
# Between threads: a wait-free SPSC ring, the latest whole value from one
# thread to another, an object the audio thread lets go of freed where freeing
# is allowed, and floats an atomic can hold.
rtrb = { version = "0.4.0", default-features = false }
triple_buffer = { version = "9.0.0", default-features = false }
basedrop = { version = "0.1.3", default-features = false }
atomic_float = { version = "1.1.0", default-features = false }
# The audio bus's shared memory: libc on macOS and Linux, windows-sys on Windows.
libc = { version = "0.2.190", default-features = false }
windows-sys = { version = "0.61.2", default-features = false }
# MIDI bytes to messages, for the Side-Chain's trigger.
wmidi = { version = "4.0.11", default-features = false }
# Text: numbers read as C reads them, a string on the stack, and the Trance
# Gate's JSON formats.
lexical-core = { version = "1.0.6", default-features = false }
arrayvec = { version = "0.7.8", default-features = false }
serde = { version = "1.0.229", default-features = false }
serde_json = { version = "1.0.151", default-features = false }
# A seeded generator: the Trance Gate's randomiser and the tests' noise.
fastrand = { version = "2.5.0", default-features = false }

# THE AUDIO CALLBACK MUST NOT UNWIND.
#
# Every entry point in every engine runs on an audio callback, and unwinding a
# panic out of `extern "C"` into a C or C++ host is undefined behaviour.
# Aborting is the honest failure: it is a crash either way, and this way it is
# one the OS reports rather than one that corrupts the host's stack on its way
# out.
#
# It also removes the landing pads, which is most of the size a panicking Rust
# cdylib carries over a C one -- and the Move module is a file on a device with
# a fixed amount of space.
[profile.release]
panic = "abort"
lto = true
codegen-units = 1
opt-level = 3
strip = true

[profile.dev]
panic = "abort"
