#
# sf_shell.h, from src/shell.rs (build.rs, through
# engines/shared/cbindgen/capi_header.rs).
language = "C"
header = """// SPDX-License-Identifier: GPL-3.0-or-later
// Copyright (C) 2026 Torben Gräber
//
// The single-filter engine as a plugin shell holds it, `sf_shell_*`, and the
// picture its editor draws. GENERATED at build time by cbindgen from
// engines/single-filter/crates/sf-capi/src/shell.rs -- edit that, never
// this."""
include_guard = "SF_SHELL_H"
cpp_compat = true
documentation = true
documentation_style = "c99"
usize_is_size_t = true
sys_includes = ["stdbool.h", "stddef.h", "stdint.h"]
no_includes = true
# SfCore, which sf_shell_begin lends, is the core header's.
includes = ["sf_core.h"]

[export]
include = ["SfPicture"]
exclude = ["SfCore"]

[enum]
prefix_with_name = true
