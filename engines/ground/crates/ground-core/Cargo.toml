[package]
name = "ground-core"
version = "2026.10.6+5"
edition = "2021"
license = "GPL-3.0-or-later"
description = "The beat clock behind the Ultraviolet design system's animated ground"
publish.workspace = true

# The clock is arithmetic on the host's transport. The one crate is for the
# two floats it hands between threads (src/lib.rs): the latest ring's strength
# and the requested sample rate. `atomic_f64` is the feature that brings the
# second; the workspace takes no crate's defaults.
[dependencies]
atomic_float = { workspace = true, features = ["atomic_f64"] }

[dev-dependencies]
# The counting allocator behind tests/no_alloc.rs.
ni-testkit = { path = "../../../shared/crates/ni-testkit" }
