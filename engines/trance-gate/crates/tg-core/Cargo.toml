[package]
name = "tg-core"
version = "2026.10.6+5"
edition = "2021"
authors = ["Torben Gräber"]
license = "GPL-3.0-or-later"
description = "Trance Gate DSP engine: a tempo-locked step gate with a per-step ADSR"
publish.workspace = true

[lib]
crate-type = ["rlib"]

[dependencies]
# The DSP the products share; product-free. See the workspace Cargo.toml.
ni-dsp = { path = "../../../shared/crates/ni-dsp" }
# The state blob, slot files and pasted text are flat JSON objects, and
# serde_json reads them (src/json.rs). One hand-written visitor reads all
# three, so serde is taken for its traits alone: no derive, and none of its
# default features. serde_json needs `alloc` to read a str, and nothing of
# `std`; `float_roundtrip` stays off, which keeps number parsing free of its
# scratch buffer (json.rs says why the result is the same double).
serde = { workspace = true }
serde_json = { workspace = true, features = ["alloc"] }
# A file's fields, in order, on the stack (json::Object).
arrayvec = { workspace = true }
# The randomiser's generator (Instance::randomize), seeded and advanced by the
# instance. `std` would add only the thread-local generator and its entropy,
# which a roll that must be reproducible from its seed never uses.
fastrand = { workspace = true }

# Test-only: built for the tests, shipped in nothing.
[dev-dependencies]
# The counting allocator the no_alloc test installs.
ni-testkit = { path = "../../../shared/crates/ni-testkit" }
# The property test (tests/state_round_trip.rs). `std` is its generator and its
# runner; fork, timeout and bit-set -- a process per case, a watchdog, a
# bit-set strategy -- are features nothing here uses.
proptest = { workspace = true, features = ["std"] }
