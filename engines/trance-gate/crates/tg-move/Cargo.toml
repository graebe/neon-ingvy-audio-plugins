[package]
name = "tg-move"
version = "2026.10.8+1"
edition = "2021"
authors = ["Torben Gräber"]
license = "GPL-3.0-or-later"
description = "The Schwung audio_fx v2 shell for the Trance Gate"
publish.workspace = true

[lib]
name = "tg_move"
crate-type = ["cdylib", "staticlib"]

[dependencies]
tg-core = { path = "../tg-core" }
# Pulled in so ONE staticlib carries both surfaces: the Schwung vtable and
# the tg_core_* ABI the tests and the plugin link. Two staticlibs would each
# bundle their own copy of the Rust runtime and collide. Without its `shell`
# feature: the plugin shell and the ground are the plugin's, and nothing on the
# Move calls them (tg-capi's Cargo.toml).
tg-capi = { path = "../tg-capi", default-features = false }
# The Schwung audio_fx v2 glue, shared with every module.
ni-schwung = { path = "../../../shared/crates/ni-schwung" }

[dev-dependencies]
# The tests' stand-in for the host's clock, a double the vtable's callback
# reads (src/lib.rs). `atomic_f64` is the feature that brings AtomicF64.
atomic_float = { workspace = true, features = ["atomic_f64"] }
