[package]
name = "tg-move"
version = "2026.9.29+2"
edition = "2021"
authors = ["Torben Gräber"]
license = "MIT"
description = "The Schwung audio_fx v2 shell for the Trance Gate"

[lib]
name = "tg_move"
crate-type = ["cdylib", "staticlib"]

[dependencies]
tg-core = { path = "../tg-core" }
# Pulled in so ONE staticlib carries both surfaces: the Schwung vtable and
# the tg_core_* ABI the tests and the plugin link. Two staticlibs would each
# bundle their own copy of the Rust runtime and collide.
tg-capi = { path = "../tg-capi" }
