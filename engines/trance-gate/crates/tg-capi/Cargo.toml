[package]
name = "tg-capi"
version = "2026.9.29+3"
edition = "2021"
authors = ["Torben Gräber"]
license = "MIT"
description = "The tg_core_* C ABI over the Trance Gate engine"

[lib]
name = "tg_capi"
# staticlib for the JUCE plugin to link; cdylib so the engine's own C tests
# can dlopen-free link it the same way they linked the .c files.
crate-type = ["staticlib", "rlib"]

[dependencies]
tg-core = { path = "../tg-core" }
# The animated ground's detector. NOT a second static library -- see the note in
# ground-capi/Cargo.toml: one archive per plugin is an invariant here, so the
# ground's C ABI is compiled INTO this one, the same way spectro-capi reaches
# bus-core through spectro-recv.
ground-capi = { path = "../../../ground/crates/ground-capi" }
