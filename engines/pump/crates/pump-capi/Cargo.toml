[package]
name = "pump-capi"
version = "0.1.0"
edition = "2021"
authors = ["Torben Gräber"]
license = "MIT"
description = "The pump_core_* C ABI over the NI Pump engine"

[lib]
name = "pump_capi"
# staticlib for the plugin to link; rlib so pump-move can carry this surface
# too without a second copy of the Rust runtime.
crate-type = ["staticlib", "rlib"]

[dependencies]
pump-core = { path = "../pump-core" }
