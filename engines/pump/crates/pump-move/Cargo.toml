[package]
name = "pump-move"
version = "0.1.0"
edition = "2021"
authors = ["Torben Gräber"]
license = "MIT"
description = "The Schwung audio_fx v2 shell for NI Pump"

[lib]
name = "pump_move"
crate-type = ["cdylib", "staticlib"]

[dependencies]
pump-core = { path = "../pump-core" }
# Pulled in so ONE staticlib carries both surfaces: the Schwung vtable and the
# pump_core_* ABI the tests and the plugin link. Two staticlibs would each
# bundle their own copy of the Rust runtime and collide.
pump-capi = { path = "../pump-capi" }
