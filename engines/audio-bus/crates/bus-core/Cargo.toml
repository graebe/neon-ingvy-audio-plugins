[package]
name = "bus-core"
version = "2026.10.6+5"
edition = "2021"
license = "GPL-3.0-or-later"
description = "A shared-memory audio bus: one writer, many readers, across processes"
publish.workspace = true

# THE OPERATING SYSTEM'S SHARED MEMORY, DECLARED BY THE CRATES THAT KNOW IT.
# shm.rs used to declare six POSIX calls itself, for macOS only, under the
# zero-dependency rule docs/adr/0003-established-rust-crates.md reverses. It now
# keeps one `Shm` type over libc on macOS and Linux and windows-sys on Windows;
# the seqlock ring above it stays this crate's own. The cfgs match shm.rs's.
[dependencies]
# The ring's samples (ring.rs): a float stored and loaded through an AtomicU32's
# bits, in an f32's four bytes. Its default feature adds AtomicF64, which the
# ring has no use for.
atomic_float = { version = "1.1.0", default-features = false }

[target.'cfg(any(target_os = "macos", target_os = "linux"))'.dependencies]
# shm_open, mmap, fstat, kill and clock_gettime. Its default feature, `std`,
# adds nothing these calls use.
libc = { version = "0.2.190", default-features = false }

# The named file mapping, the process check and the clock, from only the
# modules that hold them. windows-sys has no default features.
[target.'cfg(windows)'.dependencies.windows-sys]
version = "0.61.2"
default-features = false
features = [
    "Win32_Foundation",         # handles, errors, STILL_ACTIVE
    "Win32_Security",           # CreateFileMappingW's signature names SECURITY_ATTRIBUTES
    "Win32_System_Memory",      # the file mapping and its views
    "Win32_System_Performance", # QueryPerformanceCounter, the incarnation's clock
    "Win32_System_Threading",   # OpenProcess and GetExitCodeProcess
]

# The counting allocator the no_alloc test installs. Test-only.
[dev-dependencies]
ni-testkit = { path = "../../../shared/crates/ni-testkit" }
