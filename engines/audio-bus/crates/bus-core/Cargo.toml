[package]
name = "bus-core"
version = "2026.10.6+5"
edition = "2021"
license = "MIT"
description = "A shared-memory audio bus: one writer, many readers, across processes"

# NO DEPENDENCIES, for the reason spectro-core states: every byte in the
# artefact is permissive AND ACCOUNTED FOR. This crate needs six POSIX calls
# and declares them itself (shm.rs) rather than pulling in libc -- which is
# MIT/Apache-2.0 and would be fine, but is 80,000 lines to borrow `mmap` from.
[dependencies]

# The counting allocator the no_alloc test installs. Test-only.
[dev-dependencies]
ni-testkit = { path = "../../../shared/crates/ni-testkit" }
