[package]
name = "bus-capi"
version = "2026.10.10+1"
edition = "2021"
license = "GPL-3.0-or-later"
description = "The C ABI that a sending plugin and a receiving plugin both link"
publish.workspace = true

[lib]
name = "bus_capi"
# staticlib for NI Listen-In to link; rlib so a receiving plugin's own archive
# (sc-capi) carries this surface too, without a second copy of the Rust
# runtime -- the rule spectro-capi/Cargo.toml states.
crate-type = ["staticlib", "rlib"]

[dependencies]
bus-core = { path = "../bus-core" }
# The handoff that lends the shell's main-thread objects to its audio thread.
# NOT a second static library: an rlib compiled INTO this one, since one
# archive per plugin is an invariant here (spectro-capi/Cargo.toml).
shell-capi = { path = "../../../shell/crates/shell-capi" }
# The one reading of a C string every engine's entry points share.
ni-dsp = { path = "../../../shared/crates/ni-dsp" }

# audio_bus.h, generated from src/ by build.rs.
[build-dependencies]
cbindgen = { workspace = true }

[dev-dependencies]
# The no-allocation guard tests/no_alloc.rs installs.
assert_no_alloc = { workspace = true, features = ["warn_debug", "warn_release"] }
