[package]
name = "bus-capi"
version = "2026.10.6+5"
edition = "2021"
license = "GPL-3.0-or-later"
description = "The C ABI that a sending plugin and a receiving plugin both link"
publish.workspace = true

[lib]
name = "bus_capi"
crate-type = ["staticlib"]

[dependencies]
bus-core = { path = "../bus-core" }
# The animated ground's beat clock. NOT a second static library -- see the note in
# ground-capi/Cargo.toml: one archive per plugin is an invariant here, so the
# ground's C ABI is compiled INTO this one, the same way spectro-capi reaches
# bus-core through spectro-recv.
ground-capi = { path = "../../../ground/crates/ground-capi" }
# The handoff that lends the shell's main-thread objects to its audio thread,
# carried in this archive for the ground's reason.
shell-capi = { path = "../../../shell/crates/shell-capi" }

# audio_bus.h, generated from src/ by build.rs.
[build-dependencies]
cbindgen = { workspace = true }
