[package]
name = "shell-capi"
version = "2026.10.6+3"
edition = "2021"
authors = ["Torben Gräber"]
license = "MIT"
description = "The shell_handoff_* C ABI: an object the main thread owns, lent to the audio thread"

# AN RLIB, for ground-capi's reason: one static library per plugin. A product's
# capi crate that needs these symbols depends on this one, so they end up in
# that product's single archive.
[lib]
name = "shell_capi"
crate-type = ["rlib"]

[dependencies]
shell-core = { path = "../shell-core" }
