[package]
name = "shell-core"
version = "2026.10.6+5"
edition = "2021"
authors = ["Torben Gräber"]
license = "GPL-3.0-or-later"
description = "How a plugin shell's threads reach an engine: a command queue in, a published snapshot out"
publish.workspace = true

[dependencies]
# The handoff (src/handoff.rs): an object lent to the audio thread as a
# reference-counted Shared, whose last release -- on whichever thread -- only
# queues it, and whose free is the collector's, on the main thread. No
# features to choose: the crate is no_std with alloc and has none.
basedrop = { workspace = true }

# The counting allocator the no_alloc test installs. Test-only.
[dev-dependencies]
ni-testkit = { path = "../../../shared/crates/ni-testkit" }
