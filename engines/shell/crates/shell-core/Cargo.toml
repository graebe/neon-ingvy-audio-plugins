[package]
name = "shell-core"
version = "2026.10.9+1"
edition = "2021"
authors = ["Torben Gräber"]
license = "GPL-3.0-or-later"
description = "How a plugin shell's threads reach an engine: a command queue in, a published snapshot out"
publish.workspace = true

[dependencies]
# The bridge's way in (src/bridge.rs): a wait-free ring of the product's own
# typed commands. `std` adds only std::error::Error for its error types.
rtrb = { workspace = true }
# The bridge's way out: the latest whole frame, handed over by one atomic
# swap, never torn and never waited for. Its one feature is for running Miri.
triple_buffer = { workspace = true }
# What crosses with a command or is lent to the audio thread (src/handoff.rs)
# is a reference-counted Shared whose last release -- on whichever thread --
# only queues it: the free is the collector's, on the main thread
# (src/reclaim.rs). No features to choose: the crate is no_std with alloc.
basedrop = { workspace = true }

# Test-only: built for the tests, shipped in nothing.
[dev-dependencies]
# The no-allocation guard tests/no_alloc.rs installs.
assert_no_alloc = { workspace = true, features = ["warn_debug", "warn_release"] }
# The property test (tests/round_trip.rs). `std` is its generator and its
# runner; fork, timeout and bit-set -- a process per case, a watchdog, a
# bit-set strategy -- are features nothing here uses.
proptest = { workspace = true, features = ["std"] }
