[package]
name = "ni-dsp"
version = "2026.10.8+1"
edition = "2021"
authors = ["Torben Gräber"]
license = "GPL-3.0-or-later"
description = "The DSP and C-compatibility pieces the Neon Ingvy engines share"
publish.workspace = true

# AN RLIB, for ground-capi's reason: one static library per plugin. Each
# product's crates absorb it into that product's single archive.
[lib]
crate-type = ["rlib"]

# ESTABLISHED CRATES, NOT HAND-WRITTEN ONES (docs/adr/0003-established-rust-crates.md),
# for the two parts of src/fmt.rs that core::fmt does not cover. Neither takes
# its default features: `std` is all they add, and nothing here needs it.
[dependencies]
# Reading numbers as C's strtod and atoi do (fmt::atof, fmt::atoi): the longest
# number at the front of the text, without allocating at any length. `format`
# is what lets src/fmt.rs narrow the grammar to the one this wire has carried.
lexical-core = { workspace = true, features = ["parse-floats", "parse-integers", "format"] }
# The scratch text %g is put together in (fmt::g): a string on the stack, with
# the capacity it is declared with and no more.
arrayvec = { workspace = true }

[dev-dependencies]
# The no-allocation guard tests/no_alloc.rs installs.
assert_no_alloc = { workspace = true, features = ["warn_debug", "warn_release"] }
