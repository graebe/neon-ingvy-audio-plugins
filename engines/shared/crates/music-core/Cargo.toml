[package]
name = "music-core"
description = "General music theory primitives: pitch classes, intervals, notes, chords and pitch-class sets"
keywords = ["music", "music-theory", "pitch", "harmony", "midi"]
categories = ["mathematics", "multimedia::audio", "no-std"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[features]
default = ["std"]
std = []

[lints]
workspace = true

[dev-dependencies]
criterion = { version = "0.7.0", features = ["html_reports"] }
proptest = "1.11.0"
rstest = "0.27.0"

[[bench]]
name = "core"
harness = false
