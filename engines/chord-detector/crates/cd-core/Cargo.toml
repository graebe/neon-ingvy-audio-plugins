[package]
name = "cd-core"
version = "2026.10.9+1"
edition = "2021"
authors = ["Torben Gräber"]
license = "GPL-3.0-or-later"
description = "NI Chord-Detector engine: what is sounding, and what it is called"
publish.workspace = true

[lib]
crate-type = ["rlib"]

[dependencies]
# The theory: naming a voicing, keys, modes and roman numerals. No std needed:
# the frequency methods are the only thing `std` adds, and nothing here asks.
music-core = { path = "../../../shared/crates/music-core", default-features = false }
# MIDI bytes to messages. Core-only without its `std` feature, as sc-core takes it.
wmidi = { workspace = true }

[dev-dependencies]
# The no-allocation guard tests/no_alloc.rs installs.
assert_no_alloc = { workspace = true, features = ["warn_debug", "warn_release"] }
rstest = { workspace = true }
proptest = { workspace = true, features = ["std"] }
