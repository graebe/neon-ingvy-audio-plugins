[workspace]
resolver = "2"
members = ["crates/spectro-core", "crates/spectro-capi"]

# THE AUDIO CALLBACK MUST NOT UNWIND.
#
# spectro_push_f32 runs on the host's audio thread, and unwinding a panic out
# of `extern "C"` into the C++ shell is undefined behaviour. Aborting is the
# honest failure: it is a crash either way, and this way it is one the OS
# reports rather than one that corrupts the host's stack on its way out.
#
# The same settings as the Trance Gate engine, for the same reasons, so the two
# libraries behave alike when something goes wrong in one of them.
[profile.release]
panic = "abort"
lto = true
codegen-units = 1
opt-level = 3
strip = true

[profile.dev]
panic = "abort"
