[package]
name = "spectro-core"
version = "2026.9.30+1"
edition = "2021"
license = "MIT"
description = "A short-time Fourier analyzer that hands finished spectrogram columns to a UI"

# NO DEPENDENCIES, AND THAT IS A LICENCE DECISION AS MUCH AS A TASTE ONE.
# The FFT here is one file (fft.rs). rustfft would be MIT/Apache-2.0 and
# perfectly usable, but this repository's whole premise is that every byte in
# the artefact is permissive AND ACCOUNTED FOR -- see THIRD_PARTY_LICENSES.md
# -- and a crate that needs no attribution is cheaper than one that does.
[dependencies]

# The counting allocator the no_alloc test installs. Test-only.
[dev-dependencies]
ni-testkit = { path = "../../../shared/crates/ni-testkit" }
