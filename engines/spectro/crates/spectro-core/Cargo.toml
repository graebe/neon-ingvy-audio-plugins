[package]
name = "spectro-core"
version = "2026.10.8+1"
edition = "2021"
license = "GPL-3.0-or-later"
description = "A short-time Fourier analyzer that hands finished spectrogram columns to a UI"
publish.workspace = true

# ESTABLISHED CRATES, NOT HAND-WRITTEN ONES (docs/adr/0003-established-rust-crates.md):
# the FFT, the ring the columns cross, and the range's atomics. The workspace
# takes each without its default features (the root Cargo.toml says why), and
# this crate asks back only for what it uses.
[dependencies]
# The real-input FFT (src/fft.rs), on rustfft's complex transforms. realfft's
# default features are exactly rustfft's SIMD paths -- AVX and SSE on x86_64,
# Neon on aarch64 -- and they are asked for by name because they are the point
# of the crate: each is used only where the CPU reports it.
realfft = { workspace = true, features = ["avx", "sse", "neon"] }
# The ring between the two halves (src/lib.rs). Its one default feature, `std`,
# adds std::error and io::Read/Write impls; the ring is the same without it.
rtrb = { workspace = true }
# The requested frequency range: two floats a dropdown stores while audio runs.
# The default feature adds AtomicF64, which nothing here needs.
atomic_float = { workspace = true }

[dev-dependencies]
# The oracle's transform (src/reference.rs): rustfft's complex FFT over all N
# points, so it shares none of realfft's packing or split. It is the rustfft
# realfft already links; nothing extra is built.
rustfft = { workspace = true }
# Seeded noise for the tests, reproducible run to run. `std` would add only
# the thread-local generator and entropy seeding, which a fixed seed never uses.
fastrand = { workspace = true }
# The no-allocation guard tests/no_alloc.rs installs.
assert_no_alloc = { workspace = true, features = ["warn_debug", "warn_release"] }
