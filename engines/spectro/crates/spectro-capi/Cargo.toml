[package]
name = "spectro-capi"
version = "2026.10.6+5"
edition = "2021"
license = "GPL-3.0-or-later"
description = "The C ABI the iPlug2 shell and any Schwung module link"
publish.workspace = true

[lib]
name = "spectro_capi"
crate-type = ["staticlib"]

[dependencies]
spectro-core = { path = "../spectro-core" }
# The receiver half. It brings bus-core with it, which is why libspectro_capi.a
# is still the ONE static library the shell links -- see cmake/NiRust.cmake.
spectro-recv = { path = "../spectro-recv" }
# The animated ground's beat clock. NOT a second static library -- see the note in
# ground-capi/Cargo.toml: one archive per plugin is an invariant here, so the
# ground's C ABI is compiled INTO this one, the same way spectro-capi reaches
# bus-core through spectro-recv.
ground-capi = { path = "../../../ground/crates/ground-capi" }
# The handoff that lends the shell's main-thread objects to its audio thread,
# carried in this archive for the ground's reason.
shell-capi = { path = "../../../shell/crates/shell-capi" }

# spectro_core.h and spectro_recv.h, generated from src/ by build.rs.
[build-dependencies]
cbindgen = { workspace = true }
