[package]
name = "spectro-recv"
version = "2026.9.29+1"
edition = "2021"
license = "MIT"
description = "Many sources into one picture: the Spectrogram's listen-in receiver."

# spectro-core is this engine's own; bus-core is the HOUSE TRANSPORT, which the
# workspace names as the one dependency a product crate may take outside its own
# engine. It depends on no product in return, which is the direction that
# matters. See the note at the top of the workspace Cargo.toml.
[dependencies]
spectro-core = { path = "../spectro-core" }
bus-core = { path = "../../../audio-bus/crates/bus-core" }

[lib]
crate-type = ["rlib"]
