[package]
name = "fd-core"
version = "2026.10.12+1"
edition = "2021"
authors = ["Torben Gräber"]
license = "GPL-3.0-or-later"
description = "NI Filter Designer DSP engine: sixteen filters in six families, an isolator, one curve"
publish.workspace = true

[lib]
crate-type = ["rlib"]

[dependencies]
# The DSP the products share: the parameter glide and C-compatible text.
ni-dsp = { path = "../../../shared/crates/ni-dsp" }
# What a parameter is, and the arithmetic every shell reads one with.
ni-params = { path = "../../../shared/crates/ni-params" }
# The filters: the families, the equaliser's shapes, the sections they run in.
ni-filter = { path = "../../../shared/crates/ni-filter" }
# MIDI bytes to messages, for the panic (CC 120/123): core-only.
wmidi = { workspace = true }

[dev-dependencies]
# The no-allocation guard tests/no_alloc.rs installs.
assert_no_alloc = { workspace = true, features = ["warn_debug", "warn_release"] }
proptest = { workspace = true, features = ["std"] }
# The tests' spectra.
realfft = { workspace = true }
