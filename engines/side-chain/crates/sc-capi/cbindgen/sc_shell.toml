#
# sc_shell.h, from src/shell.rs (build.rs). The Trance Gate's
# trance_gate_core.toml explains the settings every capi header shares.

language = "C"
style = "type"
cpp_compat = true
no_includes = true
# sc_core_t, which sc_shell_begin lends, is the core header's.
includes = ["sc_core.h"]
documentation_style = "c99"
include_guard = "SC_SHELL_H"
header = """// SPDX-License-Identifier: GPL-3.0-or-later
// Copyright (C) 2026 Torben Gräber

// sc_shell.h -- the Side-Chain engine as a plugin shell holds it, `sc_shell_*`.
//
// GENERATED at build time by cbindgen from
// engines/side-chain/crates/sc-capi/src/shell.rs, whose doc comments are the
// comments below: edit that, not this."""

# The opaque handle keeps its old struct tag, declared here rather than by
# cbindgen: trance_gate_core.toml says why.
after_includes = """

typedef struct ScShell sc_shell_t;"""

[export]
exclude = ["ScShell"]

[export.rename]
"ScCore" = "sc_core_t"
"ScShell" = "sc_shell_t"
