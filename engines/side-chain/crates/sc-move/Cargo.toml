[package]
name = "sc-move"
version = "2026.10.8+2"
edition = "2021"
authors = ["Torben Gräber"]
license = "GPL-3.0-or-later"
description = "The Schwung audio_fx v2 shell for NI Side-Chain"
publish.workspace = true

[lib]
name = "sc_move"
crate-type = ["cdylib", "staticlib"]

[dependencies]
sc-core = { path = "../sc-core" }
# Pulled in so ONE staticlib carries both surfaces: the Schwung vtable and the
# sc_core_* ABI the tests and the plugin link. Two staticlibs would each
# bundle their own copy of the Rust runtime and collide. Without its `shell`
# feature: the plugin shell and the ground are the plugin's, and nothing on the
# Move calls them (sc-capi's Cargo.toml).
sc-capi = { path = "../sc-capi", default-features = false }
# The Schwung audio_fx v2 glue, shared with every module.
ni-schwung = { path = "../../../shared/crates/ni-schwung" }

[dev-dependencies]
# The chain_params tests read the declaration as JSON (src/params.rs): the
# parser tg-core already links, with tg-core's features, so a test build adds
# no second configuration of it.
serde_json = { workspace = true, features = ["alloc"] }
