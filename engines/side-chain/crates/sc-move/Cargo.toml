[package]
name = "sc-move"
version = "2026.10.6+4"
edition = "2021"
authors = ["Torben Gräber"]
license = "MIT"
description = "The Schwung audio_fx v2 shell for NI Side-Chain"

[lib]
name = "sc_move"
crate-type = ["cdylib", "staticlib"]

[dependencies]
sc-core = { path = "../sc-core" }
# Pulled in so ONE staticlib carries both surfaces: the Schwung vtable and the
# sc_core_* ABI the tests and the plugin link. Two staticlibs would each
# bundle their own copy of the Rust runtime and collide.
sc-capi = { path = "../sc-capi" }
# The Schwung audio_fx v2 glue, shared with every module.
ni-schwung = { path = "../../../shared/crates/ni-schwung" }
