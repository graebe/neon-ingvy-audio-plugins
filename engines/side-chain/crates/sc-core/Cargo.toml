[package]
name = "sc-core"
version = "2026.10.9+1"
edition = "2021"
authors = ["Torben Gräber"]
license = "GPL-3.0-or-later"
description = "NI Side-Chain DSP engine: a cycle-, MIDI- or sidechain-triggered ducker"
publish.workspace = true

[lib]
crate-type = ["rlib"]

[dependencies]
# The DSP the products share; product-free. See the workspace Cargo.toml.
ni-dsp = { path = "../../../shared/crates/ni-dsp" }
# MIDI bytes to messages, for the MIDI trigger (src/midi.rs). Without its
# default `std` feature it is core-only: that feature adds an owned SysEx and
# io::Read, and a ducker has a use for neither.
wmidi = { workspace = true }

[dev-dependencies]
# The no-allocation guard tests/no_alloc.rs installs.
assert_no_alloc = { workspace = true, features = ["warn_debug", "warn_release"] }
