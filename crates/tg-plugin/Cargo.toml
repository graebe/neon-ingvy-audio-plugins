[package]
name = "tg-plugin"
version = "1.0.0"
edition = "2021"
license = "MIT"
description = "Trance Gate -- a tempo-locked step gate with a per-step ADSR"
authors = ["graebe"]

[lib]
# Both, and both are needed: `cdylib` is what a host loads, `lib` is what the
# unit tests and any offline harness link.
crate-type = ["cdylib", "lib"]

[dependencies]
nih_plug = { git = "https://github.com/robbert-vdh/nih-plug.git" }
# THE ENGINE, AS A RUST CRATE RATHER THAN THROUGH ITS C ABI. This is the same
# tg-core that ships in the Move module -- the submodule is pinned by commit,
# so "it sounds different in Live" cannot happen through a second copy.
#
# Going in by the front door costs nothing and removes a lot: no tg_core_set_num
# integer wire, no snprintf/atof round trip on every readout, no lock the audio
# thread has to take, and the engine's fields are simply readable.
tg-core = { path = "../../external/schwung-trance-gate/crates/tg-core" }
