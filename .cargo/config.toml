# Tuning for the hardware the module actually runs on.
#
# The Move is a Cortex-A72 (CPU implementer 0x41, part 0xd08, features
# "fp asimd evtstrm crc32 cpuid"). The C build always said
# `-march=armv8-a -mtune=cortex-a72`; this is the same statement to rustc,
# and it was worth making: measured on the device over 20,000 blocks,
# process_block's median went 6.06us -> 5.57us.
#
# It changes scheduling, not arithmetic. Verified rather than assumed: the
# golden render produced ON THE DEVICE with this flag was
# 3992810c52d7962b4d25b3a30494ee2e, the hash the host suite pinned at the time
# (since re-recorded for intended sound changes -- see
# engines/trance-gate/tests/run.sh).
[target.aarch64-unknown-linux-gnu]
rustflags = ["-C", "target-cpu=cortex-a72"]

# EVERY `cargo test` GETS A PRIVATE SET OF AUDIO BUSES.
#
# The bus's shared-memory names are global to the user, so two checkouts
# testing at once -- or a test run beside a Live session -- would claim and
# unlink each other's slots. bus-core hashes NIA_BUS_NS into the names when it
# is set; this sets it to the checkout's own path, so each checkout's tests
# meet only themselves. It reaches the processes cargo runs (tests), not the
# libraries it builds: a plugin in a host never sees it and uses the real
# names. The C tests set their own, per process -- see tests/abus_ipc.c.
[env]
NIA_BUS_NS = { value = ".", relative = true }
